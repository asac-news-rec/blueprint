"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">  \"article_id\": 42,<\/text><line x1=\"600\" y1=\"235\" x2=\"632\" y2=\"235\" stroke=\"#7c3aed\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"640\" y=\"240\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">어느 기사였나<\/text><text x=\"48\" y=\"272\" font-size=\"15\" font-weight=\"normal\" fill=\"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">  \"position\": 3,<\/text><line x1=\"600\" y1=\"267\" x2=\"632\" y2=\"267\" stroke=\"#7c3aed\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"640\" y=\"272\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">피드에서 몇 번째 자리에 있었나<\/text><text x=\"48\" y=\"304\" font-size=\"15\" font-weight=\"normal\" fill=\"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">  \"ts\": \"2026-11-10T09:05:12Z\",<\/text><line x1=\"600\" y1=\"299\" x2=\"632\" y2=\"299\" stroke=\"#7c3aed\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"640\" y=\"304\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">언제 (폴더 dt/hh/mm 를 정하는 기준)<\/text><text x=\"48\" y=\"336\" font-size=\"15\" font-weight=\"normal\" fill=\"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">  \"schema_version\": 1<\/text><line x1=\"600\" y1=\"331\" x2=\"632\" y2=\"331\" stroke=\"#7c3aed\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"640\" y=\"336\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">형식 버전 (나중에 칸을 추가해도 구분 가능)<\/text><text x=\"48\" y=\"368\" font-size=\"15\" font-weight=\"normal\" fill=\"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">}<\/text><text x=\"30\" y=\"430\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">같은 모양으로 노출 1건과 클릭 1건<\/text><rect x=\"30\" y=\"442\" width=\"1140\" height=\"66\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"46\" y=\"468\" font-size=\"13\" font-weight=\"normal\" fill=\"#0f172a\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">{\"event_type\":\"impression\",\"user_id\":\"u_9f2a\",\"article_id\":42,\"position\":3,\"ts\":\"09:05:10\"}<\/text><text x=\"46\" y=\"494\" font-size=\"13\" font-weight=\"normal\" fill=\"#0f172a\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">{\"event_type\":\"click\",     \"user_id\":\"u_9f2a\",\"article_id\":42,\"position\":3,\"ts\":\"09:05:12\"}<\/text><\/svg><figcaption>이벤트 한 줄 해부<\/figcaption><\/figure>\n<p><b>2. \"노출 기록\"은 피드 한 화면에 기사 몇 건이 보였는지를 적는 건가? CTR은 \"몇 건 중 몇 건 눌렀나\"인가?<\/b><\/p>\n<ul>\n<li>둘 다 맞다. 피드에 기사 10건이 보였으면 노출 10건(기사마다 1줄, 또는 화면 1줄에 기사 번호 배열), 그중 2건을 눌렀으면 클릭 2건이다.\n<\/li><li><b>CTR = 클릭 수 ÷ 노출 수 = 2 ÷ 10 = 20%.<\/b> 멘토가 CTR을 1순위 지표로 말했다. [멘토]\n<\/li><li>노출을 언제 기록하나(응답을 보낸 시점 vs 화면에 실제로 보인 시점)는 팀이 정할 일. MVP는 \"응답을 보낸 시점\"이 가장 단순하다. [제안]\n<\/li><\/ul>\n<p><b>3. \"노출 포함 여부\"는 무슨 뜻인가?<\/b><\/p>\n<ul>\n<li>\"수집하는 이벤트에 노출을 넣을 것인가 말 것인가\"를 팀이 정하라는 뜻이다.\n<\/li><li>안 넣으면: 클릭 수는 알지만 분모(노출 수)를 몰라 CTR을 못 구한다. 학습 데이터에 \"안 눌린 사례(0)\"도 만들 수 없다(8-5 참고).\n<\/li><li>넣으면: 로그 양이 클릭의 약 10배로 늘지만 하루 수천 건 수준이면 문제가 없다(8-2 계산). 그래서 \"넣자\"가 제 제안. 팀 확인 필요.\n<\/li><\/ul>\n<p><b>4. \"분석은 뒤의 배치가 합니다\"는?<\/b><\/p>\n<ul>\n<li>로깅 서버는 받아서 <b>파일로 저장만<\/b> 한다. 클릭률 계산·집계 같은 분석은 정해진 시간에 도는 <b>Airflow 배치<\/b>가 파일을 읽어서 BigQuery에서 한다.\n<\/li><li>편의점으로 비유: 계산대는 영수증을 쌓기만 하고(로깅 서버), 마감 정산은 점장이 밤에 한다(배치). 계산대가 정산까지 하면 손님 줄이 길어진다. [일반]\n<\/li><\/ul>\n<p><b>5. \"_SUCCESS\"는 왜 그런 이름인가? 로그 적재가 성공했다는 뜻인가?<\/b><\/p>\n<ul>\n<li>폴더가 아니라 <b>내용이 비어 있는 파일<\/b>이다. 이름은 Hadoop/Spark 세계의 관례(\"이 작업이 끝까지 성공했다\"는 표시 파일)를 따온 것이다. [일반]\n<\/li><li>의미: \"이 5분 폴더는 파일 쓰기가 완전히 끝났다.\" 서버가 다 쓰고 나서 마지막에 만든다. 배치는 <code>_SUCCESS<\/code>가 있는 폴더만 읽어서, 쓰다 만 반쪽 파일을 읽는 사고를 막는다.\n<\/li><li>우리가 이 관례를 쓸지는 팀 결정이다(제안). 그림은 8-3.\n<\/li><\/ul>\n<p><b>6. \"거꾸로 되짚기\"<\/b> (다시 질문하신다고 해서 짧은 한 사슬 예시만)<\/p>\n<ul>\n<li>모델이 쓰고 싶은 피처: \"독자의 최근 7일 IT 기사 클릭률\"\n<\/li><li>그 피처를 만들려면 필요한 원료: 독자별·카테고리별 노출 수와 클릭 수\n<\/li><li>그 원료가 로그에 있으려면 이벤트에 필요한 칸: <code>event_type<\/code>(노출/클릭), <code>user_id<\/code>, <code>article_id<\/code>, 기사 카테고리(또는 article_id로 조회), <code>ts<\/code>\n<\/li><li>즉 \"피처 → 원료 → 이벤트 칸\" 순서로 거꾸로 걸어 내려가 <b>수집할 이벤트 목록을 확정<\/b>하는 방법이다. [멘토 숙제 5번]\n<\/li><\/ul>\n<p><b>7. \"Cloud Run은 올리면 알아서 실행\"에서 어디에 올린다는 건가?<\/b><\/p>\n<ul>\n<li>올리는 것 = 프로그램을 담은 <b>컨테이너 이미지<\/b>. 올리는 곳 = <b>Artifact Registry<\/b>(이미지 창고).\n<\/li><li>순서: ① Dockerfile로 이미지를 만든다 → ② Artifact Registry에 push → ③ <code>gcloud run deploy --image &lt;이미지&gt;<\/code>(또는 Terraform의 Cloud Run 리소스) → ④ 주소(URL)가 생기고 요청이 오면 켜지고, 요청이 없으면 0개로 줄어든다.\n<\/li><li>GKE는 같은 이미지를 K8s 설정 파일(yaml/Helm)로 띄운다는 점만 다르다. [일반]\n<\/li><\/ul>\n<p><b>8. Redis를 쓰는 3가지 (전혀 이해 못 했다고 하신 부분)<\/b><\/p>\n<ul>\n<li>Redis = 메모리 속 \"키 → 값\" 사전. DB보다 훨씬 빠르지만 용량이 작고 날아갈 수 있다. [일반]\n<\/li><li>① <b>캐시<\/b>: 같은 질문의 답을 기억. 인기 기사 10건을 매번 DB에서 뽑지 않고 메모리에서 바로 답한다.\n<\/li><li>② <b>온라인 피처<\/b>: 추천 요청 순간에 필요한 값을 즉시 읽기. \"민수의 최근 클릭 5건\"을 BigQuery에서 읽으면 느리니, 배치가 만든 값을 Redis에 복사해 둔다.\n<\/li><li>③ <b>카운터<\/b>: 기사별 오늘 클릭 수를 클릭이 올 때마다 +1.\n<\/li><li>중요: 멘토가 Memorystore를 말한 <b>이유는 설명되지 않았다<\/b>. 위 3가지는 일반 용도이고, 우리가 어느 용도로 쓰는지는 10/31에 멘토에게 묻는다. MVP는 Redis 없이 Cloud SQL로도 가능하다. [일반 + 미확인]\n<\/li><\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"4 "auto\"><path d=\"M0 0 L10 4 L0 8 z\" fill=\"#475569\"/><\/marker><\/defs><rect width=\"1200\" height=\"470\" fill=\"#ffffff\"/><text x=\"30\" y=\"36\" font-size=\"22\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Redis 를 쓰는 3가지 (메모리 속 \"키 → 값\" 사전)<\/text><rect x=\"30\" y=\"70\" width=\"370\" height=\"270\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#6b7280\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"46\" y=\"102\" font-size=\"19\" font-weight=\"bold\" fill=\"#0f172a\" text-anchor=\"start\" xml:space=\"preserve\">① 캐시<\/text><text x=\"46\" y=\"126\" font-size=\"13\" font-weight=\"bold\" fill=\"#475569\" text-anchor=\"start\" xml:space=\"preserve\">같은 질문의 답을 기억해 두기<\/text><text x=\"46\" y=\"156.0\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">예) 인기 기사 10건을 매번 DB 에서 뽑지 않고<\/text><text x=\"46\" y=\"175.5\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">메모리에서 바로 답한다<\/text><rect x=\"46\" y=\"236\" width=\"338\" height=\"34\" rx=\"6\" fill=\"#0f172a\" stroke=\"#0f172a\" stroke-width=\"2\"/><text x=\"58\" y=\"258\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#86efac\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">rec:popular → [42, 17, 8, …]<\/text><text x=\"46\" y=\"300\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">응답이 DB 보다 훨씬 빠름<\/text><rect x=\"415\" y=\"70\" width=\"370\" height=\"270\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#6b7280\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"431\" y=\"102\" font-size=\"19\" font-weight=\"bold\" fill=\"#0f172a\" text-anchor=\"start\" xml:space=\"preserve\">② 온라인 피처<\/text><text x=\"431\" y=\"126\" font-size=\"13\" font-weight=\"bold\" fill=\"#475569\" text-anchor=\"start\" xml:space=\"preserve\">추천 요청 순간에 필요한 값을 즉시 읽기<\/text><text x=\"431\" y=\"156.0\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">예) 추천할 때 \"민수의 최근 클릭 5건\" 이 바로<\/text><text x=\"431\" y=\"175.5\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">필요한데 BigQuery 는 느리다<\/text><rect x=\"431\" y=\"236\" width=\"338\" height=\"34\" rx=\"6\" fill=\"#0f172a\" stroke=\"#0f172a\" stroke-width=\"2\"/><text x=\"443\" y=\"258\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#86efac\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">feat:u_9f2a:recent → [IT, IT, 스포츠]<\/text><text x=\"431\" y=\"300\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">배치가 만든 값을 복사해 둠<\/text><rect x=\"800\" y=\"70\" width=\"370\" height=\"270\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#6b7280\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"816\" y=\"102\" font-size=\"19\" font-weight=\"bold\" fill=\"#0f172a\" text-anchor=\"start\" xml:space=\"preserve\">③ 카운터<\/text><text x=\"816\" y=\"126\" font-size=\"13\" font-weight=\"bold\" fill=\"#475569\" text-anchor=\"start\" xml:space=\"preserve\">숫자를 빠르게 +1<\/text><text x=\"816\" y=\"156.0\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">예) 기사별 오늘 클릭 수를 클릭이 올 때마다 바로<\/text><text x=\"816\" y=\"175.5\" font-size=\"13\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">올린다<\/text><rect x=\"816\" y=\"236\" width=\"338\" height=\"34\" rx=\"6\" fill=\"#0f172a\" stroke=\"#0f172a\" stroke-width=\"2\"/><text x=\"828\" y=\"258\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#86efac\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">cnt:article:42:clicks → 128<\/text><text x=\"816\" y=\"300\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">INCR 한 번이면 끝<\/text><rect x=\"30\" y=\"360\" width=\"1140\" height=\"90\" rx=\"10\" fill=\"#fff7ed\" stroke=\"#ea580c\" stroke-width=\"2\"/><text x=\"46\" y=\"388\" font-size=\"14\" font-weight=\"bold\" fill=\"#9a3412\" text-anchor=\"start\" xml:space=\"preserve\">주의: 멘토가 Memorystore 를 핵심 제품으로 말했지만 \"무엇에 쓰는지\"는 설명하지 않았다.<\/text><text x=\"46\" y=\"412\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">• 위 3가지는 일반적인 용도(제 설명)이고, 우리 MVP 가 어느 것을 쓸지는 10/31(토) 멘토에게 질문해서 확정.<\/text><text x=\"46\" y=\"434\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">• 배치 기반 MVP 는 Redis 없이 Cloud SQL 테이블만으로도 돌릴 수 있음 → Redis 는 \"필요해졌을 때 추가\"가 안전.<\/text><\/svg><figcaption>Redis 3가지 용도<\/figcaption><\/figure>\n<h3>8-2. [0절 \"받을 것\"] 질문<\/h3>\n<p><b>\"받을 것 중 기사 컬럼\"은 기사 테이블의 컬럼 목록인가?<\/b> → 네.<\/p>\n<ul>\n<li>기사 테이블(Cloud SQL)에 어떤 칸(컬럼)이 있는지 기사 담당에게 받으라는 뜻이다. 세호 님이 만든 프론트 프로토타입에는 이미 <code>id, title, summary, category, publishedAt, body, art<\/code>가 있다(팀 레포 frontend). 이것을 출발점으로 확인하면 된다. [팀 레포]\n<\/li><li>인프라 담당(나)이 이걸 받는 이유: DB 테이블을 만들려면 칸이 필요하다.\n<\/li><\/ul>\n<p><b>\"이벤트 필드\"와 \"하루 이벤트 수\"는?<\/b><\/p>\n<ul>\n<li><b>이벤트 필드<\/b> = 이벤트 한 줄에 들어가는 칸(8-1 그림의 event_type, user_id, article_id, ts …).\n<\/li><li><b>하루 이벤트 수<\/b> = 하루에 기록이 몇 줄 쌓이는지 추정한 값. 저장 용량·배치 시간·\"Pub/Sub가 필요한가\"를 판단하는 근거다.\n<\/li><li>계산 예(가정): 독자 100명 × 하루 5번 접속 × 한 번에 노출 10건 = 노출 5,000줄. 클릭률 10%면 클릭 500줄. 합계 약 5,500줄/일. 한 줄 300바이트면 하루 약 1.6MB로 아주 작다. 그래서 MVP는 \"파일로 바로 저장\"으로 충분하다는 멘토 방향과 맞는다. [제안, 숫자는 가정]\n<\/li><\/ul>\n<p><b>어떤 피처를 쓸지 정하는 건 우리의 몫인가?<\/b> → 네, 팀 몫이다.<\/p>\n<ul>\n<li>멘토 숙제 5번이 \"피처 목록을 쓰고, 거꾸로 이벤트를 도출\"하는 것이다. 초안은 처리·추천 담당이 쓰는 게 자연스럽다(담당은 추정). 인프라 담당은 그 피처를 <b>어디에 저장하고 어떻게 서빙하는지<\/b>(BigQuery, 필요하면 Redis)를 맞춘다. [멘토 + 추정]\n<\/li><\/ul>\n<h3>8-3. [(3) GCS 파티션] 질문<\/h3>\n<p><b><code>_SUCCESS<\/code>는 폴더인가, 다 들어왔다는 표시인가?<\/b> → 폴더가 아니라, 다 들어왔다는 표시용 빈 파일이다. 그림으로:<\/p>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"560\" viewBox=\"0 0 1200 560\" font-family=\"'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif\" xmlns:c2pa=\"http://c2pa.org/manifest\"><metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYTo0MDZlMjA1ZC00YjBiLTQ4ZjQtOGM1Yy0zOGU3NTc3OGExN2EAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaKfpyqDN3FX9PmRrOYme7SkAAABwY2JvcqNpZGM6Zm9ybWF0bWltYWdlL3N2Zyt4bWxqaW5zdGFuY2VJRHgseG1wOmlpZDoxNGU0YTUwOS01YWRmLTQ3NGUtYWMyYi0yNzczYzBkMzU1N2ZscmVsYXRpb25zaGlwaHBhcmVudE9mAAAB4mp1bWIAAABBanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5hY3Rpb25zLnYyAAAAABhjMnNoMbwgt0Y3CR3MTuchhrXyhQAAAZljYm9yomdhY3Rpb25zgqJmYWN0aW9ua2MycGEub3BlbmVkanBhcmFtZXRlcnOha2luZ3JlZGllbnRzgaJjdXJseC1zZWxmI2p1bWJmPWMycGEuYXNzZXJ0aW9ucy9jMnBhLmluZ3JlZGllbnQudjNkaGFzaFggqq+jdvPhVBTpaNI5I4XVJiF6ljXmaIlLj/+ojeJXAtCkZmFjdGlvbngdY29tLmFudGhyb3BpYy5jbGF1ZGUucHJvdmlkZWRqcGFyYW1ldGVyc6F4H2NvbS5hbnRocm9waWMub3JpZ2luLWNvbmZpZGVuY2VndW5rbm93bmtkZXNjcmlwdGlvbnhmQ2xhdWRlIHByb3ZpZGVkIHRoaXMgZmlsZSBhdCB0aGUgcmVxdWVzdCBvZiBhIHVzZXIgYW5kIG1heSBoYXZlIGNyZWF0ZWQgb3IgbW9kaWZpZWQgdGhlIGZpbGUgY29udGVudHMubXNvZnR3YXJlQWdlbnShZG5hbWVmQ2xhdWRlcmFsbEFjdGlvbnNJbmNsdWRlZPUAAADIanVtYgAAAEBqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmhhc2guZGF0YQAAAAAYYzJzaGu5dVZGdKTlpS1nI2iJAWQAAACAY2JvcqVjYWxnZnNoYTI1NmNwYWRNAAAAAAAAAAAAAAAAAGRoYXNoWCDZYKQYLhykXWpyaJnwG/53ZqwEgZpiFNsLzNxMIxaHDWRuYW1lbmp1bWJmIG1hbmlmZXN0amV4Y2x1c2lvbnOBomVzdGFydBj6Zmxlbmd0aBkeBAAAAj5qdW1iAAAAJ2p1bWRjMmNsABEAEIAAAKoAOJtxA2MycGEuY2xhaW0udjIAAAACD2Nib3KlY2FsZ2ZzaGEyNTZpc2lnbmF0dXJleE1zZWxmI2p1bWJmPS9jMnBhL3VybjpjMnBhOjQwNmUyMDVkLTRiMGItNDhmNC04YzVjLTM4ZTc1Nzc4YTE3YS9jMnBhLnNpZ25hdHVyZWppbnN0YW5jZUlEeCx4bXA6aWlkOmFlMjBjNDNiLThjNDctNDJiZC05YmM2LTk4NzUwOTFkOTUzM3J solas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">      │    └─ _SUCCESS            ← 비어 있음 · \"이 5분은 다 들어옴\"<\/text><text x=\"46\" y=\"296\" font-size=\"14\" font-weight=\"normal\" fill=\"#e2e8f0\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">      └─ mm=05/<\/text><text x=\"46\" y=\"330\" font-size=\"14\" font-weight=\"normal\" fill=\"#fca5a5\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">           └─ part-0001.jsonl     ← 아직 쓰는 중 (_SUCCESS 없음)<\/text><text x=\"46\" y=\"364\" font-size=\"14\" font-weight=\"normal\" fill=\"#fca5a5\" text-anchor=\"start\" font-family=\"'D2Coding','Consolas','DejaVu Sans Mono','WenQuanYi Zen Hei Mono',monospace\" xml:space=\"preserve\">                                    → 배치가 이 폴더는 건너뜀<\/text><text x=\"700\" y=\"86\" font-size=\"17\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">왜 이렇게 하나<\/text><text x=\"700\" y=\"112.0\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">파일을 쓰는 중에 배치가 읽으면 반쪽짜리 데이터를 읽는다. 그래서<\/text><text x=\"700\" y=\"133.7\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">서버는 다 쓰고 나서 마지막에 빈 파일 _SUCCESS 를 만든다. 배치는<\/text><text x=\"700\" y=\"155.4\" font-size=\"14\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">_SUCCESS 가 있는 폴더만 읽는다.<\/text><text x=\"700\" y=\"212.0\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">이름은 Hadoop/Spark 에서 쓰던 관례를 그대로 쓴 것이다. 로그 적재가<\/text><text x=\"700\" y=\"232.15\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">성공했다는 뜻이라기보다 \"이 폴더 쓰기가 끝까지 성공했다\"는<\/text><text x=\"700\" y=\"252.3\" font-size=\"13\" font-weight=\"normal\" fill=\"#6b7280\" text-anchor=\"start\" xml:space=\"preserve\">표식이다. (우리가 채택할지는 팀 결정, 제안)<\/text><text x=\"30\" y=\"430\" font-size=\"17\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">\"폴더가 짧을수록 파일 수가 늘어난다\"의 뜻 (폴더 단위 = 몇 분치를 한 폴더에 담나)<\/text><rect x=\"30\" y=\"448\" width=\"560\" height=\"100\" rx=\"10\" fill=\"#f5f3ff\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><text x=\"46\" y=\"476\" font-size=\"15\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">5분 폴더 (멘토 권장)<\/text><text x=\"46\" y=\"500\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">하루 288개 폴더 → 파일이 많고 작다<\/text><text x=\"46\" y=\"522\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">장점: 실패해도 그 5분만 재처리 · 빨리 읽을 수 있음<\/text><rect x=\"610\" y=\"448\" width=\"560\" height=\"100\" rx=\"10\" fill=\"#f9fafb\" stroke=\"#6b7280\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"626\" y=\"476\" font-size=\"15\" font-weight=\"bold\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">1시간 폴더<\/text><text x=\"626\" y=\"500\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">하루 24개 폴더 → 파일이 적고 크다<\/text><text x=\"626\" y=\"522\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">단점: 실패하면 1시간치를 다시 · 반영이 늦음 (\"너무 길다\" – 멘토)<\/text><\/svg><figcaption>GCS 폴더와 _SUCCESS<\/figcaption><\/figure>\n<p><b>\"폴더가 짧을수록 파일 수가 늘어난다\"는?<\/b><\/p>\n<ul>\n<li>폴더 하나에 담는 시간 길이가 짧을수록(5분 &lt; 1시간) 하루에 폴더·파일이 많아지고 하나하나는 작아진다는 뜻이다. 5분 단위는 하루 288개, 1시간 단위는 24개 폴더.\n<\/li><li>5분: 실패해도 그 5분만 다시 처리하고 반영이 빠르다. 대신 작은 파일이 많다.\n<\/li><li>1시간: 파일이 적고 관리가 쉽지만 실패하면 1시간치를 다시 하고 반영이 늦다. 멘토는 \"한 시간은 너무 길다\"고 했다. [멘토]\n<\/li><li>우리는 하루 수천 줄이라 파일이 작아도 문제가 없다. 큰 서비스에서만 \"작은 파일이 너무 많은\" 문제가 생긴다. [일반]\n<\/li><\/ul>\n<h3>8-4. [(5) 거꾸로 부분 + 읽기 불편]<\/h3>\n<p><b>표가 VS Code에서 줄글로 보이는 문제<\/b><\/p>\n<ul>\n<li>원인: 마크다운 파일을 <b>편집기(소스) 화면<\/b>으로 열어서 표가 <code>| a | b |<\/code> 글자 그대로 보인다. 표 자체가 깨진 것이 아니다.\n<\/li><li>해결 1: 파일을 연 채 <code>Ctrl+Shift+V<\/code>(Mac <code>Cmd+Shift+V<\/code>) 또는 오른쪽 위 \"미리보기\" 아이콘 → 표와 그림이 그려진다.\n<\/li><li>해결 2: 같은 이름의 <code>.html<\/code> 파일을 브라우저로 연다(청사진_정리.html).\n<\/li><li>앞으로 새로 쓰는 내용은 표를 줄이고 목록 위주로 쓰겠다.\n<\/li><\/ul>\n<p><b>GCS에서도 S3처럼 메달리온(브론즈/실버/골드) 폴더로 정제 데이터를 정리할까?<\/b><\/p>\n<ul>\n<li>가능하다. GCS의 폴더는 이름 앞부분(접두어)일 뿐이라 <code>bronze/ silver/ gold/<\/code>로 나눠도 된다. [일반]\n<\/li><li>다만 이번 방향(멘토: 배치는 BigQuery)에서는 이렇게 나누는 것이 더 단순하다. [제안]\n<ul>\n<li>브론즈(원본) = <b>GCS raw<\/b> (<code>events/dt=/hh=/mm=/<\/code>)\n<\/li><li>실버(정제) = <b>BigQuery clean 데이터셋<\/b>\n<\/li><li>골드(피처·집계) = <b>BigQuery feature 데이터셋<\/b>\n<\/li><\/ul>\n<\/li><li>학습용 파일(parquet 등)을 따로 내보낼 때만 GCS에 <code>gold/<\/code> 폴더를 추가하면 된다. 어디까지 하느냐는 팀·멘토 확인 사항.\n<\/li><\/ul>\n<h3>8-5. [4. 피처 목록] \"한 줄이 (사용자, 기사, 시점) 1건이고 마지막 칸이 정답\"?<\/h3>\n<ul>\n<li>모델 학습용 표의 <b>한 줄 = \"그 독자에게 그 기사가 그 시점에 노출된 1번의 사례\"<\/b>이다. 앞쪽 칸은 사용자·기사·시점을 설명하는 피처이고, <b>마지막 칸 <code>clicked<\/code>가 정답<\/b>(눌렀으면 1, 안 눌렀으면 0)이다.\n<\/li><li>예: 민수에게 기사 42가 09:05에 보였고 눌렀다 → 1. 같은 민수에게 기사 17도 보였지만 안 눌렀다 → 0.\n<\/li><li>이 때문에 <b>노출 이벤트가 꼭 필요<\/b>하다. 클릭한 줄(1)만 있으면 \"무엇이 안 눌리는지\"를 배울 수 없다.\n<\/li><\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"520\" viewBox=\"0 0 1200 520\" font-family=\"'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif\" xmlns:c2pa=\"http://c2pa.org/manifest\"><metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYTo5MjY0ZmFiYy0xMzliLTRmY2YtODYyMC0yYzljYjkzMTViMjYAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaOE1QMr1MaCychwx9p8iE/cAAABwY2JvcqNpZGM6Zm9ybWF0bWltYWdlL3N2Zyt4bWxqaW5zdGFuY2VJRHgseG1wOmlpZDo4 raform에 <code>google_redis_instance<\/code> 블록 한 개 → apply → 몇 분 뒤 주소가 나오면 접속만 하면 된다. 패치·백업·장애 교체는 구글이 한다. 켜 두는 동안 고정 요금.\n<\/li><li><b>직접(GKE에 Valkey)<\/b>: <code>helm install<\/code>(또는 Terraform <code>helm_release<\/code>) → Pod가 뜸 → 클러스터 안 주소로 접속. Pod가 죽으면 K8s가 다시 띄우지만, 디스크·백업·버전업은 우리가 챙겨야 한다. 이미 켜 둔 노드 안에서 돌아 추가 요금은 거의 없다.\n<\/li><li>멘토 타협안(10/28): RDB는 매니지드 OK, Redis·Airflow·ML 컴포넌트는 직접. 쿠버 운영을 배우고 비용을 줄이려는 것이다. [멘토]\n<\/li><\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"560\" viewBox=\"0 0 1200 560\" font-family=\"'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif\" xmlns:c2pa=\"http://c2pa.org/manifest\"><metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYTozYjMyZTRiNS1kODFjLTQ5OWUtYjNlMS1hMWU4YzAyY2YwNWUAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaKOtMDirDnhuLqd2dEKieZwAAABwY2JvcqNpZGM6Zm9ybWF0bWltYWdlL3N2Zyt4bWxqaW5zdGFuY2VJRHgseG1wOmlpZDo4OWI5YWM5MC04YWZiLTRiNDctODE4MC00YmY2Njc5NmYwNjFscmVsYXRpb25zaGlwaHBhcmVudE9mAAAB4mp1bWIAAABBanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5hY3Rpb25zLnYyAAAAABhjMnNo1qv4bHObk8dunC1D/uHVjQAAAZljYm9yomdhY3Rpb25zgqJmYWN0aW9ua2MycGEub3BlbmVkanBhcmFtZXRlcnOha2luZ3JlZGllbnRzgaJjdXJseC1zZWxmI2p1bWJmPWMycGEuYXNzZXJ0aW9ucy9jMnBhLmluZ3JlZGllbnQudjNkaGFzaFggQPqfbvKtQ1mXedRYljFFX47+4ePypevZivBlOVvZUomkZmFjdGlvbngdY29tLmFudGhyb3BpYy5jbGF1ZGUucHJvdmlkZWRqcGFyYW1ldGVyc6F4H2NvbS5hbnRocm9waWMub3JpZ2luLWNvbmZpZGVuY2VndW5rbm93bmtkZXNjcmlwdGlvbnhmQ2xhdWRlIHByb3ZpZGVkIHRoaXMgZmlsZSBhdCB0aGUgcmVxdWVzdCBvZiBhIHVzZXIgYW5kIG1heSBoYXZlIGNyZWF0ZWQgb3IgbW9kaWZpZWQgdGhlIGZpbGUgY29udGVudHMubXNvZnR3YXJlQWdlbnShZG5hbWVmQ2xhdWRlcmFsbEFjdGlvbnNJbmNsdWRlZPUAAADIanVtYgAAAEBqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmhhc2guZGF0YQAAAAAYYzJzaFJC5N4mzBhHQjyUE39j6ckAAACAY2JvcqVjYWxnZnNoYTI1NmNwYWRNAAAAAAAAAAAAAAAAAGRoYXNoWCCKH3x6k586QMownB2m ht=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Terraform 에 google_redis_instance 블록 1개를 적고 apply<\/text><rect x=\"680\" y=\"146\" width=\"490\" height=\"66\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#ddd6fe\" stroke-width=\"1.5\"/><text x=\"692\" y=\"172\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Helm 으로 Redis(Valkey) 를 GKE 에 설치 (helm install /<\/text><text x=\"692\" y=\"191\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">helm_release)<\/text><rect x=\"30\" y=\"220\" width=\"120\" height=\"66\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"90\" y=\"258\" font-size=\"13\" font-weight=\"bold\" fill=\"#334155\" text-anchor=\"middle\" xml:space=\"preserve\">실행하면<\/text><rect x=\"160\" y=\"220\" width=\"500\" height=\"66\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\" stroke-width=\"1.5\"/><text x=\"172\" y=\"246\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">몇 분 뒤 주소(IP)가 나옴 → 코드는 그 주소로 접속만<\/text><rect x=\"680\" y=\"220\" width=\"490\" height=\"66\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#ddd6fe\" stroke-width=\"1.5\"/><text x=\"692\" y=\"246\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Pod 가 뜨고 클러스터 안 주소(redis-master…svc)가 생김<\/text><rect x=\"30\" y=\"294\" width=\"120\" height=\"66\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"90\" y=\"332\" font-size=\"13\" font-weight=\"bold\" fill=\"#334155\" text-anchor=\"middle\" xml:space=\"preserve\">고장·업데이트<\/text><rect x=\"160\" y=\"294\" width=\"500\" height=\"66\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\" stroke-width=\"1.5\"/><text x=\"172\" y=\"320\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">패치·백업·장애 교체는 구글이 한다<\/text><rect x=\"680\" y=\"294\" width=\"490\" height=\"66\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#ddd6fe\" stroke-width=\"1.5\"/><text x=\"692\" y=\"320\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Pod 재시작은 K8s 가 하지만 디스크(PVC)·백업·버전업은 우리 몫<\/text><rect x=\"30\" y=\"368\" width=\"120\" height=\"66\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"90\" y=\"406\" font-size=\"13\" font-weight=\"bold\" fill=\"#334155\" text-anchor=\"middle\" xml:space=\"preserve\">돈<\/text><rect x=\"160\" y=\"368\" width=\"500\" height=\"66\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\" stroke-width=\"1.5\"/><text x=\"172\" y=\"394\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">켜 두는 동안 고정 요금 (크기만큼). 안 쓰는 시간에도 과금<\/text><rect x=\"680\" y=\"368\" width=\"490\" height=\"66\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#ddd6fe\" stroke-width=\"1.5\"/><text x=\"692\" y=\"394\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">이미 켜 둔 GKE 노드 안에서 돌아 추가 요금이 거의 없음(노드 여유<\/text><text x=\"692\" y=\"413\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">필요)<\/text><rect x=\"30\" y=\"442\" width=\"120\" height=\"66\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/><text x=\"90\" y=\"480\" font-size=\"13\" font-weight=\"bold\" fill=\"#334155\" text-anchor=\"middle\" xml:space=\"preserve\">배우는 것<\/text><rect x=\"160\" y=\"442\" width=\"500\" height=\"66\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\" stroke-width=\"1.5\"/><text x=\"172\" y=\"468\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">Redis 자체 운영은 배우지 못함, 대신 앱에 집중<\/text><rect x=\"680\" y=\"442\" width=\"490\" height=\"66\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#ddd6fe\" stroke-width=\"1.5\"/><text x=\"692\" y=\"468\" font-size=\"13\" font-weight=\"normal\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">K8s 운영, Helm, 영속 디스크 등 멘토가 원하는 \"직접\" 경험<\/text><rect x=\"30\" y=\"520\" width=\"1140\" height=\"30\" rx=\"8\" fill=\"#fff7ed\" stroke=\"#ea580c\" stroke-width=\"1.5\"/><text x=\"46\" y=\"540\" font-size=\"13\" font-weight=\"bold\" fill=\"#9a3412\" text-anchor=\"start\" xml:space=\"preserve\">멘토 타협안(10/28): RDB(Cloud SQL)는 매니지드 OK, Redis·Airflow·ML 컴포넌트는 직접. 이유 = 쿠버 운영 학습 + 비용<\/text><\/svg><figcaption>직접 vs 매니지드<\/figcaption><\/figure>\n<h3>8-7. [인프라 구성도와 카탈로그] 새로 만든 것<\/h3>\n<ul>\n<li><a href=\"#fig\">2부 인프라 구성도<\/a>: v1(인프라_대응도)과 같은 스타일. 멘토 언급은 보라색 테두리, MVP/확장 알약, 직접/매니지드 알약, 빨간 \"추가\"는 v1 카탈로그에 없던 멘토 언급(Helm, Redis 직접 설치안, 로깅 서버, 기사 검수 에이전트).\n<\/li><li><a href=\"#cat\">인프라_툴_카탈로그_멘토기준_v2.md<\/a> / <a href=\"#cat\">.html<\/a>: 76 → 84개. 추가 8, 조정 1(Memorystore 확장→미정).\n<\/li><li><b>이름 규칙<\/b>: 날짜보다 <code>내용 + 판 번호(_v2)<\/code>가 낫다. 날짜는 \"무엇이 달라졌는지\"를 알려 주지 않기 때문이다. 날짜는 파일 안의 변경 이력에 적는다. v1은 그대로 둔다.\n<\/li><li>잠정 항목: Helm을 MVP로 올린 것과 Memorystore를 미정으로 내린 것은 제 제안이다.\n<\/li><\/ul>\n<h3>8-8. 이 질문들에 대한 확인 필요 항목<\/h3>\n<ul>\n<li>노출 이벤트 수집, 이벤트 칸 이름, 5분 폴더·_SUCCESS 채택은 제 제안이다. 팀(특히 이벤트 담당)과 합의해야 확정된다.\n<\/li><li>Redis 용도는 멘토 답변 전까지 미확인이다.\n<\/li><\/ul>\n<\/div>\n<div class=\"partlabel\">2부<\/div>\n<section id=\"fig\"><h2 style=\"margin:.4em 0\">인프라 구성도 (멘토 10/28 기준) v2<\/h2><a href=\"#fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB6gAAAVkCAIAAADmANYIAAAWfmNhQlgAABZ+anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFlhqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmRlNDU4ZjJmLWNkNTEtNGFkMi1hODk0LTVlZWE5ZDE3NDUyNAAAAAOTanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuGp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNo7Po2wN8z6tUHtM+NqoVWcwAAAGxjYm9yo2lkYzpmb3JtYXRpaW1hZ2UvcG5namluc3RhbmNlSUR4LHhtcDppaWQ6MDhiZTA5MDgtZjExZi00ZjAyLWIyZmItM2EyMDZmOGZjZjllbHJlbGF0aW9uc2hpcGhwYXJlbnRPZgAAAeJqdW1iAAAAQWp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuYWN0aW9ucy52MgAAAAAYYzJzaCIVMTR6QbxusoYnAS400e8 후 · <code>제외<\/code> 이번엔 안 씀.<\/li>\n<li>근거: 계획서에 있음 / 필요해 보임(추론) / 제안·확장 / 쓰지 않음. 근거와 범위는 서로 별개다.<\/li>\n<li>충돌 시 우선순위: 멘토 &gt; 회의 &gt; 슬랙 &gt; 팀 제안 &gt; 추론, 날짜는 최신 우선.<\/li>\n<\/ul>\n<h3>0-6. MVP만 한눈에<\/h3>\n<ul>\n<li><b>서비스 실행 (컨테이너·K8s)<\/b>: ★GKE (Google Kubernetes Engine) · K8s 설정 파일 (Deployment·Service·Ingress·HPA, Kustomize) · K8s Job / CronJob · Docker / Dockerfile · Ingress / 로드밸런서 (Cloud Load Balancing)<\/li>\n<li><b>서비스 앱·DB·LLM<\/b>: FastAPI (웹·API 프레임워크) · ★Cloud SQL for PostgreSQL (서비스 DB) · ★LLM API (OpenRouter 키 제공, Vertex AI는 대안) · ★가상 독자 실행기 (페르소나 + 접속 스케줄 + 클릭 결정) · 기사 형식 검사 코드 (필수 필드·카테고리 목록·중복) · ★기사 검수 에이전트 (AI 사전 검수) · ★NVIDIA Nemotron 페르소나 데이터<\/li>\n<li><b>행동 수집<\/b>: 이벤트 수집 API (<code>POST /events<\/code>) · ★로깅 서버 → Cloud Storage 파일 적재 (5분 단위 파티션) · ★쿠키 사용자 ID 발급<\/li>\n<li><b>저장·분석<\/b>: ★Cloud Storage (원본·오류·모델 파일) · ★BigQuery (정제·집계·피처 테이블)<\/li>\n<li><b>처리·오케스트레이션<\/b>: ★Apache Airflow (DAG) · 로컬 docker compose (Airflow + Postgres) · ★Airflow 실행 위치 (GKE 직접 설치로 결정) · ★BigQuery SQL 변환 (정제·집계·피처) · 데이터 품질 검사 (행수·결측·중복) · 재처리 안전 설계 (<code>event_id<\/code>·<code>MERGE<\/code>·<code>_SUCCESS<\/code> 표식)<\/li>\n<li><b>머신러닝 (학습·서빙)<\/b>: scikit-learn / LightGBM (CPU 모델) · 실험 환경 (Jupyter / Colab / Vertex AI Workbench) · 피처 저장소 (BigQuery 시점별 피처 + 최신 피처 테이블) · ★모델 추론 서버 (GKE 위 FastAPI) · ★평가 지표: CTR 먼저, nDCG@K는 나중<\/li>\n<li><b>배포·IaC·CI/CD<\/b>: ★Terraform (google provider) · Terraform 원격 상태 (Cloud Storage 버킷) · GitHub (저장소·PR 리뷰) · GitHub Actions (CI) · Artifact Registry · Workload Identity Federation · ArgoCD (GitOps) · ★Helm (Charts)<\/li>\n<li><b>모니터링·품질<\/b>: Cloud Logging · Monitoring · Airflow UI<\/li>\n<li><b>보안·권한·비밀값<\/b>: IAM (사람·서비스 계정 권한) · Secret Manager · .env / .gitignore 관례<\/li>\n<li><b>결과 확인 (BI)<\/b>: BigQuery 콘솔 (점검 쿼리) · 인기순 추천 화면 (+ 이력 없을 때 대체 추천)<\/li>\n<li><b>비용·개발 환경·운영 습관<\/b>: Pricing Calculator (가격 계산기) · 예산 알림 (Budget alert) · 안 쓸 때 끄기 (<code>terraform destroy<\/code>·노드 축소) · gcloud CLI · kubectl<\/li>\n<\/ul>\n<h2>도구 카드 (필터·검색)<\/h2>\n<div class=\"bar\"><span>범위<\/span><button data-f=\"all\" class=\"on\">전체<\/button><button data-f=\"MVP\">MVP<\/button><button data-f=\"확장\">확장<\/button><button data-f=\"미정\">미정<\/button><button data-f=\"제외\">제외<\/button><button data-f=\"M\">★ 멘토 언급<\/button><input id=\"q\" placeholder=\"검색 (예: Redis, Helm)\"><span id=\"n\"><\/span><\/div>\n<section data-sec=\"1\"><h2>1. 서비스 실행 (컨테이너·K8s)<\/h2><p class=\"sub\">만든 프로그램을 어디서 어떻게 돌리나<\/p><div class=\"grid\"><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"1\" data-m=\"1\" data-t=\"gke (google kubernetes engine)컨테이너(프로그램을 라이브러리까지 한 상자에 담은 것)를 여러 서버에 나눠 올리고, 죽으면 다시 띄워 주는 관리자. 예: 뉴스 웹 2개, 추론 서버 1개를 항상 켜 둔다.기획서 3쪽(kubernetes 컨테이너 환경)\"><h3><span class=star>★<\/span> GKE (Google Kubernetes Engine)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ①②⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>컨테이너(프로그램을 라이브러리까지 한 상자에 담은 것)를 여러 서버에 나눠 올리고, 죽으면 다시 띄워 주는 관리자. 예: 뉴스 웹 2개, 추론 서버 1개를 항상 켜 둔다.<\/dd><dt>없으면<\/dt><dd>프로그램을 서버마다 손으로 실행하고, 죽으면 직접 다시 켜야 한다.<\/dd><dt>출처<\/dt><dd>기획서 3쪽(Kubernetes 컨테이너 환경)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/ci (EKS)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"1\" data-m=\"0\" data-t=\"k8s 설정 파일 (deployment·service·ingress·hpa, kustomize)&quot;웹을 2개 띄워라, 서로 이 이름으로 연결해라, 부하가 크면 4개까지 늘려라&quot;를 yaml 파일로 적어 둔 설계도. kustomize는 환경(dev)마다 값만 바꿔 덮어쓰는 도구.기획서 3쪽(k8s·gitops 전제)\"><h3>K8s 설정 파일 (Deployment·Service·Ingress·HPA, Kustomize)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ①②⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>&quot;웹을 2개 띄워라, 서로 이 이름으로 연결해라, 부하가 크면 4개까지 늘려라&quot;를 yaml 파일로 적어 둔 설계도. Kustomize는 환경(dev)마다 값만 바꿔 덮어쓰는 도구.<\/dd><dt>없으면<\/dt><dd>설정이 사람 머릿속에만 있어 누가 바꿨는지, 환경마다 뭐가 다른지 알 수 없다.<\/dd><dt>출처<\/dt><dd>기획서 3쪽(K8s·GitOps 전제)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/k8s/base, overlays/dev<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"1\" data-m=\"0\" data-t=\"k8s job / cronjob한 번 실행하고 끝나는 작업(job), 시간표대로 실행하는 작업(cronjob). 예: 매일 06:00 기사 생성 프로그램이 돌고 끝나면 꺼진다.추론: 기획서 5쪽(카테고리·시간대별 생성)\"><h3>K8s Job / CronJob<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ①②<\/span><\/div><dl><dt>무엇<\/dt><dd>한 번 실행하고 끝나는 작업(Job), 시간표대로 실행하는 작업(CronJob). 예: 매일 06:00 기사 생성 프로그램이 돌고 끝나면 꺼진다.<\/dd><dt>없으면<\/dt><dd>기사 생성 프로그램을 계속 켜 두거나 사람이 매번 실행해야 한다. 켜 두는 동안 비용도 나간다.<\/dd><dt>출처<\/dt><dd>추론: 기획서 5쪽(카테고리·시간대별 생성)<\/dd><dt>배운 곳<\/dt><dd>(log_gen의 1회성 컨테이너 작업 개념)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"1\" data-m=\"0\" data-t=\"docker / dockerfile프로그램+필요한 라이브러리를 한 상자(이미지)로 포장하는 방법. 예: 뉴스 웹을 이미지로 만들면 내 노트북과 gke에서 똑같이 실행된다.추론: k8s는 이미지를 실행하므로 전제\"><h3>Docker / Dockerfile<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ①②⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>프로그램+필요한 라이브러리를 한 상자(이미지)로 포장하는 방법. 예: 뉴스 웹을 이미지로 만들면 내 노트북과 GKE에서 똑같이 실행된다.<\/dd><dt>없으면<\/dt><dd>&quot;내 PC에서는 되는데 서버에선 안 돼요&quot;가 반복된다.<\/dd><dt>출처<\/dt><dd>추론: K8s는 이미지를 실행하므로 전제<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci/apps/web, was (Dockerfile)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"1\" data-m=\"0\" data-t=\"ingress / 로드밸런서 (cloud load balancing)주소를 친 사람의 요청을 알맞은 웹 컨테이너로 안내하는 안내 데스크. 가상 독자가 클러스터 안에서만 접속하면 생략 가능, 데모 때 사람이 화면을 볼 때 필요.문서 근거 없음 → 추론 (용어 노트 q16)\"><h3>Ingress / 로드밸런서 (Cloud Load Balancing)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>주소를 친 사람의 요청을 알맞은 웹 컨테이너로 안내하는 안내 데스크. 가상 독자가 클러스터 안에서만 접속하면 생략 가능, 데모 때 사람이 화면을 볼 때 필요.<\/dd><dt>없으면<\/dt><dd>클러스터 밖(브라우저)에서 뉴스 웹에 들어갈 길이 없다.<\/dd><dt>출처<\/dt><dd>문서 근거 없음 → 추론 (용어 노트 Q16)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/k8s/base/ingress.yaml<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"미정\" data-sec=\"1\" data-m=\"0\" data-t=\"gke 운영 모드·노드 수 (autopilot / standard)컨테이너가 올라가는 서버(노드)를 직접 관리할지, gcp에 맡길지(autopilot), 몇 대로 시작할지 정하는 일. 켜 두는 동안 계속 과금되는 가장 큰 비용 후보.용어 노트 q38 (가설: 소형 2~3대에서 시작)\"><h3>GKE 운영 모드·노드 수 (Autopilot / Standard)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>컨테이너가 올라가는 서버(노드)를 직접 관리할지, GCP에 맡길지(Autopilot), 몇 대로 시작할지 정하는 일. 켜 두는 동안 계속 과금되는 가장 큰 비용 후보.<\/dd><dt>없으면<\/dt><dd>서버를 너무 많이 켜 두면 크레딧이 빠르게 줄고, 너무 적으면 에이전트를 많이 못 돌린다.<\/dd><dt>출처<\/dt><dd>용어 노트 Q38 (가설: 소형 2~3대에서 시작)<\/dd><dt>배운 곳<\/dt><dd>cd 레포 EKS Auto Mode<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"1\" data-m=\"0\" data-t=\"cloud run jobs서버를 직접 두지 않고 컨테이너를 한 번 실행해 주는 gcp 서비스. 가끔 도는 기사 생성 같은 일에 편하다. 배운 ecs fargate와 같은 역할.대안 제안 (기획서는 gke에서 에이전트 실행)\"><h3>Cloud Run Jobs<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ①<\/span><\/div><dl><dt>무엇<\/dt><dd>서버를 직접 두지 않고 컨테이너를 한 번 실행해 주는 GCP 서비스. 가끔 도는 기사 생성 같은 일에 편하다. 배운 ECS Fargate와 같은 역할.<\/dd><dt>없으면<\/dt><dd>없어도 GKE의 Job으로 같은 일을 할 수 있다(그래서 대안).<\/dd><dt>출처<\/dt><dd>대안 제안 (기획서는 GKE에서 에이전트 실행)<\/dd><dt>배운 곳<\/dt><dd>log_gen (ECS Fargate)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"미정\" data-sec=\"1\" data-m=\"1\" data-t=\"cloud run (백엔드 배포 선택지)컨테이너 이미지를 올리면 서버 관리 없이 실행해 주는 서비스. 요청이 없으면 0으로 줄어든다. 멘토가 백엔드 배포에 편하다고 추천(10/28).멘토 10/28 추천(필수 아님)\"><h3><span class=star>★<\/span> Cloud Run (백엔드 배포 선택지)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>컨테이너 이미지를 올리면 서버 관리 없이 실행해 주는 서비스. 요청이 없으면 0으로 줄어든다. 멘토가 백엔드 배포에 편하다고 추천(10/28).<\/dd><dt>없으면<\/dt><dd>백엔드도 GKE에 올리면 되므로 없어도 된다. 선택지일 뿐.<\/dd><dt>출처<\/dt><dd>멘토 10/28 추천(필수 아님)<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"2\"><h2>2. 서비스 앱·DB·LLM<\/h2><p class=\"sub\">뉴스 웹과 AI가 실제로 동작하는 부분<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"2\" data-m=\"0\" data-t=\"fastapi (웹·api 프레임워크)파이썬으로 뉴스 피드 화면과 api(`/events`, `/recommend`)를 만드는 도구. 예: `get /recommend?user=민수`에 추천 기사 목록을 돌려준다.추론: 프레임워크는 팀 결정, 배운 것과 같음\"><h3>FastAPI (웹·API 프레임워크)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ②⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>파이썬으로 뉴스 피드 화면과 API(`/events`, `/recommend`)를 만드는 도구. 예: `GET /recommend?user=민수`에 추천 기사 목록을 돌려준다.<\/dd><dt>없으면<\/dt><dd>웹과 API를 밑바닥부터 만들어야 한다.<\/dd><dt>출처<\/dt><dd>추론: 프레임워크는 팀 결정, 배운 것과 같음<\/dd><dt>배운 곳<\/dt><dd>my_project/main.py, devops_tf_k8s_ci/apps/was<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"미정\" data-sec=\"2\" data-m=\"0\" data-t=\"프론트 화면 (html 템플릿 등)독자가 보는 뉴스 피드 화면. 팀회의에서 &quot;프론트는 ai에게 생성시키자&quot;는 의견이 있었고, ai 생성 허용 여부는 멘토 확인 사항.팀회의(태원 샘), 구조이해 질문 q8\"><h3>프론트 화면 (HTML 템플릿 등)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>독자가 보는 뉴스 피드 화면. 팀회의에서 &quot;프론트는 AI에게 생성시키자&quot;는 의견이 있었고, AI 생성 허용 여부는 멘토 확인 사항.<\/dd><dt>없으면<\/dt><dd>노출·클릭이 발생할 화면이 없어 행동 데이터가 생기지 않는다.<\/dd><dt>출처<\/dt><dd>팀회의(태원 샘), 구조이해 질문 Q8<\/dd><dt>배운 곳<\/dt><dd>my_project/templates, static<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"2\" data-m=\"1\" data-t=\"cloud sql for postgresql (서비스 db)기사·구독처럼 한 건씩 빠르게 읽고 쓰는 db(oltp). 예: &quot;기사 7번 제목 조회&quot;, &quot;민수 구독 상태 수정&quot;.기획서 5쪽(기사 저장·관리)·3쪽(구독), 팀회의(db도 구축). 제품 선택은 추론\"><h3><span class=star>★<\/span> Cloud SQL for PostgreSQL (서비스 DB)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ②⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>기사·구독처럼 한 건씩 빠르게 읽고 쓰는 DB(OLTP). 예: &quot;기사 7번 제목 조회&quot;, &quot;민수 구독 상태 수정&quot;.<\/dd><dt>없으면<\/dt><dd>분석용 BigQuery에 서비스를 시키면 느리고 비싸며, 서비스 DB로 대량 집계를 하면 피드가 느려진다.<\/dd><dt>출처<\/dt><dd>기획서 5쪽(기사 저장·관리)·3쪽(구독), 팀회의(db도 구축). 제품 선택은 추론<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci/infra/rds.tf, airflow-medallion-rag(Postgres)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"2\" data-m=\"1\" data-t=\"llm api (openrouter 키 제공, vertex ai는 대안)기사를 쓰고 가상 독자의 행동을 판단하는 &quot;두뇌&quot;를 api로 빌려 쓴다. 멘토가 openrouter 키(이전 기수 잔여 크레딧)를 제공하고 팀 예산도 쓸 수 있다(10/28).기획서 5쪽(llm 에이전트)은 있으나 키·비용은 목록에 없음\"><h3><span class=star>★<\/span> LLM API (OpenRouter 키 제공, Vertex AI는 대안)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ①②<\/span><\/div><dl><dt>무엇<\/dt><dd>기사를 쓰고 가상 독자의 행동을 판단하는 &quot;두뇌&quot;를 API로 빌려 쓴다. 멘토가 OpenRouter 키(이전 기수 잔여 크레딧)를 제공하고 팀 예산도 쓸 수 있다(10/28).<\/dd><dt>없으면<\/dt><dd>기사 생성과 가상 독자가 동작하지 않는다.<\/dd><dt>출처<\/dt><dd>기획서 5쪽(LLM 에이전트)은 있으나 키·비용은 목록에 없음<\/dd><dt>배운 곳<\/dt><dd>ai_agent (Bedrock), airflow-medallion-rag DAG<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"2\" data-m=\"1\" data-t=\"가상 독자 실행기 (페르소나 + 접속 스케줄 + 클릭 결정)성격표(페르소나)에 따라 시간대에 접속해 피드를 보고 클릭하는 프로그램. 예: 직장인 민수는 평일 8시·19시에 접속, it 기사 60%.기획서 5쪽(가상 독자 에이전트), 멘토회의록 2절\"><h3><span class=star>★<\/span> 가상 독자 실행기 (페르소나 + 접속 스케줄 + 클릭 결정)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>성격표(페르소나)에 따라 시간대에 접속해 피드를 보고 클릭하는 프로그램. 예: 직장인 민수는 평일 8시·19시에 접속, IT 기사 60%.<\/dd><dt>없으면<\/dt><dd>행동 데이터를 만들 방법이 없다.<\/dd><dt>출처<\/dt><dd>기획서 5쪽(가상 독자 에이전트), 멘토회의록 2절<\/dd><dt>배운 곳<\/dt><dd>log_gen/generator/app/traffic.py (시간대 가중치)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"미정\" data-sec=\"2\" data-m=\"0\" data-t=\"브라우저 자동화 (playwright 등)가상 독자가 진짜 브라우저로 접속해 클릭하게 하는 도구. 실제와 비슷하지만 메모리·시간이 많이 든다. api 호출 방식과 비교해 결정.멘토회의록 2절(브라우저 접속·클릭), 팀회의(클릭 의도는 질문 단계)\"><h3>브라우저 자 구. 기존 웹 백엔드에 api 하나를 추가하면 된다. 예: &quot;u001이 a123을 클릭했다&quot;.태원 안(10/28), 팀회의(클릭 이벤트 질문)\"><h3>이벤트 수집 API (`POST /events`)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③<\/span><\/div><dl><dt>무엇<\/dt><dd>홈페이지에서 일어난 노출·클릭·열람을 서버로 보내는 입구. 기존 웹 백엔드에 API 하나를 추가하면 된다. 예: &quot;U001이 A123을 클릭했다&quot;.<\/dd><dt>없으면<\/dt><dd>행동이 서버에 도달하지 않아 아무것도 쌓이지 않는다. (서버에는 페이지 요청만 오고 클릭은 프론트가 따로 보내야 생긴다)<\/dd><dt>출처<\/dt><dd>태원 안(10/28), 팀회의(클릭 이벤트 질문)<\/dd><dt>배운 곳<\/dt><dd>log_gen (이벤트 JSON 설계)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"확장\" data-sec=\"3\" data-m=\"1\" data-t=\"pub/sub행동 기록을 받아 전달하는 우체통. 웹은 던지기만 하고 돌아가 화면이 안 느려지고, 저장이 실패하면 메시지가 남아 재시도된다. 배운 kafka의 토픽·프로듀서·컨슈머와 같은 개념.멘토 10/28: mvp 불필요(gcs에 바로 저장). 기획서 3·5쪽, 태원 안(포함)은 확장 때 반영\"><h3><span class=star>★<\/span> Pub/Sub<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ③<\/span><\/div><dl><dt>무엇<\/dt><dd>행동 기록을 받아 전달하는 우체통. 웹은 던지기만 하고 돌아가 화면이 안 느려지고, 저장이 실패하면 메시지가 남아 재시도된다. 배운 Kafka의 토픽·프로듀서·컨슈머와 같은 개념.<\/dd><dt>없으면<\/dt><dd>웹이 저장 끝까지 기다려 화면이 느려지거나 행동이 유실될 수 있다. (배치 파일 적재로 대체 가능)<\/dd><dt>출처<\/dt><dd>멘토 10/28: MVP 불필요(GCS에 바로 저장). 기획서 3·5쪽, 태원 안(포함)은 확장 때 반영<\/dd><dt>배운 곳<\/dt><dd>kafka-elk-efk-opensearch (개념)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"확장\" data-sec=\"3\" data-m=\"1\" data-t=\"pub/sub → cloud storage 구독pub/sub 메시지를 일정 크기·시간마다 파일로 묶어 cloud storage에 자동 저장하는 기능. 이후 처리는 배치와 똑같다. 배운 firehose 역할.태원 안(10/28). 멘토 10/28: pub/sub는 mvp 불필요\"><h3><span class=star>★<\/span> Pub/Sub → Cloud Storage 구독<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③④<\/span><\/div><dl><dt>무엇<\/dt><dd>Pub/Sub 메시지를 일정 크기·시간마다 파일로 묶어 Cloud Storage에 자동 저장하는 기능. 이후 처리는 배치와 똑같다. 배운 Firehose 역할.<\/dd><dt>없으면<\/dt><dd>Pub/Sub를 쓰면 메시지를 파일로 옮겨 줄 별도 프로그램이 필요하다.<\/dd><dt>출처<\/dt><dd>태원 안(10/28). 멘토 10/28: Pub/Sub는 MVP 불필요<\/dd><dt>배운 곳<\/dt><dd>kafka 레포 (Firehose→S3)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"3\" data-m=\"1\" data-t=\"로깅 서버 → cloud storage 파일 적재 (5분 단위 파티션)화면의 작은 스크립트가 행동을 로깅 서버로 보내고, 서버가 `dt=날짜/hh/mm` 폴더에 5분마다 파일로 저장한다. 완료 표식(`_success`)으로 배치가 읽을 구간을 안다. 멘토 10/28 방침. 로깅 서버를 어디서 돌릴지(cloud run 또는 gke)는 아직 미정.멘토 10/28(gcs에 바로 저장, 5분 단위 raw 권장). 로깅 서버 분리는 확인 필요\"><h3><span class=star>★<\/span> 로깅 서버 → Cloud Storage 파일 적재 (5분 단위 파티션)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③④<\/span><\/div><dl><dt>무엇<\/dt><dd>화면의 작은 스크립트가 행동을 로깅 서버로 보내고, 서버가 `dt=날짜/hh/mm` 폴더에 5분마다 파일로 저장한다. 완료 표식(`_SUCCESS`)으로 배치가 읽을 구간을 안다. 멘토 10/28 방침. 로깅 서버를 어디서 돌릴지(Cloud Run 또는 GKE)는 아직 미정.<\/dd><dt>없으면<\/dt><dd>Pub/Sub를 안 쓰기로 하면 수집 경로가 없다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(GCS에 바로 저장, 5분 단위 raw 권장). 로깅 서버 분리는 확인 필요<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag/scripts/upload_silver.py<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"3\" data-m=\"0\" data-t=\"pub/sub → bigquery 구독 / dataflow수집한 메시지를 바로 bigquery에 넣거나(구독), 실시간으로 가공해 넣는(dataflow) 방법. 실시간 피처 확장 때 쓴다.멘토회의록 5절(실시간은 확장), 기획서 6쪽 6주차\"><h3>Pub/Sub → BigQuery 구독 / Dataflow<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ③⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>수집한 메시지를 바로 BigQuery에 넣거나(구독), 실시간으로 가공해 넣는(Dataflow) 방법. 실시간 피처 확장 때 쓴다.<\/dd><dt>없으면<\/dt><dd>배치 MVP에서는 필요 없다.<\/dd><dt>출처<\/dt><dd>멘토회의록 5절(실시간은 확장), 기획서 6쪽 6주차<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"미정\" data-sec=\"3\" data-m=\"1\" data-t=\"로깅 서버 실행 위치 (cloud run vs gke)화면 스크립트가 보낸 기록을 받는 별도 서버를 어디에 둘지 정하는 일. cloud run은 요청이 없으면 0으로 줄고, gke는 이미 켜진 노드를 같이 쓴다.멘토 10/28(로깅 서버 따로 구성). 위치는 멘토가 정하지 않음\"><h3><span class=star>★<\/span> 로깅 서버 실행 위치 (Cloud Run vs GKE) <span class=new>추가<\/span><\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③<\/span><\/div><dl><dt>무엇<\/dt><dd>화면 스크립트가 보낸 기록을 받는 별도 서버를 어디에 둘지 정하는 일. Cloud Run은 요청이 없으면 0으로 줄고, GKE는 이미 켜진 노드를 같이 쓴다.<\/dd><dt>없으면<\/dt><dd>수집 경로의 배포 방식이 정해지지 않아 청사진을 그릴 수 없다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(로깅 서버 따로 구성). 위치는 멘토가 정하지 않음<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"3\" data-m=\"1\" data-t=\"쿠키 사용자 id 발급가입 없이 브라우저 쿠키로 독자를 구분하는 익명 id. 이 id가 모든 이벤트에 붙어야 한 사람의 흐름을 이을 수 있다.멘토 10/28(쿠키로 사용자 구분, 회원가입 없음)\"><h3><span class=star>★<\/span> 쿠키 사용자 ID 발급 <span class=new>추가<\/span><\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③<\/span><\/div><dl><dt>무엇<\/dt><dd>가입 없이 브라우저 쿠키로 독자를 구분하는 익명 ID. 이 ID가 모든 이벤트에 붙어야 한 사람의 흐름을 이을 수 있다.<\/dd><dt>없으면<\/dt><dd>사용자별 피처를 만들 수 없다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(쿠키로 사용자 구분, 회원가입 없음)<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"4\"><h2>4. 저장·분석<\/h2><p class=\"sub\">원본을 쌓고 한꺼번에 계산하는 곳<\/p><div class=\"grid\"><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"4\" data-m=\"1\" data-t=\"cloud storage (원본·오류·모델 파일)파일 저장소(s3의 gcp 버전). 원본 이벤트(bronze), 오류 이벤트와 사유, 학습한 모델 파일을 둔다. 원본을 그대로 보존해 정제 규칙이 틀리면 다시 계산한다.기획서 3·5쪽, 태원 안(원본·오류 경로)\"><h3><span class=star>★<\/span> Cloud Storage (원본·오류·모델 파일)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ④⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>파일 저장소(S3의 GCP 버전). 원본 이벤트(Bronze), 오류 이벤트와 사유, 학습한 모델 파일을 둔다. 원본을 그대로 보존해 정제 규칙이 틀리면 다시 계산한다.<\/dd><dt>없으면<\/dt><dd>원본이 사라져 규칙을 고칠 때 과거를 재처리할 수 없다.<\/dd><dt>출처<\/dt><dd>기획서 3·5쪽, 태원 안(원본·오류 경로)<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (S3 silver/dt=), de<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"4\" data-m=\"1\" data-t=\"bigquery (정제·집계·피처 테이블)쌓인 대량 데이터를 한꺼번에 집계하는 분석 창고(olap). 예: &quot;지난 7일 사용자별 카테고리 클릭 비율&quot;. 날짜 파티션과 필요한 컬럼만 읽어 비용을 줄이고, `merge`로 재실행해도 중복되지 않게 적재한다.기획서 3·5쪽, 팀회의(oltp/olap)\"><h3><span class=star>★<\/span> BigQuery (정제·집계·피처 테이블)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ④⑤⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>쌓인 대량 데이터를 한꺼번에 집계하는 분석 창고(OLAP). 예: &quot;지난 7일 사용자별 카테고리 클릭 비율&quot;. 날짜 파티션과 필요한 컬럼만 읽어 비용을 줄이고, `MERGE`로 재실행해도 중복되지 않게 적재한다.<\/dd><dt>없으면<\/dt><dd>수만~수억 행 집계를 서비스 DB가 떠안아 피드가 느려진다.<\/dd><dt>출처<\/dt><dd>기획서 3·5쪽, 팀회의(OLTP/OLAP)<\/dd><dt>배운 곳<\/dt><dd>de (Athena·Redshift)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"4\" data-m=\"0\" data-t=\"온라인 피처 저장 (cloud sql의 postgresql 테이블)서비스 중 한 사용자의 최신 피처를 몇 ms에 읽는 곳. 배치가 만든 &quot;가장 최근 값&quot;을 복사해 둔다. 예: 민수의 경제 비율 0.7.태원 안(10/28), 10/28 회의에서 mvp 제외 제안, 용어 노트 q20\"><h3>온라인 피처 저장 (Cloud SQL의 PostgreSQL 테이블)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑤⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>서비스 중 한 사용자의 최신 피처를 몇 ms에 읽는 곳. 배치가 만든 &quot;가장 최근 값&quot;을 복사해 둔다. 예: 민수의 경제 비율 0.7.<\/dd><dt>없으면<\/dt><dd>추천할 때마다 BigQuery에 질문하면 느리고 쿼리마다 과금된다.<\/dd><dt>출처<\/dt><dd>태원 안(10/28), 10/28 회의에서 MVP 제외 제안, 용어 노트 Q20<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (Postgres)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"미정\" data-sec=\"4\" data-m=\"1\" data-t=\"memorystore (redis, 매니지드안)메모리에 &quot;키→값&quot;을 두는 초고속 db를 구글이 운영해 주는 제품. 멘토가 핵심 제품 중 하나로 언급(10/28)했지만 무엇에 쓰는지는 설명하지 않았다(10/31 질문). 일반 용도는 캐시·온라인 피처·카운터.멘토 10/28(제품 목록에 언급, 용도 미설명). v1에서는 확장이었음 → v2에서 미정으로 조정\"><h3><span class=star>★<\/span> Memorystore (Redis, 매니지드안)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>메모리에 &quot;키→값&quot;을 두는 초고속 DB를 구글이 운영해 주는 제품. 멘토가 핵심 제품 중 하나로 언급(10/28)했지만 무엇에 쓰는지는 설명하지 않았다(10/31 질문). 일반 용도는 캐시·온라인 피처·카운터.<\/dd><dt>없으면<\/dt><dd>MVP는 Cloud SQL 테이블로도 돌 수 있다. 응답이 느려질 때 추가해도 늦지 않다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(제품 목록에 언급, 용도 미설명). v1에서는 확장이었음 → v2에서 미정으로 조정<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"4\" data-m=\"0\" data-t=\"pgvector (벡터 검색)기사를 숫자 벡터(임베딩)로 바꿔 &quot;비슷한 기사&quot;를 찾는 확장 기능. 콘텐츠 기반 추천의 재료. 배운 rag와 같은 기술.제안 (배운 것 연결)\"><h3>pgvector (벡터 검색)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑥⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>기사를 숫자 벡터(임베딩)로 바꿔 &quot;비슷한 기사&quot;를 찾는 확장 기능. 콘텐츠 기반 추천의 재료. 배운 RAG와 같은 기술.<\/dd><dt>없으면<\/dt><dd>MVP에선 없어도 된다(카테고리·태그로 시작).<\/dd><dt>출처<\/dt><dd>제안 (배운 것 연결)<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag/db/init (vector(1024)), ai_agent<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"4\" data-m=\"0\" data-t=\"dataproc (spark)여러 서버로 큰 데이터를 병렬 처리하는 spark를 gcp가 관리해 주는 서비스. 우리 규모는 bigquery sql로 충분해서 데이터가 커질 때만.제안 (배운 것 연결)\"><h3>Dataproc (Spark)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>여러 서버로 큰 데이터를 병렬 처리하는 Spark를 GCP가 관리해 주는 서비스. 우리 규모는 BigQuery SQL로 충분해서 데이터가 커질 때만.<\/dd><dt>없으면<\/dt><dd>MVP에선 BigQuery가 이미 분산 처리하므로 필요 없다.<\/dd><dt>출처<\/dt><dd>제안 (배운 것 연결)<\/dd><dt>배운 곳<\/dt><dd>spark-cluster<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"미정\" data-sec=\"4\" data-m=\"1\" data-t=\"redis(valkey) 직접 설치 (helm)memorystore 대신 gke 안에 redis 또는 valkey를 helm으로 설치하는 안. 멘토 타협안(10/28): rdb는 매니지드 ok, redis·airflow·ml 컴포넌트는 직접. 용도 확인 전에는 설치하지 않는다.멘토 10/28(직접 구성 권장). 용도는 10/31 질문\"><h3><span class=star>★<\/span> Redis(Valkey) 직접 설치 (Helm) <span class=new>추가<\/span><\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>Memorystore 대신 GKE 안에 Redis 또는 Valkey를 Helm으로 설치하는 안. 멘토 타협안(10/28): RDB는 매니지드 OK, Redis·Airflow·ML 컴포넌트는 직접. 용도 확인 전에는 설치하지 않는다.<\/dd><dt>없으면<\/dt><dd>Memorystore 또는 Cloud SQL로 대체할 수 있다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(직접 구성 권장). 용도는 10/31 질문<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"5\"><h2>5. 처리·오케스트레이션<\/h2><p class=\"sub\">매일 순서대로 정리하는 자동화<\/p><div class=\"grid\"><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"1\" data-t=\"apache airflow (dag)&quot;원본 확인 → 정제 → 집계 → 피처&quot;를 정해진 시간에 순서대로 자동 실행하고, 실패하면 재시도하며, 어디서 멈췄는지 보여 주는 스케줄러. 예: 새벽 2시에 어제 데이터 처리.기획서 3·4·5쪽, 팀회의(왜 돌리나)\"><h3><span class=star>★<\/span> Apache Airflow (DAG)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>&quot;원본 확인 → 정제 → 집계 → 피처&quot;를 정해진 시간에 순서대로 자동 실행하고, 실패하면 재시도하며, 어디서 멈췄는지 보여 주는 스케줄러. 예: 새벽 2시에 어제 데이터 처리.<\/dd><dt>없으면<\/dt><dd>매일 사람이 쿼리를 손으로 실행하고, 실패해도 모른다.<\/dd><dt>출처<\/dt><dd>기획서 3·4·5쪽, 팀회의(왜 돌리나)<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag/dags (Sensor→검사→병렬→fan-in)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"0\" data-t=\"로컬 docker compose (airflow + postgres)내 노트북에서 airflow와 db를 한 번에 띄우는 개발 환경. 인프라 공지 전과 개발 중에 쓰고, 클라우드 이전 시 연결 설정만 바꾼다.팀회의(인프라는 조사만) + 레포\"><h3>로컬 docker compose (Airflow + Postgres)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>내 노트북에서 Airflow와 DB를 한 번에 띄우는 개발 환경. 인프라 공지 전과 개발 중에 쓰고, 클라우드 이전 시 연결 설정만 바꾼다.<\/dd><dt>없으면<\/dt><dd>클라우드 비용·권한이 정해지기 전에는 개발을 시작할 수 없다.<\/dd><dt>출처<\/dt><dd>팀회의(인프라는 조사만) + 레포<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag/docker-compose.yaml<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"1\" data-t=\"airflow 실행 위치 (gke 직접 설치로 결정)멘토 10/28: gke에 직접 설치(composer는 안 씀). 개발은 로컬 compose로 먼저 만든다. 설치는 공식 helm 차트를 쓰는 방식이 일반적(제안, 확인 필요).멘토 10/28: airflow를 gke에 직접 설치. 용어 노트 q19\"><h3><span class=star>★<\/span> Airflow 실행 위치 (GKE 직접 설치로 결정)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>멘토 10/28: GKE에 직접 설치(Composer는 안 씀). 개발은 로컬 compose로 먼저 만든다. 설치는 공식 Helm 차트를 쓰는 방식이 일반적(제안, 확인 필요).<\/dd><dt>없으면<\/dt><dd>클라우드에서 상시로 돌릴 방법이 정해지지 않는다.<\/dd><dt>출처<\/dt><dd>멘토 10/28: Airflow를 GKE에 직접 설치. 용어 노트 Q19<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd (GKE 위 설치 경험은 없음)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"1\" data-t=\"bigquery sql 변환 (정제·집계·피처)중복 제거, 불량·봇 표시, 사용자×카테고리 집계를 sql 파일로 작성하고 airflow가 실행한다.기획서 3·5쪽(airflow·bigquery)\"><h3><span class=star>★<\/span> BigQuery SQL 변환 (정제·집계·피처)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>중복 제거, 불량·봇 표시, 사용자×카테고리 집계를 SQL 파일로 작성하고 Airflow가 실행한다.<\/dd><dt>없으면<\/dt><dd>변환 로직을 둘 곳이 없다(또는 별도 서버를 만들어야 한다).<\/dd><dt>출처<\/dt><dd>기획서 3·5쪽(Airflow·BigQuery)<\/dd><dt>배운 곳<\/dt><dd>spark-cluster/jobs/etl_job.py (정제→파생 컬럼 개념)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"미정\" data-sec=\"5\" data-m=\"0\" data-t=\"정제 방식: bigquery sql vs 별도 처리 job태원 안은 정제 컨테이너 job(검사·중복 제거·오류 분리)을 airflow가 지휘한다. 우리는 sql 먼저를 제안. 어느 쪽이든 &quot;오류는 버리지 않고 사유와 함께 보관&quot;.태원 안(10/28) vs 우리 안\"><h3>정제 방식: BigQuery SQL vs 별도 처리 Job<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>태원 안은 정제 컨테이너 Job(검사·중복 제거·오류 분리)을 Airflow가 지휘한다. 우리는 SQL 먼저를 제안. 어느 쪽이든 &quot;오류는 버리지 않고 사유와 함께 보관&quot;.<\/dd><dt>없으면<\/dt><dd>정제 담당과 도구가 정해지지 않는다.<\/dd><dt>출처<\/dt><dd>태원 안(10/28) vs 우리 안<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"0\" data-t=\"데이터 품질 검사 (행수·결측·중복)처리 후 &quot;어제 이벤트가 0건 아닌지, 갑자기 10배인지, 필수 값이 비었는지&quot;를 확인하는 작업. 이상하면 뒷단계를 멈추고 알린다.태원 안(품질 확인), 용어 노트 q41\"><h3>데이터 품질 검사 (행수·결측·중복)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>처리 후 &quot;어제 이벤트가 0건 아닌지, 갑자기 10배인지, 필수 값이 비었는지&quot;를 확인하는 작업. 이상하면 뒷단계를 멈추고 알린다.<\/dd><dt>없으면<\/dt><dd>데이터가 비어 있는데도 모델이 조용히 엉뚱한 값으로 학습된다.<\/dd><dt>출처<\/dt><dd>태원 안(품질 확인), 용어 노트 Q41<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (inspect_silver)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"5\" data-m=\"0\" data-t=\"재처리 안전 설계 (`event_id`·`merge`·`_success` 표식)같은 작업을 몇 번 해도 결과가 같게 하는 규칙. 이벤트 id로 중복 제거, 완료 표식 확인 후 시작. 툴이 아니라 약속이지만 배치 mvp의 핵심.태원 안(10/28), 용어 노트 q28·q49\"><h3>재처리 안전 설계 (`event_id`·`MERGE`·`_SUCCESS` 표식)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ③④⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>같은 작업을 몇 번 해도 결과가 같게 하는 규칙. 이벤트 ID로 중복 제거, 완료 표식 확인 후 시작. 툴이 아니라 약속이지만 배치 MVP의 핵심.<\/dd><dt>없으면<\/dt><dd>재시도할 때마다 클릭이 두 배로 쌓인다.<\/dd><dt>출처<\/dt><dd>태원 안(10/28), 용어 노트 Q28·Q49<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (`_SUCCESS`, retries)<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"6\"><h2>6. 머신러닝 (학습·서빙)<\/h2><p class=\"sub\">모델을 만들고 추천에 쓰는 부분<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"6\" data-m=\"0\" data-t=\"scikit-learn / lightgbm (cpu 모델)표 형태 데이터로 &quot;이 사용자가 이 기사를 누를 확률&quot;을 배우는 파이썬 도구. 트리 모델은 cpu로 충분하다.기획서 3쪽(학습 환경), 멘토회의록 4절(모델 자유·시간 쓰지 말 것)\"><h3>scikit-learn / LightGBM (CPU 모델)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>표 형태 데이터로 &quot;이 사용자가 이 기사를 누를 확률&quot;을 배우는 파이썬 도구. 트리 모델은 CPU로 충분하다.<\/dd><dt>없으면<\/dt><dd>추천 점수를 계산할 모델이 없다.<\/dd><dt>출처<\/dt><dd>기획서 3쪽(학습 환경), 멘토회의록 4절(모델 자유·시간 쓰지 말 것)<\/dd><dt>배운 곳<\/dt><dd>(새로 배울 것)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"6\" data-m=\"0\" data-t=\"실험 환경 (jupyter / colab / vertex ai workbench)코드를 한 칸씩 실행하며 피처와 모델을 시험하는 노트북. 학습은 먼저 여기서 해 보고 코드로 옮긴다.추론 (일반 구성)\"><h3>실험 환경 (Jupyter / Colab / Vertex AI Workbench)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>코드를 한 칸씩 실행하며 피처와 모델을 시험하는 노트북. 학습은 먼저 여기서 해 보고 코드로 옮긴다.<\/dd><dt>없으면<\/dt><dd>학습 결과를 눈으로 확인하며 고치기 어렵다.<\/dd><dt>출처<\/dt><dd>추론 (일반 구성)<\/dd><dt>배운 곳<\/dt><dd>spark-cluster (Jupyter 접속 경험)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"6\" data-m=\"0\" data-t=\"피처 저장소 (bigquery 시점별 피처 + 최신 피처 테이블)학습과 서비스가 같은 계산식을 쓰게 하는 곳. 학습엔 &quot;그 시점에 알던 값&quot;, 서비스엔 &quot;가장 최근 배치 값&quot;. 별도 제품 없이 테이블로 시작.기획서 3쪽(피처 저장소), 태원 안, 용어 노트 q8·q46\"><h3>피처 저장소 (BigQuery 시점별 피처 + 최신 피처 테이블)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ⑤⑥⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>학습과 서비스가 같은 계산식을 쓰게 하는 곳. 학습엔 &quot;그 시점에 알던 값&quot;, 서비스엔 &quot;가장 최근 배치 값&quot;. 별도 제품 없이 테이블로 시작.<\/dd><dt>없으면<\/dt><dd>학습 때와 서비스 때 값이 어긋나(학습-서빙 불일치) 성능이 떨어진다.<\/dd><dt>출처<\/dt><dd>기획서 3쪽(피처 저장소), 태원 안, 용어 노트 Q8·Q46<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"6\" data-m=\"1\" data-t=\"모델 추론 서버 (gke 위 fastapi)저장된 모델 파일을 읽어 후보 기사에 점수를 매겨 상위 목록을 돌려주는 서버. 학습은 미리 해 두고 접속 때마다 새로 학습하지 않는다.기획서 4쪽(추론 서버)·6쪽 6주차\"><h3><span class=star>★<\/span> 모델 추론 서버 (GKE 위 FastAPI)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 ⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>저장된 모델 파일을 읽어 후보 기사에 점수를 매겨 상위 목록을 돌려주는 서버. 학습은 미리 해 두고 접속 때마다 새로 학습하지 않는다.<\/dd><dt>없으면<\/dt><dd>학습한 모델을 쓸 곳이 없어 피드에 추천이 반영되지 않는다.<\/dd><dt>출처<\/dt><dd>기획서 4쪽(추론 서버)·6쪽 6주차<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci/apps/was/app.py<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"6\" data-m=\"0\" data-t=\"mlflow학습할 때마다 설정·지표·모델 파일에 버전을 붙여 기록하는 도구. 예: v1(0.71) → v2(0.74)라면 v2로 교체.팀회의(태원 샘), 기획서 6쪽 5주차(모델 버전 관리), 태원 안\"><h3>MLflow<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>학습할 때마다 설정·지표·모델 파일에 버전을 붙여 기록하는 도구. 예: v1(0.71) → v2(0.74)라면 v2로 교체.<\/dd><dt>없으면<\/dt><dd>어느 모델이 언제 어떤 설정으로 만들어졌는지 추적이 안 된다.<\/dd><dt>출처<\/dt><dd>팀회의(태원 샘), 기획서 6쪽 5주차(모델 버전 관리), 태원 안<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"6\" data-m=\"0\" data-t=\"vertex ai (model registry·training·endpoint)gcp의 모델 관리·학습·배포 서비스. mlflow의 gcp 쪽 대안이고 배운 sagemaker와 같은 역할. cpu 모델이면 gke 직접 서빙으로 충분.대안 제안 (gcp 우선 원칙)\"><h3>Vertex AI (Model Registry·Training·Endpoint)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑥⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>GCP의 모델 관리·학습·배포 서비스. MLflow의 GCP 쪽 대안이고 배운 SageMaker와 같은 역할. CPU 모델이면 GKE 직접 서빙으로 충분.<\/dd><dt>없으면<\/dt><dd>없어도 GKE + 파일로 대체 가능.<\/dd><dt>출처<\/dt><dd>대안 제안 (GCP 우선 원칙)<\/dd><dt>배운 곳<\/dt><dd>de (SageMaker 개념)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"6\" data-m=\"0\" data-t=\"vertex ai feature store피처를 전용 저장소로 관리하는 gcp 서비스. 학습·서빙 일관성을 제품으로 해결. 테이블로 충분한 mvp엔 과하다.대안 제안, 공식 문서 확인\"><h3>Vertex AI Feature Store<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑤⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>피처를 전용 저장소로 관리하는 GCP 서비스. 학습·서빙 일관성을 제품으로 해결. 테이블로 충분한 MVP엔 과하다.<\/dd><dt>없으면<\/dt><dd>MVP에선 BigQuery·PostgreSQL 테이블로 대체.<\/dd><dt>출처<\/dt><dd>대안 제안, 공식 문서 확인<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"6\" data-m=\"0\" data-t=\"bigquery mlsql 한 줄(`create model`)로 bigquery 안에서 간단한 모델을 학습하는 기능. 파이썬으로 만든 모델과 비교하는 기준선으로 쓸 수 있다.제안 (공식 문서 확인)\"><h3>BigQuery ML<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>SQL 한 줄(`CREATE MODEL`)로 BigQuery 안에서 간단한 모델을 학습하는 기능. 파이썬으로 만든 모델과 비교하는 기준선으로 쓸 수 있다.<\/dd><dt>없으면<\/dt><dd>없어도 된다. 비교 기준이 하나 줄 뿐이다.<\/dd><dt>출처<\/dt><dd>제안 (공식 문서 확인)<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"6\" data-m=\"0\" data-t=\"평가·승인·롤백 절차 (시간순 분리, 사람 승인, 이전 버전 복구)새 모델을 인기순·기존 모델과 같은 조건에서 비교하고, 사람이 확인한 모델 파일만 배포하며, 문제가 나면 이전 버전으로 되돌린다.태원 안(10/28). mvp는 시간순 분리 + 인기순 비교까지\"><h3>평가·승인·롤백 절차 (시간순 분리, 사람 승인, 이전 버전 복구)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ⑥⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>새 모델을 인기순·기존 모델과 같은 조건에서 비교하고, 사람이 확인한 모델 파일만 배포하며, 문제가 나면 이전 버전으로 되돌린다.<\/dd><dt>없으면<\/dt><dd>더 나빠진 모델이 그대로 서비스에 반영될 수 있다.<\/dd><dt>출처<\/dt><dd>태원 안(10/28). MVP는 시간순 분리 + 인기순 비교까지<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd (GitOps 배포)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"6\" data-m=\"1\" data-t=\"평가 지표: ctr 먼저, ndcg@k는 나중클릭률(클릭÷노출)을 1순위 지표로 쓰고 순위 품질 지표는 이후에 본다. 그래서 노출 이벤트가 필요하다.멘토 10/28(ctr 우선)\"><h3><span class=star>★<\/span> 평가 지표: CTR 먼저, nDCG@K는 나중 <span class=new>추가<\/span><\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑥<\/span><\/div><dl><dt>무엇<\/dt><dd>클릭률(클릭÷노출)을 1순위 지표로 쓰고 순위 품질 지표는 이후에 본다. 그래서 노출 이벤트가 필요하다.<\/dd><dt>없으면<\/dt><dd>&quot;추천이 좋아졌나&quot;를 숫자로 말할 수 없다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(CTR 우선)<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"7\"><h2>7. 배포·IaC·CI/CD<\/h2><p class=\"sub\">코드가 서버에 올라가는 길과 인프라를 코드로 만드는 법<\/p><div class=\"grid\"><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"1\" data-t=\"terraform (google provider)서버·저장소·권한을 클릭 대신 코드로 만드는 도구. `plan`으로 미리 보고 `apply`로 만들고 `destroy`로 지운다. 새 프로젝트에 같은 코드를 다시 실행하면 같은 인프라가 생긴다.기획서 3·4쪽(iac)\"><h3><span class=star>★<\/span> Terraform (google provider)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>서버·저장소·권한을 클릭 대신 코드로 만드는 도구. `plan`으로 미리 보고 `apply`로 만들고 `destroy`로 지운다. 새 프로젝트에 같은 코드를 다시 실행하면 같은 인프라가 생긴다.<\/dd><dt>없으면<\/dt><dd>클릭으로 만든 인프라는 재현·이전·정리가 어렵고 누가 바꿨는지 알 수 없다.<\/dd><dt>출처<\/dt><dd>기획서 3·4쪽(IaC)<\/dd><dt>배운 곳<\/dt><dd>tf_project/basic, devops_tf_k8s_ci/infra<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"terraform 원격 상태 (cloud storage 버킷)terraform이 &quot;지금 무엇을 만들어 놨는지&quot; 적어 두는 state 파일을 팀이 같이 쓰도록 버킷에 둔다. git에는 올리지 않는다.추론 (배운 tfstate 취급 이력)\"><h3>Terraform 원격 상태 (Cloud Storage 버킷)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>Terraform이 &quot;지금 무엇을 만들어 놨는지&quot; 적어 두는 state 파일을 팀이 같이 쓰도록 버킷에 둔다. git에는 올리지 않는다.<\/dd><dt>없으면<\/dt><dd>팀원마다 다른 상태를 가지고 서로의 인프라를 덮어쓴다.<\/dd><dt>출처<\/dt><dd>추론 (배운 tfstate 취급 이력)<\/dd><dt>배운 곳<\/dt><dd>log_gen (tfstate 제거 커밋)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"github (저장소·pr 리뷰)코드와 인프라 설정을 보관하고, 변경을 pr로 올려 서로 리뷰하는 곳. 멘토가 &quot;서로 리뷰&quot;를 강조했다.멘토회의록 11절(서로 리뷰), 협업 규칙\"><h3>GitHub (저장소·PR 리뷰)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>코드와 인프라 설정을 보관하고, 변경을 PR로 올려 서로 리뷰하는 곳. 멘토가 &quot;서로 리뷰&quot;를 강조했다.<\/dd><dt>없으면<\/dt><dd>누가 무엇을 바꿨는지, 리뷰했는지 남지 않는다.<\/dd><dt>출처<\/dt><dd>멘토회의록 11절(서로 리뷰), 협업 규칙<\/dd><dt>배운 곳<\/dt><dd>my_project, devops_tf_k8s_ci/cd<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"github actions (ci)코드가 push되면 자동으로 검사 → 이미지 빌드 → 저장소 업로드를 해 주는 자동화. 예: 웹 수정 pr을 머지하면 몇 분 뒤 클러스터에 반영 준비.추론 (gitops는 빌드된 이미지를 전제)\"><h3>GitHub Actions (CI)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>코드가 push되면 자동으로 검사 → 이미지 빌드 → 저장소 업로드를 해 주는 자동화. 예: 웹 수정 PR을 머지하면 몇 분 뒤 클러스터에 반영 준비.<\/dd><dt>없으면<\/dt><dd>빌드·업로드를 사람이 손으로 하고 실수한다.<\/dd><dt>출처<\/dt><dd>추론 (GitOps는 빌드된 이미지를 전제)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci/.github/workflows/ci.yml<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"artifact registry컨테이너 이미지를 보관하는 창고(ecr의 gcp 버전). k8s는 코드가 아니라 이미지를 받아 실행하므로 필요하다.추론 (gitops 전제)\"><h3>Artifact Registry<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>컨테이너 이미지를 보관하는 창고(ECR의 GCP 버전). K8s는 코드가 아니라 이미지를 받아 실행하므로 필요하다.<\/dd><dt>없으면<\/dt><dd>클러스터가 가져갈 이미지를 둘 곳이 없다.<\/dd><dt>출처<\/dt><dd>추론 (GitOps 전제)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci (ECR)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"workload identity federationgithub actions가 키 파일 없이 임시 권한으로 gcp에 접근하게 하는 방식(oidc). 키 유출 위험이 사라진다.추론 (배운 oidc의 번역)\"><h3>Workload Identity Federation<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>GitHub Actions가 키 파일 없이 임시 권한으로 GCP에 접근하게 하는 방식(OIDC). 키 유출 위험이 사라진다.<\/dd><dt>없으면<\/dt><dd>서비스 계정 키 파일을 만들어 GitHub에 넣어야 하고, 유출되면 위험하다.<\/dd><dt>출처<\/dt><dd>추론 (배운 OIDC의 번역)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci (OIDC → ECR)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"0\" data-t=\"argocd (gitops)git에 적힌 배포 상태를 계속 지켜보다가 바뀌면 클러스터를 그에 맞게 자동 교체한다. 예: `kustomization.yaml`의 이미지 태그가 바뀌면 pod가 순차 교체.기획서 3·4쪽(gitops)\"><h3>ArgoCD (GitOps)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>git에 적힌 배포 상태를 계속 지켜보다가 바뀌면 클러스터를 그에 맞게 자동 교체한다. 예: `kustomization.yaml`의 이미지 태그가 바뀌면 Pod가 순차 교체.<\/dd><dt>없으면<\/dt><dd>사람이 kubectl로 직접 배포해야 하고 변경 이력이 git에 남지 않는다.<\/dd><dt>출처<\/dt><dd>기획서 3·4쪽(GitOps)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd (argocd/, scripts/install-argocd.sh)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"7\" data-m=\"0\" data-t=\"k6 부하 테스트가짜 사용자를 대량으로 보내 서버가 버티는지 재는 도구. 가상 독자를 많이 돌릴 때 서버·노드 수를 정하는 근거.제안 (배운 것 연결)\"><h3>k6 부하 테스트<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>가짜 사용자를 대량으로 보내 서버가 버티는지 재는 도구. 가상 독자를 많이 돌릴 때 서버·노드 수를 정하는 근거.<\/dd><dt>없으면<\/dt><dd>동시 접속이 늘 때 서버가 버티는지 모르고 운영한다.<\/dd><dt>출처<\/dt><dd>제안 (배운 것 연결)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/load-test<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"미정\" data-sec=\"7\" data-m=\"1\" data-t=\"계정 교체 + terraform 재현 (마이그레이션 테스트)무료 크레딧 계정을 6주쯤 새 구글 계정으로 교체하고, terraform apply로 같은 인프라를 다시 올리는 것(멘토 10/28). 코드로 정의해야 가능하다.멘토 10/28(계정 교체 설명)·기획서 3쪽 &#x27;계정 이전&#x27;. 필수 여부는 확인\"><h3><span class=star>★<\/span> 계정 교체 + Terraform 재현 (마이그레이션 테스트)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>무료 크레딧 계정을 6주쯤 새 구글 계정으로 교체하고, Terraform apply로 같은 인프라를 다시 올리는 것(멘토 10/28). 코드로 정의해야 가능하다.<\/dd><dt>없으면<\/dt><dd>이전할 일이 생겨도 재현 가능한지 모른다.<\/dd><dt>출처<\/dt><dd>멘토 10/28(계정 교체 설명)·기획서 3쪽 &#x27;계정 이전&#x27;. 필수 여부는 확인<\/dd><dt>배운 곳<\/dt><dd>tf_project (IaC 재적용)<\/dd><\/dl><\/article><article class=\"card ment\" data-tag=\"MVP\" data-sec=\"7\" data-m=\"1\" data-t=\"helm (charts)k8s 앱(airflow, redis 등)을 &quot;설치 패키지&quot;로 한 번에 설치·삭제하는 도구. 멘토 인프라 레포 안내에 terraform과 함께 언급됐다. 예: helm install airflow … 한 줄로 수십 개 yaml을 대신한다.멘토의 org 인프라 레포 안내(terraform, helm charts). v1 카탈로그에 빠져 있었음\"><h3><span class=star>★<\/span> Helm (Charts) <span class=new>추가<\/span><\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>K8s 앱(Airflow, Redis 등)을 &quot;설치 패키지&quot;로 한 번에 설치·삭제하는 도구. 멘토 인프라 레포 안내에 Terraform과 함께 언급됐다. 예: helm install airflow … 한 줄로 수십 개 yaml을 대신한다.<\/dd><dt>없으면<\/dt><dd>Airflow처럼 큰 앱의 yaml을 손으로 작성·관리해야 한다.<\/dd><dt>출처<\/dt><dd>멘토의 org 인프라 레포 안내(Terraform, Helm Charts). v1 카탈로그에 빠져 있었음<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"8\"><h2>8. 모니터링·품질<\/h2><p class=\"sub\">잘 돌고 있는지 지켜보는 눈<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"8\" data-m=\"0\" data-t=\"cloud logging · monitoringgcp가 기본으로 모아 주는 로그와 지표 화면. gke와 기본 연동. 예: 웹이 에러를 냈는지, 추론 서버가 응답하는지 본다.기획서 4쪽·6쪽 7주차(도구 미지정)\"><h3>Cloud Logging · Monitoring<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">계획서에 있음<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>GCP가 기본으로 모아 주는 로그와 지표 화면. GKE와 기본 연동. 예: 웹이 에러를 냈는지, 추론 서버가 응답하는지 본다.<\/dd><dt>없으면<\/dt><dd>서비스가 죽어도 모르고 원인을 찾을 로그가 없다.<\/dd><dt>출처<\/dt><dd>기획서 4쪽·6쪽 7주차(도구 미지정)<\/dd><dt>배운 곳<\/dt><dd>log_gen (CloudWatch)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"8\" data-m=\"0\" data-t=\"airflow ui파이프라인 작업이 성공·실패했는지, 어느 단계에서 멈췄는지 보는 airflow 기본 화면. 따로 설치할 것이 없다.airflow에 포함\"><h3>Airflow UI<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>파이프라인 작업이 성공·실패했는지, 어느 단계에서 멈췄는지 보는 Airflow 기본 화면. 따로 설치할 것이 없다.<\/dd><dt>없으면<\/dt><dd>새벽 배치가 실패했는지 확인할 방법이 없다.<\/dd><dt>출처<\/dt><dd>Airflow에 포함<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (8080)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"8\" data-m=\"0\" data-t=\"prometheus + grafana서버 지표를 모아 그래프로 보여 주는 도구 조합. 설정이 무거워 확장.제안 (배운 것 연결)\"><h3>Prometheus + Grafana<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">직접<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>서버 지표를 모아 그래프로 보여 주는 도구 조합. 설정이 무거워 확장.<\/dd><dt>없으면<\/dt><dd>Cloud Monitoring으로 대체 가능.<\/dd><dt>출처<\/dt><dd>제안 (배운 것 연결)<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/monitoring (kube-prometheus-stack)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"8\" data-m=\"0\" data-t=\"알림 (slack·이메일)배치 실패나 이상 징후를 팀 채널로 알려 주는 연결. 있으면 새벽 장애를 아침에 바로 안다.제안\"><h3>알림 (Slack·이메일)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>배치 실패나 이상 징후를 팀 채널로 알려 주는 연결. 있으면 새벽 장애를 아침에 바로 안다.<\/dd><dt>없으면<\/dt><dd>UI를 열어 보기 전에는 실패를 모른다.<\/dd><dt>출처<\/dt><dd>제안<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"9\"><h2>9. 보안·권한·비밀값<\/h2><p class=\"sub\">누가 무엇을 할 수 있나, 비밀번호는 어디에<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"9\" data-m=\"0\" data-t=\"iam (사람·서비스 계정 권한)누가 무엇을 할 수 있는지 정하는 권한 관리. 팀원은 각자 계정을 초대하고, 앱은 서비스 계정으로 접근한다. 최소 권한이 원칙.문서 근거 없음 → 추론, 용어 노트 q43\"><h3>IAM (사람·서비스 계정 권한)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>누가 무엇을 할 수 있는지 정하는 권한 관리. 팀원은 각자 계정을 초대하고, 앱은 서비스 계정으로 접근한다. 최소 권한이 원칙.<\/dd><dt>없으면<\/dt><dd>계정을 돌려 쓰거나 모두가 모든 권한을 가져 사고가 나기 쉽다.<\/dd><dt>출처<\/dt><dd>문서 근거 없음 → 추론, 용어 노트 Q43<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_ci/infra/iam.tf<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"9\" data-m=\"0\" data-t=\"secret managerllm api 키, db 비밀번호를 안전하게 보관하는 금고. 코드·git·메신저에 비밀값을 올리지 않는다.추론\"><h3>Secret Manager<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>LLM API 키, DB 비밀번호를 안전하게 보관하는 금고. 코드·git·메신저에 비밀값을 올리지 않는다.<\/dd><dt>없으면<\/dt><dd>키가 코드에 들어가 git에 올라가면 유출 사고가 난다.<\/dd><dt>출처<\/dt><dd>추론<\/dd><dt>배운 곳<\/dt><dd>devops_tf_k8s_cd/scripts (secret 생성)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"9\" data-m=\"0\" data-t=\".env / .gitignore 관례로컬 개발의 비밀값은 `.env`에 두고 git에서 제외하며 `.env.example`만 공유하는 습관.추론\"><h3>.env / .gitignore 관례<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>로컬 개발의 비밀값은 `.env`에 두고 git에서 제외하며 `.env.example`만 공유하는 습관.<\/dd><dt>없으면<\/dt><dd>로컬 설정을 올리다 키를 노출한다.<\/dd><dt>출처<\/dt><dd>추론<\/dd><dt>배운 곳<\/dt><dd>airflow-medallion-rag (.env.example)<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"미정\" data-sec=\"9\" data-m=\"0\" data-t=\"네트워크 (vpc·방화벽·사설 접속)서버끼리 어떤 길로 통신하고 외부에 무엇을 열지 정하는 설정. mvp는 기본 네트워크로 시작할 수 있는지 확인.추론 (배운 vpc.tf)\"><h3>네트워크 (VPC·방화벽·사설 접속)<\/h3><div class=\"meta\"><span class=\"tag t2\">미정<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>서버끼리 어떤 길로 통신하고 외부에 무엇을 열지 정하는 설정. MVP는 기본 네트워크로 시작할 수 있는지 확인.<\/dd><dt>없으면<\/dt><dd>너무 열어 두면 보안 위험, 너무 닫으면 서비스끼리 연결이 안 된다.<\/dd><dt>출처<\/dt><dd>추론 (배운 vpc.tf)<\/dd><dt>배운 곳<\/dt><dd>log_gen/infra/vpc.tf, devops_tf_k8s_ci/infra/vpc.tf<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"9\" data-m=\"0\" data-t=\"도메인·https 인증서공개 데모용 주소와 암호화 접속. 팀 내부 시연이면 ip 접속으로 충분.제안\"><h3>도메인·HTTPS 인증서<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ②<\/span><\/div><dl><dt>무엇<\/dt><dd>공개 데모용 주소와 암호화 접속. 팀 내부 시연이면 IP 접속으로 충분.<\/dd><dt>없으면<\/dt><dd>외부에 공개 시연할 때 주소가 불편하고 보안 경고가 뜬다.<\/dd><dt>출처<\/dt><dd>제안<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"10\"><h2>10. 결과 확인 (BI)<\/h2><p class=\"sub\">결과를 눈으로 보는 곳<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"10\" data-m=\"0\" data-t=\"bigquery 콘솔 (점검 쿼리)웹 화면에서 sql을 실행해 결과를 확인. 대시보드 없이도 &quot;어제 클릭 수&quot;, &quot;피처가 만들어졌나&quot;를 볼 수 있다.추론\"><h3>BigQuery 콘솔 (점검 쿼리)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ④⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>웹 화면에서 SQL을 실행해 결과를 확인. 대시보드 없이도 &quot;어제 클릭 수&quot;, &quot;피처가 만들어졌나&quot;를 볼 수 있다.<\/dd><dt>없으면<\/dt><dd>결과를 확인할 가장 쉬운 방법이 없다.<\/dd><dt>출처<\/dt><dd>추론<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"10\" data-m=\"0\" data-t=\"인기순 추천 화면 (+ 이력 없을 때 대체 추천)모델 없이 &quot;어제 가장 많이 클릭된 기사 10개&quot;를 피드에 보여 주는 화면. 중간발표 선택 항목이자 서비스의 기본 대체(fallback) 동작.팀회의(세호), 슬랙, 태원 안(대체 추천). 중간발표에선 선택\"><h3>인기순 추천 화면 (+ 이력 없을 때 대체 추천)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 ⑦<\/span><\/div><dl><dt>무엇<\/dt><dd>모델 없이 &quot;어제 가장 많이 클릭된 기사 10개&quot;를 피드에 보여 주는 화면. 중간발표 선택 항목이자 서비스의 기본 대체(fallback) 동작.<\/dd><dt>없으면<\/dt><dd>모델이 없거나 실패할 때 보여 줄 기본 추천이 없다.<\/dd><dt>출처<\/dt><dd>팀회의(세호), 슬랙, 태원 안(대체 추천). 중간발표에선 선택<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"확장\" data-sec=\"10\" data-m=\"0\" data-t=\"looker studio (bi 대시보드)bigquery에 바로 붙는 무료 대시보드 도구. 클릭으로 표를 차트로 만든다. 배운 quicksight와 같은 역할.멘토회의록 4절(대시보드), 슬랙(윤모)\"><h3>Looker Studio (BI 대시보드)<\/h3><div class=\"meta\"><span class=\"tag t1\">확장<\/span><span class=\"mg\">매니지드<\/span><span class=\"ev\">제안·확장<\/span><span class=\"st\">단계 ④⑤<\/span><\/div><dl><dt>무엇<\/dt><dd>BigQuery에 바로 붙는 무료 대시보드 도구. 클릭으로 표를 차트로 만든다. 배운 QuickSight와 같은 역할.<\/dd><dt>없으면<\/dt><dd>대시보드 없이 쿼리로만 결과를 본다.<\/dd><dt>출처<\/dt><dd>멘토회의록 4절(대시보드), 슬랙(윤모)<\/dd><dt>배운 곳<\/dt><dd>de (QuickSight)<\/dd><\/dl><\/article><\/div><\/section><section data-sec=\"11\"><h2>11. 비용·개발 환경·운영 습관<\/h2><p class=\"sub\">돈을 아끼고 개발을 편하게 하는 도구<\/p><div class=\"grid\"><article class=\"card\" data-tag=\"MVP\" data-sec=\"11\" data-m=\"0\" data-t=\"pricing calculator (가격 계산기)구성한 항목을 넣어 7주치 비용을 미리 계산하는 gcp 도구. 멘토 비용 질문의 근거 숫자를 만든다.멘토회의록 5절(비용 감당), 용어 노트 q11\"><h3>Pricing Calculator (가격 계산기)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>구성한 항목을 넣어 7주치 비용을 미리 계산하는 GCP 도구. 멘토 비용 질문의 근거 숫자를 만든다.<\/dd><dt>없으면<\/dt><dd>크레딧이 충분한지 감으로만 판단한다.<\/dd><dt>출처<\/dt><dd>멘토회의록 5절(비용 감당), 용어 노트 Q11<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"11\" data-m=\"0\" data-t=\"예산 알림 (budget alert)쓴 돈이 정한 금액에 가까워지면 알려 주는 설정. 첫날 켜 둔다.추론\"><h3>예산 알림 (Budget alert)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>쓴 돈이 정한 금액에 가까워지면 알려 주는 설정. 첫날 켜 둔다.<\/dd><dt>없으면<\/dt><dd>켜 둔 서버가 크레딧을 몰래 소진해도 모른다.<\/dd><dt>출처<\/dt><dd>추론<\/dd><dt>배운 곳<\/dt><dd>-<\/dd><\/dl><\/article><article class=\"card\" data-tag=\"MVP\" data-sec=\"11\" data-m=\"0\" data-t=\"안 쓸 때 끄기 (`terraform destroy`·노드 축소)켜 두는 동안 과금되는 것(gke 노드, composer 등)을 쓰지 않을 때 줄이거나 지우는 습관. terraform으로 다시 만들 수 있게 해 두면 안전.추론\"><h3>안 쓸 때 끄기 (`terraform destroy`·노드 축소)<\/h3><div class=\"meta\"><span class=\"tag t0\">MVP<\/span><span class=\"ev\">필요해 보임<\/span><span class=\"st\">단계 공통<\/span><\/div><dl><dt>무엇<\/dt><dd>켜 두는 동안 과금되는 것(GKE 노드, Composer 등)을 쓰지 않을 때 줄이거나 지우는 습관. Terraform으로 다시 만들 수 있게 해 두면 안전.<\/dd><dt>없으면<\/dt><dd>주말·밤에도 서버 비용이 계속 나간다.<\/dd><dt>출처<\/dt><dd>추론<\/dd><dt>배운 곳<\/dt><dd>tf_project (destroy)<\/dd><\/dl><\/article><article class=\"card\" data-tag= var view = document.getElementById('view');
function go(name, anchor, push) {
  if (!PAGES[name]) name = 'index';
  view.onload = function () {
    var d = view.contentDocument;
    document.title = d.title || '뉴스 추천 공동 청사진';
    d.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var m = a.getAttribute('href').match(/^([a-z]+)\.html(#.*)?$/);
      if (m) { e.preventDefault(); go(m[1], m[2] ? m[2].slice(1) : '', true); }
    });
    if (anchor) { var t = d.getElementById(anchor); if (t) t.scrollIntoView(); }
  };
  view.srcdoc = PAGES[name];
  var h = '#' + name + (anchor ? '/' + anchor : '');
  if (push) history.pushState(null, '', h); else history.replaceState(null, '', h);
}
function fromHash() {
  var p = location.hash.slice(1).split('/');
  go(p[0] || 'index', p[1] || '', false);
}
window.addEventListener('popstate', fromHash);
fromHash();
