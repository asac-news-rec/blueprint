center; gap: 8px; }\n#index ol { font-size: 14px; }\n#index a { color: var(--fg); }\n#index .src { color: var(--muted); font-size: 12px; }\na.task { text-decoration: none; cursor: pointer; }\na.task:hover, a.task:focus-visible { background: var(--accent-soft); }\n.src-note { font-size: 13px; margin-top: 8px !important; }\ntable.wbs td:first-child { font: 500 12px var(--mono); color: var(--muted); }\ntable.wbs tr.ours td { font-weight: 700; }\ntable.wbs tr:target td { background: var(--decide-soft); }\n@media (max-width: 520px) { section { padding: 18px 16px; } header h1 { font-size: 24px; } .flag { grid-template-columns: 1fr; gap: 2px; } }\n<\/style>\n<\/head>\n<body>\n\n\n<div class=\"wrap\">\n<nav class=\"toc\" aria-label=\"상위 이동\" style=\"border:0;padding:0\"><a href=\"index.html\">← 공동 청사진 대문<\/a><a href=\"wbs.html\">작업 나열표<\/a><\/nav>\n<header>\n  <div class=\"meta\">SKP AI DE 1기 · 뉴스 추천 · 처리·피처·모델 파트 (윤모) · 2026-10-30 초안<\/div>\n  <h1>추천 모델 청사진<\/h1>\n  <p>행동 로그를 피처로 만들고, 그 피처로 \"이 독자에게 지금 보여 줄 기사\"를 고르는 부분의 설계안이다. 바쁘면 <a href=\"#asks\">팀원별로 필요한 것<\/a>과 <a href=\"#index\">표시 모아보기<\/a>만 봐도 된다. 본문은 설계 순서대로 적었다.<\/p>\n  <p class=\"src-note\">작업 번호(<span class=\"task\">#12<\/span> 같은 표시)는 장주현 님이 10/29에 공유한 「작업 나열표 · 병렬 구간 · WBS 골격」의 작업 28개 번호다. 번호를 누르면 <a href=\"wbs.html\">작업 나열표 페이지<\/a>의 해당 작업으로 이동한다.<\/p>\n  <div class=\"legend\">\n    <span class=\"tag risk\">예상 문제<\/span><span class=\"tag decide\">결정 필요<\/span><span class=\"tag unsure\">불확실·어려움<\/span>\n    <span class=\"tag pick\">1차 선택<\/span><span class=\"tag cmp\">비교군<\/span><span class=\"tag ext\">확장<\/span><span class=\"tag hold\">보류<\/span>\n    <span class=\"counts\" id=\"counts\"><\/span>\n  <\/div>\n<\/header>\n\n<nav class=\"toc\" aria-label=\"목차\">\n  <a href=\"#mine\">맡는 일<\/a><a href=\"#asks\">팀원별 요청<\/a><a href=\"#overview\">전체 그림<\/a><a href=\"#s1\">1 지표<\/a><a href=\"#s2\">2 피처↔이벤트<\/a><a href=\"#s3\">3 피처 정의서<\/a><a href=\"#s4\">4 피처 DAG<\/a><a href=\"#s4b\">4+ Pub/Sub<\/a><a href=\"#s5\">5 데이터 확보<\/a><a href=\"#s6\">6 학습 데이터<\/a><a href=\"#s7\">7 후보 생성<\/a><a href=\"#s8\">8 랭킹<\/a><a href=\"#s9\">9 후처리<\/a><a href=\"#s10\">10 평가<\/a><a href=\"#s11\">11 서빙 연결<\/a><a href=\"#s12\">12 운영·통합<\/a><a href=\"#s13\">13 질문<\/a><a href=\"wbs.html\">작업 나열표 ↗<\/a><a href=\"#index\">표시 모아보기<\/a>\n<\/nav>\n\n<section id=\"mine\">\n  <h2>이 파트가 맡는 일<\/h2>\n  <p>처리·피처·모델 파트는 작업표의 #11, #12, #13, #23을 맡는다. 아래 STEP에서 각 작업을 어떻게 할지 설명한다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>작업표<\/th><th>작업<\/th><th>산출물<\/th><th>설명 위치<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><span class=\"task\">#23<\/span><\/td><td>평가 지표 정의 (CTR 먼저, nDCG@K는 이후)<\/td><td>지표 문서<\/td><td>STEP 1<\/td><\/tr>\n      <tr><td><span class=\"task\">#11<\/span><\/td><td>피처 목록과 필요한 이벤트 거꾸로 확인<\/td><td>피처 정의서<\/td><td>STEP 2, 3<\/td><\/tr>\n      <tr><td><span class=\"task\">#12<\/span><\/td><td>정제·집계·피처 DAG<\/td><td>DAG<\/td><td>STEP 4<\/td><\/tr>\n      <tr><td><span class=\"task\">#13<\/span><\/td><td>baseline(인기순), CTR 모델, 평가<\/td><td>노트북, 지표<\/td><td>STEP 6~10<\/td><\/tr>\n      <tr><td>맞물림<\/td><td><span class=\"task\">#8<\/span> 행동 정의 · <span class=\"task\">#9<\/span> 수집 · <span class=\"task\">#14<\/span> 추론 서버 · <span class=\"task\">#15<\/span> 피처 공유 방식 · <span class=\"task\">#19<\/span> 최소 데이터 · <span class=\"task\">#20<\/span> 전달 방식 · <span class=\"task\">#22<\/span> 파티션·비용 · <span class=\"task\">#28<\/span> 통합 테스트<\/td><td>합의 메모<\/td><td>각 STEP의 표시<\/td><\/tr>\n      <tr><td><span class=\"task\">#25<\/span><\/td><td>중간발표(11/19 예정)에서 이 파트가 보여 줄 것<\/td><td>BigQuery 원본·집계 테이블, baseline 피드<\/td><td>STEP 4, 8<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n<\/section>\n\n<section id=\"asks\">\n  <h2>팀원별로 필요한 것<\/h2>\n  <p>이 파트가 진행되려면 아래 항목을 함께 정하거나 받아야 한다. 자세한 이유는 오른쪽 STEP에 있다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>누구<\/th><th>요청하거나 같이 정할 것<\/th><th>관련 작업<\/th><th>자세히<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>세호 (FE·수집)<\/td><td>\"화면에 보였다\"(impression)의 기준<\/td><td><span class=\"task\">#7<\/span> <span class=\"task\">#8<\/span><\/td><td>STEP 1<\/td><\/tr>\n      <tr><td>세호 (FE·수집)<\/td><td>모든 이벤트에 <code>event_id<\/code>, <code>position<\/code>, <code>request_id<\/code>, <code>model_version<\/code> 싣기<\/td><td><span class=\"task\">#9<\/span><\/td><td>STEP 2<\/td><\/tr>\n      <tr><td>세호 (FE·수집)<\/td><td>익명 사용자 ID 처리, 봇을 수집에서 막을지 정제에서 표시할지<\/td><td><span class=\"task\">#8<\/span><\/td><td>STEP 2, 4<\/td><\/tr>\n      <tr><td>태원 (뉴스)<\/td><td>기사 메타에 카테고리·세부 태그·<code>published_at<\/code>·자극도 점수 넣기<\/td><td><span class=\"task\">#4<\/span> <span class=\"task\">#18<\/span><\/td><td>STEP 3<\/td><\/tr>\n      <tr><td>태원 (뉴스)<\/td><td>기사 임베딩은 피처 DAG에서 계산하는 안에 동의하는지 (뉴스 쪽은 제목·본문·카테고리·<code>published_at<\/code>만 Cloud SQL에 정확히 저장)<\/td><td><span class=\"task\">#5<\/span> <span class=\"task\">#6<\/span><\/td><td>STEP 3<\/td><\/tr>\n      <tr><td>장주현 (인프라)<\/td><td>서빙용 피처 파일의 GCS 경로·권한, BigQuery 파티션·스캔 비용 기준<\/td><td><span class=\"task\">#2<\/span> <span class=\"task\">#22<\/span><\/td><td>STEP 3, 4<\/td><\/tr>\n      <tr><td>장주현 (인프라)<\/td><td>GPU 사용 가능 범위, 프로젝트 ID·버킷 이름을 설정값으로 받기 (계정 교체 대비)<\/td><td><span class=\"task\">#21<\/span> <span class=\"task\">#24<\/span><\/td><td>STEP 8, 12<\/td><\/tr>\n      <tr><td>전원<\/td><td>추론 서버 담당 확정 (WBS Q2 추천: 윤모 주담당, 이후 장주현 합류), 요청 시 점수화 확정 (WBS Q3)<\/td><td><span class=\"task\">#14<\/span> <span class=\"task\">#20<\/span><\/td><td>STEP 11<\/td><\/tr>\n      <tr><td>전원<\/td><td>가상 독자 담당, 학습용 데이터 양·기간<\/td><td><span class=\"task\">#10<\/span> <span class=\"task\">#17<\/span> <span class=\"task\">#19<\/span><\/td><td>STEP 5<\/td><\/tr>\n      <tr><td>전원<\/td><td>발표에서 내세울 대표 지표 (CTR로 제안)<\/td><td><span class=\"task\">#23<\/span><\/td><td>STEP 1<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n<\/section>\n\n<section id=\"overview\">\n  <h2>전체 그림<\/h2>\n  <p>독자의 노출·클릭·읽기 기록은 로깅 서버를 거쳐 GCS에 5분 단위로 쌓인다. 피처 DAG가 이것을 BigQuery에서 원본 → 정제 → 집계 → 피처로 바꾸고, 모델도 학습한다. DAG는 서빙용 피처를 파일로 GCS에 내보낸다. 점선 안의 추론 서버는 이 파일과 학습된 모델을 불러 두고, 피드 요청이 올 때마다 후보 10~20개에 점수를 매긴다. Redis는 멘토 확인 전까지 MVP에서 뺐다(WBS Q8). 굵은 테두리가 처리·피처·모델 파트가 만드는 부분이다.<\/p>\n  <div class=\"diagram\">\n  <svg viewBox=\"0 0 760 262\" role=\"img\" aria-label=\"로그가 피처 DAG를 거쳐 피처 파일과 모델이 되고, 추론 서버가 요청마다 후보에 점수를 매겨 피드에 넘기는 구조\">\n    <defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/><\/marker><\/defs>\n    <rect x=\"160\" y=\"10\" width=\"432\" height=\"98\" rx=\"10\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.25\" stroke-dasharray=\"5 4\"/>\n    <text x=\"172\" y=\"27\" font-size=\"12\" font-weight=\"700\" fill=\"var(--fg)\">추론 서버<\/text>\n    <text x=\"232\" y=\"27\" font-size=\"11.5\" fill=\"var(--muted)\">#14 · 피드 요청마다 점수화<\/text>\n    <g fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.25\">\n      <path d=\"M152 72H166\" marker-end=\"url(#ar)\"/><path d=\"M296 72H310\" marker-end=\"url(#ar)\"/><path d=\"M440 72H454\" marker-end=\"url(#ar)\"/><path d=\"M584 72H598\" marker-end=\"url(#ar)\"/>\n      <path d=\"M664 100V168\" marker-end=\"url(#ar)\"/><path d=\"M600 206H586\" marker-end=\"url(#ar)\"/><path d=\"M312 206H298\" marker-end=\"url(#ar)\"/>\n      <path d=\"M232 170V102\" marker-end=\"url(#ar)\"/><path d=\"M376 170V102\" marker-end=\"url(#ar)\"/>\n    <\/g>\n    <g stroke-width=\"1.25\">\n      <rect x=\"24\" y=\"44\" width=\"128\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n      <rect x=\"168\" y=\"44\" width=\"128\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n      <rect x=\"312\" y=\"44\" width=\"128\" height=\"56\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      <rect x=\"456\" y=\"44\" width=\"128\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n      <rect x=\"600\" y=\"44\" width=\"128\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n      <rect x=\"168\" y=\"170\" width=\"128\" height=\"72\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n      <rect x=\"312\" y=\"170\" width=\"272\" height=\"72\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n      <rect x=\"600\" y=\"170\" width=\"128\" height=\"72\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--muted)\"/>\n    <\/g>\n    <g font-size=\"13\" font-weight=\"700\" fill=\"var(--fg)\" text-anchor=\"middle\">\n      <text x=\"88\" y=\"68\">기사 풀<\/text><text x=\"232\" y=\"68\">후보 생성<\/text><text x=\"376\" y=\"68\">점수화 모델<\/text><text x=\"520\" y=\"68\">후처리<\/text><text x=\"664\" y=\"68\">피드 노출<\/text>\n      <text x=\"232\" y=\"194\">서빙용 피처 파일<\/text><text x=\"448\" y=\"194\">피처 DAG (Airflow)<\/text><text x=\"664\" y=\"194\">로깅 서버<\/text>\n    <\/g>\n    <g font-size=\"11.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n      <text x=\"88\" y=\"86\">Cloud SQL 뉴스 DB<\/text><text x=\"232\" y=\"86\">10~20개<\/text><text x=\"376\" y=\"86\" fill=\"var(--fg)\">baseline → CTR 모델<\/text><text x=\"520\" y=\"86\">중복·다양성 규칙<\/text><text x=\"664\" y=\"86\">뉴스 WAS API<\/text>\n      <text x=\"232\" y=\"212\">GCS · Parquet<\/text><text x=\"232\" y=\"228\">Redis는 확장<\/text>\n      <text x=\"448\" y=\"212\">원본 → 정제 → 집계 → 피처<\/text><text x=\"448\" y=\"228\">BigQuery · 모델 학습<\/text>\n      <text x=\"664\" y=\"212\">GCS 5분 파티션<\/text><text x=\"664\" y=\"228\">행동 이벤트<\/text>\n    <\/g>\n    <g font-size=\"11.5\" fill=\"var(--muted)\">\n      <text x=\"240\" y=\"142\">피처 불러오기<\/text><text x=\"384\" y=\"142\">학습한 모델 파일<\/text>\n    <\/g>\n  <\/svg>\n  <\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>후보 수 10~20개는 팀 계획(<span class=\"task\">#14<\/span>)을 따랐다. 후보가 적으면 점수화 모델이 바꿀 수 있는 순서도 적다. 후보 생성 품질이 전체 성능을 좌우하므로, 수를 늘릴지 데이터를 본 뒤 다시 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>후보 10~20개를 누가 고르는지. WBS Q2 예시처럼 뉴스 WAS가 후보를 골라 추론 서버에 보낼지, 추론 서버가 직접 고를지 정해야 한다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s1\">\n  <h2><span class=\"step\">STEP 1<\/span>평가 지표 정의 <span class=\"task\">#23<\/span><\/h2>\n  <p>팀 합의대로 CTR을 먼저 정의하고 순위 지표(nDCG@K)는 그 다음에 붙인다. CTR은 계산이 단순하고 baseline 피드만 있어도 바로 잴 수 있기 때문이다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>순서<\/th><th>지표<\/th><th>계산<\/th><th>쓰는 곳<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>1차<\/td><td>CTR<\/td><td>클릭 수 ÷ 노출 수 (사용자·기사·모델 버전·위치별)<\/td><td>baseline 비교, 대시보드, 가상 독자 실험<\/td><\/tr>\n      <tr><td>1차<\/td><td>AUC<\/td><td>클릭한 기사에 안 한 기사보다 높은 점수를 줄 확률<\/td><td>CTR 모델 오프라인 평가<\/td><\/tr>\n      <tr><td>이후<\/td><td>nDCG@K, MRR<\/td><td>클릭한 기사가 목록 위쪽에 있을수록 높은 점수<\/td><td>순위 품질 평가 (MIND와 같은 지표)<\/td><\/tr>\n      <tr><td>이후<\/td><td>체류 시간, 읽기 완료율<\/td><td>클릭 후 기사 페이지에 머문 시간<\/td><td>낚시성 클릭 확인<\/td><\/tr>\n      <tr><td>이후<\/td><td>카테고리 다양성, 재방문<\/td><td>목록 안 카테고리 수, 다음 날 다시 온 비율<\/td><td>후처리 효과 확인<\/td><\/tr>\n      <tr><td>합성 전용<\/td><td>페르소나 정답 일치<\/td><td>페르소나별 추천 카테고리 비율 vs 페르소나 카드<\/td><td>가상 독자 검증<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>CTR의 분모가 되는 \"노출\"의 기준을 세호 님과 맞춰야 한다. 화면에 일부만 보인 카드도 노출로 셀지에 따라 CTR이 크게 달라진다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>최적화 목표를 클릭 하나로 둘지, 체류 시간을 섞을지 정해야 한다. 클릭만 쫓으면 자극적인 제목이 위로 올라온다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>합성 데이터에서 나온 성능 숫자는 실제 독자에게서의 성능을 뜻하지 않는다. 발표에서 어떻게 해석할지 멘토님께 확인한다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s2\">\n  <h2><span class=\"step\">STEP 2<\/span>피처에서 이벤트 거꾸로 확인 <span class=\"task\">#11<\/span> <span class=\"task\">#8<\/span><\/h2>\n  <p>만들고 싶은 피처에서 출발해 필요한 이벤트와 필드를 거꾸로 뽑는다. 이 목록을 세호 님의 수집 행동 정의(<span class=\"task\">#8<\/span>)와 맞춰 본다. 양방향 작업이라 한 번에 끝나지 않고 몇 번 오간다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>이벤트<\/th><th>언제 생기나<\/th><th>이 이벤트가 있어야 만드는 피처<\/th><th>꼭 필요한 필드<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><code>impression<\/code><\/td><td>기사 카드가 화면에 보일 때<\/td><td>CTR(분모), 이미 본 횟수, 학습 데이터의 정답 0<\/td><td><code>position<\/code>, <code>request_id<\/code><\/td><\/tr>\n      <tr><td><code>click<\/code><\/td><td>기사 카드를 눌렀을 때<\/td><td>CTR(분자), 카테고리 선호, 최근 클릭, 사용자 임베딩<\/td><td><code>article_id<\/code>, <code>position<\/code><\/td><\/tr>\n      <tr><td><code>read_end<\/code><\/td><td>기사 페이지를 떠날 때<\/td><td>체류 시간, 낚시 클릭 구분, 봇 탐지<\/td><td><code>dwell_ms<\/code><\/td><\/tr>\n      <tr><td><code>visit<\/code><\/td><td>세션이 시작될 때<\/td><td>시간대별 방문 비율, 활동 일수<\/td><td><code>session_id<\/code><\/td><\/tr>\n      <tr><td>기사 메타<\/td><td>기사가 발행될 때 (Cloud SQL)<\/td><td>카테고리, 경과 시간, 기사 임베딩, 자극도<\/td><td><code>category<\/code>, <code>published_at<\/code>, 본문<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <p>모든 사용자 이벤트에 공통으로 필요한 필드는 <code>event_id<\/code>, <code>user_id<\/code>(또는 익명 ID), <code>session_id<\/code>, <code>event_time<\/code>, <code>model_version<\/code>이다.<\/p>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>익명 사용자 처리(<span class=\"task\">#8<\/span>). 쿠키 기반 익명 ID를 사용자처럼 다룰지, 세션 피처만 쓸지 정해야 한다. 로그인 후 익명 기록을 합칠지도 함께 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>프론트엔드가 <code>request_id<\/code>와 <code>position<\/code>을 모든 노출 이벤트에 실어 보내야 한다. 빠지면 피드백 연결과 위치 편향 보정이 둘 다 안 된다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>모델이 원하는 이벤트와 수집 쪽이 만들 수 있는 이벤트가 다를 수 있다. 우선순위는 impression, click, read_end, visit 순서로 제안한다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s3\">\n  <h2><span class=\"step\">STEP 3<\/span>피처 설계와 피처 정의서 <span class=\"task\">#11<\/span> <span class=\"task\">#15<\/span><\/h2>\n  <p>피처는 네 묶음 14개로 시작한다. 대부분 하루나 1시간 단위 배치로 만든다. 실시간이 가장 필요한 것은 \"최근 클릭 5개\"이고, 나중에 스트림으로 바꿀 첫 후보로 둔다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>묶음<\/th><th>피처<\/th><th>왜 필요한가<\/th><th>원본<\/th><th>갱신<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>사용자<\/td><td>카테고리별 클릭 비율(30일)<\/td><td>장기 관심<\/td><td>click, 기사 메타<\/td><td>하루<\/td><\/tr>\n      <tr><td>사용자<\/td><td>최근 클릭 5개의 카테고리 분포<\/td><td>단기 관심<\/td><td>click<\/td><td>1시간 → 실시간<\/td><\/tr>\n      <tr><td>사용자<\/td><td>사용자 임베딩 (최근 클릭 기사 임베딩 평균)<\/td><td>카테고리보다 세밀한 관심<\/td><td>click, 기사 임베딩<\/td><td>하루<\/td><\/tr>\n      <tr><td>사용자<\/td><td>시간대별 방문 비율<\/td><td>출퇴근형·저녁형 접속 패턴<\/td><td>visit<\/td><td>하루<\/td><\/tr>\n      <tr><td>사용자<\/td><td>전체 CTR, 활동 일수<\/td><td>자주 누르는 사람과 안 누르는 사람 보정<\/td><td>impression, click<\/td><td>하루<\/td><\/tr>\n      <tr><td>기사<\/td><td>카테고리, 세부 태그<\/td><td>기본 주제 신호<\/td><td>기사 메타<\/td><td>발행 시<\/td><\/tr>\n      <tr><td>기사<\/td><td>발행 후 경과 시간<\/td><td>뉴스는 신선도가 크게 작용<\/td><td>기사 메타<\/td><td>요청 시<\/td><\/tr>\n      <tr><td>기사<\/td><td>최근 1시간 클릭 수·CTR<\/td><td>지금 뜨는 기사, 인기순 baseline<\/td><td>impression, click<\/td><td>1시간<\/td><\/tr>\n      <tr><td>기사<\/td><td>제목·본문 임베딩<\/td><td>내용 비교의 기반<\/td><td>기사 본문<\/td><td>발행 시<\/td><\/tr>\n      <tr><td>기사<\/td><td>자극도 점수<\/td><td>낚시성 제목 영향 확인<\/td><td>뉴스 생성<\/td><td>발행 시<\/td><\/tr>\n      <tr><td>사용자×기사<\/td><td>사용자·기사 임베딩 코사인 유사도<\/td><td>핵심 개인화 신호<\/td><td>두 임베딩<\/td><td>요청 시<\/td><\/tr>\n      <tr><td>사용자×기사<\/td><td>이 사용자의 해당 카테고리 CTR<\/td><td>카테고리 선호의 강도<\/td><td>impression, click<\/td><td>하루<\/td><\/tr>\n      <tr><td>사용자×기사<\/td><td>이 기사를 이미 본 횟수<\/td><td>반복 노출 피로<\/td><td>impression<\/td><td>1시간<\/td><\/tr>\n      <tr><td>문맥<\/td><td>요청 시각(시, 요일), 노출 위치<\/td><td>시간대 취향, 위치 편향 보정<\/td><td>impression<\/td><td>요청 시<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <h3>피처 정의서 형식<\/h3>\n  <p>피처마다 아래 칸을 채운 것이 <span class=\"task\">#11<\/span>의 산출물이다. 이 문서가 그대로 피처 공유 방식(<span class=\"task\">#15<\/span>)의 합의 기준이 된다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>이름<\/th><th>키<\/th><th>타입<\/th><th>계산<\/th><th>기간<\/th><th>원본 테이블<\/th><th>갱신<\/th><th>서빙 위치<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><code>u_cat_click_ratio_30d<\/code><\/td><td>user_id, category<\/td><td>FLOAT<\/td><td>카테고리 클릭 ÷ 전체 클릭<\/td><td>30일<\/td><td><code>clean.events<\/code><\/td><td>매일 01시<\/td><td>GCS <code>serving/feat_user.parquet<\/code><\/td><\/tr>\n      <tr><td><code>a_ctr_1h<\/code><\/td><td>article_id<\/td><td>FLOAT<\/td><td>클릭 ÷ 노출<\/td><td>1시간<\/td><td><code>agg.article_hourly<\/code><\/td><td>매시<\/td><td>GCS <code>serving/feat_article.parquet<\/code><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <h3>기사 임베딩 모델 후보<\/h3>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>모델<\/th><th>설명<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>multilingual-e5<\/td><td>100개 넘는 언어를 지원하는 공개 문장 임베딩 모델. 한·영 혼합 기사에 사용 가능<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>BGE-M3<\/td><td>다국어 공개 모델, 긴 문서에 강함<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>Vertex AI 다국어 임베딩<\/td><td>GCP API 호출, 서버 운영 불필요, 호출당 과금<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>한국어 Sentence-BERT 계열<\/td><td>한국어 전용 문장 임베딩. 영어 기사와 섞이면 불리<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n      <tr><td>TF-IDF<\/td><td>단어 빈도 기반 벡터. 가장 단순한 기준선<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>학습-서빙 피처 불일치. 학습은 BigQuery SQL로, 서빙은 다른 코드로 피처를 만들면 값이 어긋난다. 학습과 서빙이 같은 피처 테이블을 읽게 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>피처 공유 방식(<span class=\"task\">#15<\/span>). BigQuery 피처 테이블 스키마와 서빙용 피처 파일의 경로·컬럼을 추론 서버 담당과 합의해야 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>Memorystore(Redis)의 용도는 멘토 답을 기다리는 중이다(WBS Q8). 답을 받기 전까지 MVP는 배치 피처 파일로 가고, 실시간 피처가 필요해지면 Redis를 붙인다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>기사 임베딩 담당. 처리·피처·모델 파트의 피처 DAG가 매시 새 기사만 계산하는 안을 추천한다(STEP 4 <code>embed_articles<\/code>). 임베딩 모델은 모델 쪽이 실험하며 바꾸는 입력이라 같은 파트가 맡는 편이 낫고, 뉴스 쪽은 기사 메타만 정확히 주면 된다. 태원 님 동의가 필요하다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>새 기사는 최대 1시간 늦게 임베딩이 생긴다. 그동안은 최신순·인기순 후보 생성이 새 기사를 후보에 넣어 준다. 더 빨라야 하면 실행 주기를 10분으로 줄인다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>기사 세부 태그(<span class=\"task\">#18<\/span>)와 자극도 점수를 기사 메타에 넣을 수 있는지 태원 님과 확인한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>단기 관심 피처를 실시간으로 만들 가치가 있는지 아직 모른다. 배치 버전과 비교해 효과가 있을 때만 스트림으로 바꾼다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s4\">\n  <h2><span class=\"step\">STEP 4<\/span>정제·집계·피처 DAG <span class=\"task\">#12<\/span> <span class=\"task\">#22<\/span><\/h2>\n  <p>GCS에 5분 단위로 쌓인 이벤트를 네 층의 BigQuery 테이블로 단계별로 바꾼다. 층마다 테이블을 따로 두면, 문제가 생겼을 때 어느 단계에서 틀렸는지 찾기 쉽고 그 층부터 다시 돌릴 수 있다.<\/p>\n  <div class=\"chain\" aria-label=\"데이터 층 흐름\">\n    <div class=\"node\"><b>GCS<\/b><span>5분 파티션 JSON<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node main\"><b>raw.events<\/b><span>원본 그대로 적재<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node main\"><b>clean.events<\/b><span>중복 제거·검사·봇 표시<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node main\"><b>agg.*<\/b><span>사용자·기사 단위 집계<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node main\"><b>feat.*<\/b><span>날짜별 피처 스냅샷<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node\"><b>학습 데이터 / 피처 파일<\/b><span>모델 학습, 서빙<\/span><\/div>\n  <\/div>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>DAG<\/th><th>주기<\/th><th>입력 → 출력<\/th><th>하는 일<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><code>load_raw<\/code><\/td><td>매시<\/td><td>GCS → <code>raw.events<\/code><\/td><td>지난 1시간의 5분 파티션 12개를 적재<\/td><\/tr>\n      <tr><td><code>clean_events<\/code><\/td><td>매시<\/td><td><code>raw<\/code> → <code>clean.events<\/code><\/td><td><code>event_id<\/code> 중복 제거, 필수 필드·스키마 검사, 시간대 통일, 봇 규칙 표시, 익명 ID 처리<\/td><\/tr>\n      <tr><td><code>agg_hourly<\/code><\/td><td>매시<\/td><td><code>clean<\/code> → <code>agg.article_hourly<\/code><\/td><td>기사별 노출·클릭·CTR (인기순 baseline의 재료)<\/td><\/tr>\n      <tr><td><code>agg_daily<\/code><\/td><td>매일<\/td><td><code>clean<\/code> → <code>agg.user_daily<\/code>, <code>agg.user_cat_daily<\/code><\/td><td>사용자별, 사용자×카테고리별 하루 집계<\/td><\/tr>\n      <tr><td><code>build_features<\/code><\/td><td>매일·매시<\/td><td><code>agg<\/code> → <code>feat.user<\/code>, <code>feat.article<\/code><\/td><td>30일 창 피처 계산, <code>feature_date<\/code>로 스냅샷 저장<\/td><\/tr>\n      <tr><td><code>embed_articles<\/code><\/td><td>매시<\/td><td>Cloud SQL 새 기사 → <code>feat.article_embedding<\/code><\/td><td>지난 실행 이후 발행된 기사만 골라 제목·본문 임베딩 계산. 모델 이름과 버전도 함께 저장해, 임베딩 모델을 바꾸면 전체를 다시 계산<\/td><\/tr>\n      <tr><td><code>export_serving<\/code><\/td><td>피처 갱신 직후<\/td><td><code>feat<\/code> → GCS 피처 파일<\/td><td>추론 서버가 읽을 최신 피처를 Parquet로 내보냄 (Redis 도입 시 Redis 적재로 교체)<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <h3>DAG 설계 원칙<\/h3>\n  <ul>\n    <li><b>다시 돌려도 같은 결과<\/b>: 날짜·시간 파티션 단위로 지우고 다시 쓴다. 같은 시간을 두 번 돌려도 행이 두 배가 되지 않는다.<\/li>\n    <li><b>과거 재처리(backfill)<\/b>: 합성 데이터 180일치를 처음 넣을 때와 로직을 고쳤을 때 날짜 범위를 지정해 다시 돌린다.<\/li>\n    <li><b>파티션과 클러스터링<\/b>: 모든 테이블을 <code>event_date<\/code>로 파티션하고 <code>user_id<\/code>나 <code>article_id<\/code>로 클러스터링한다. 30일 창 계산이 전체 테이블을 읽지 않게 한다(<span class=\"task\">#22<\/span>).<\/li>\n    <li><b>로컬 먼저<\/b>: 로컬 compose(<span class=\"task\">#16<\/span>)의 Airflow와 폴더형 GCS에서 같은 DAG를 먼저 돌리고, 클라우드로 옮긴다.<\/li>\n    <li><b>품질 검사<\/b>: 층마다 행 수, 빈 값 비율, 중복 비율을 기록한다. 기준을 넘으면 다음 단계를 멈춘다.<\/li>\n  <\/ul>\n  <h3>도구 후보<\/h3>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>도구<\/th><th>설명<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Airflow + BigQuery SQL<\/td><td>DAG 안에서 SQL 파일을 직접 실행<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>dbt<\/td><td>SQL 모델 간 의존성, 테스트, 문서를 관리하는 도구. Airflow에서 호출<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>BigQuery 외부 테이블<\/td><td>GCS 파일을 적재하지 않고 바로 조회<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>Dataflow (Apache Beam)<\/td><td>스트림·배치 처리 서비스. 실시간 피처로 확장할 때 고려<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>Great Expectations<\/td><td>데이터 품질 검사 규칙을 선언해 검증<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>늦게 도착하는 데이터. 5분 파티션이 늦게 올라오면 이미 집계한 시간이 틀어진다. 매시 실행 때 직전 몇 시간을 함께 다시 처리하는 창이 필요하다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>로깅 서버 재전송이나 클라이언트 재시도로 같은 이벤트가 두 번 들어올 수 있다. <code>event_id<\/code>로 지우지 않으면 클릭 수와 CTR이 부풀려진다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>스캔 비용. 매일 30일 창을 새로 계산하면 읽는 양이 계속 커진다. 하루 집계를 쌓아 두고 더하는 방식으로 줄인다(<span class=\"task\">#22<\/span>).<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>GCS → BigQuery 적재 방식. load job으로 복사할지, 외부 테이블로 바로 읽을지 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>SQL을 Airflow에 직접 둘지 dbt로 관리할지 정한다. dbt는 테스트와 문서가 편하지만 배울 것이 늘어난다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>봇·이상 행동 기준과 처리 위치. 수집 단계에서 막을지, 정제 단계에서 표시만 할지 세호 님과 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>로컬 compose의 폴더형 GCS와 실제 GCS는 경로와 권한 방식이 다르다. 저장소 접근 부분을 한 곳에 모아 두어야 옮길 때 덜 고친다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s4b\">\n  <h2><span class=\"step\">STEP 4+<\/span>실시간 수집으로 넓힐 때: Pub/Sub<\/h2>\n  <p>MVP 수집 경로는 로깅 서버 → GCS 5분 파티션이다(<span class=\"task\">#9<\/span>). WBS 문서도 Pub/Sub을 확장 항목으로 일부러 뺐다. 배치 피처만 쓰는 동안은 이것으로 충분하다. Pub/Sub이 필요해지는 때는 \"최근 클릭 5개\" 같은 피처를 분 단위 이하로 갱신하기로 했을 때다.<\/p>\n  <div class=\"chain\" aria-label=\"지금 경로\">\n    <div class=\"node\"><b>지금 (MVP)<\/b><span>배치 피처<\/span><\/div><span class=\"arr\">:<\/span>\n    <div class=\"node\"><b>로깅 서버<\/b><span>이벤트 받음<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node\"><b>GCS<\/b><span>5분 파티션<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node main\"><b>피처 DAG<\/b><span>매시·매일<\/span><\/div>\n  <\/div>\n  <div class=\"chain\" aria-label=\"확장 경로\">\n    <div class=\"node\"><b>확장<\/b><span>실시간 피처<\/span><\/div><span class=\"arr\">:<\/span>\n    <div class=\"node\"><b>로깅 서버<\/b><span>publish<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node\"><b>Pub/Sub 토픽<\/b><span>user-events<\/span><\/div><span class=\"arr\">→<\/span>\n    <div class=\"node\"><b>구독 ①<\/b><span>GCS 원본 보관<\/span><\/div>\n    <div class=\"node main\"><b>구독 ②<\/b><span>실시간 피처 갱신<\/span><\/div>\n  <\/div>\n  <h3>Pub/Sub이 하는 일<\/h3>\n  <p>GCP가 운영하는 메시지 중개 서비스다. 보내는 쪽(Publisher, 여기서는 로깅 서버)이 토픽에 메시지를 올린다. 받는 쪽(Subscriber)은 그 토픽에 붙인 구독에서 메시지를 받아 처리한 뒤 ack(처리 완료 응답)를 보낸다. 받는 방식은 Subscriber가 가져가는 Pull과 Pub/Sub이 HTTP로 보내 주는 Push 두 가지다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>필요한 이유<\/th><th>무슨 뜻인가<\/th><th>우리 경우<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>보내는 쪽이 기다리지 않음<\/td><td>로깅 서버는 토픽에 올리기만 하고 바로 다음 요청을 받는다. 저장이 끝날 때까지 기다리지 않는다<\/td><td>피드 응답이 저장 속도에 묶이지 않는다<\/td><\/tr>\n      <tr><td>몰려도 버팀<\/td><td>클릭이 한꺼번에 쏟아져도 토픽에 쌓아 두고 받는 쪽이 자기 속도로 처리한다<\/td><td>가상 독자를 대량으로 돌릴 때 유용하다<\/td><\/tr>\n      <tr><td>받는 쪽이 멈춰도 안 사라짐<\/td><td>ack를 받기 전까지 Pub/Sub이 메시지를 보관하고 다시 보낸다<\/td><td>저장 프로그램을 재시작해도 이벤트가 빠지지 않는다<\/td><\/tr>\n      <tr><td>여러 곳이 각자 받음<\/td><td>구독마다 메시지 사본을 하나씩 받는다<\/td><td>원본 보관과 실시간 피처 갱신을 따로 붙이고, 로깅 서버는 고치지 않는다<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>Pub/Sub은 \"최소 한 번 전달\"이다. ack가 정해진 시간(기본 10초) 안에 오지 않으면 같은 메시지를 다시 보내서 중복이 생긴다. 지금 clean 단계의 <code>event_id<\/code> 중복 제거를 그대로 쓴다. <code>event_id<\/code>는 클릭 순간에 만들어야 하고, Pub/Sub의 <code>message_id<\/code>로 대신하면 안 된다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>메시지 순서는 보장되지 않는다. 도착 순서가 아니라 <code>event_time<\/code>으로 정렬한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>도입 시점. 배치 \"최근 클릭 5개\"와 실시간 버전을 비교해 CTR 차이가 확인될 때만 붙이는 것을 제안한다. 비용과 운영 부담이 늘어나기 때문이다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>수집 경로를 바꾸면 누락·지연을 다시 검증해야 한다. 가상 독자가 보낸 이벤트 목록과 BigQuery에 도착한 목록을 대조해 누락 수, 중복 수, 도착 지연을 잰다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s5\">\n  <h2><span class=\"step\">STEP 5<\/span>학습 데이터 확보 <span class=\"task\">#19<\/span><\/h2>\n  <p>실제 독자가 없으므로 세 가지 출처를 역할을 나눠 쓴다. 가상 독자 생성(<span class=\"task\">#10<\/span> <span class=\"task\">#17<\/span>)은 R&amp;R 논의 중이다. 모델 쪽에서는 필요한 양과 형식을 요청한다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>출처<\/th><th>설명<\/th><th>역할<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>가상 독자 시뮬레이터<\/td><td>페르소나별 접속 시간과 카테고리 클릭 확률로 노출·클릭 기록 생성. 프로토타입 <code>virtual_reader/simulate.py<\/code><\/td><td>과거 기록 학습 데이터, 정답 대조<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td><a href=\"https://msnews.github.io/\">MIND<\/a> (Microsoft News)<\/td><td>실제 사용자 노출·클릭 로그. MIND-small은 사용자 5만 명<\/td><td>학습·평가 코드 점검, 논문 기준선과 비교<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>페르소나 에이전트<\/td><td>LLM 에이전트가 실제 화면을 보고 클릭<\/td><td>데모, 수집 경로 점검<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>최소 데이터 양과 기간(<span class=\"task\">#19<\/span>). 데이터를 10%, 30%, 100%로 늘려 학습해 보고, 성능이 더 오르지 않는 지점을 최소량으로 잡는 방법을 제안한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>가상 독자의 클릭 확률은 우리가 정한 공식이다. 모델은 그 공식을 다시 배우는 것이라, 잘 맞혀도 \"연결이 제대로 됐다\"는 증거일 뿐이다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>피드백 루프를 돌리면 모델이 보여 준 기사에만 클릭 기록이 쌓인다. 노출 편향이 생기므로 일정 비율은 무작위나 baseline 추천을 섞어야 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>MIND는 영어 기사이고 연구 목적 라이선스다. 코드 점검과 비교에만 쓰고 서비스 화면에는 쓰지 않는다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s6\">\n  <h2><span class=\"step\">STEP 6<\/span>학습 데이터 구성<\/h2>\n  <ol>\n    <li><b>한 행 = 노출 한 건.<\/b> 같은 세션에서 클릭이 따랐으면 1, 아니면 0이다.<\/li>\n    <li><b>시점 기준 피처.<\/b> 노출 시각 이전 데이터로만 피처를 만든다. 10월 15일 09시 노출에는 <code>feature_date = 10월 14일<\/code> 스냅샷을 붙인다.<\/li>\n    <li><b>시간으로 나눠 평가.<\/b> 무작위로 섞지 않는다. 앞 구간은 학습, 다음 구간은 검증, 마지막 구간은 테스트에 쓴다.<\/li>\n    <li><b>빼는 데이터.<\/b> 페르소나 컬럼은 학습에 넣지 않는다. 정제 단계에서 봇으로 표시된 사용자도 빼고, 몇 명을 뺐는지 기록한다.<\/li>\n  <\/ol>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>데이터 누수. 노출 이후의 클릭이 피처에 섞이면 학습 성능은 높게 나오지만 서비스에서는 맞지 않는다. 조인 날짜 규칙을 테스트로 고정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>라벨 기준. 체류 시간이 아주 짧은 클릭을 0으로 볼지 실험으로 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>클래스 불균형. CTR이 낮으면 0이 1보다 훨씬 많다. 음성 샘플링 비율과 확률 보정 방법이 필요하다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>위치 편향. 위에 있어서 눌린 효과를 빼야 기사 자체의 매력을 배운다. 학습 때 위치를 피처로 넣고 서빙 때 1번 자리로 고정하는 방법을 쓰지만 효과는 실험해 봐야 안다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s7\">\n  <h2><span class=\"step\">STEP 7<\/span>후보 생성<\/h2>\n  <p>전체 기사 중 10~20개로 좁히는 단계다. 여러 방법의 결과를 합쳐서 쓴다. 한 가지만 쓰면 놓치는 기사가 생기기 때문이다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>방법<\/th><th>설명<\/th><th>장점<\/th><th>한계<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>최신순·인기순<\/td><td>최근 발행 순, 최근 1시간 클릭 순<\/td><td>바로 구현된다, 신규 사용자에게 쓸 수 있다<\/td><td>개인화가 없다<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>카테고리 선호 규칙<\/td><td>사용자가 많이 본 카테고리의 최신 기사<\/td><td>단순하고 설명이 쉽다<\/td><td>같은 카테고리 안에서는 구분하지 못한다<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>임베딩 유사도 검색<\/td><td>사용자 임베딩과 가까운 기사 임베딩 찾기 (FAISS, ScaNN, Vertex AI Vector Search)<\/td><td>새 기사도 바로 후보가 된다<\/td><td>임베딩 품질에 좌우된다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>Item-based CF<\/td><td>함께 클릭된 기사끼리 묶기<\/td><td>내용을 몰라도 된다<\/td><td>클릭이 쌓이기 전 새 기사는 못 다룬다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>ALS 행렬 분해<\/td><td>사용자×기사 클릭 행렬을 두 벡터로 분해<\/td><td>추천 기본 모델로 널리 쓰인다<\/td><td>학습 뒤 나온 기사에는 벡터가 없다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>Two-tower<\/td><td>사용자 타워와 기사 타워 신경망을 학습해 같은 공간에 놓기 (YouTube DNN 계열)<\/td><td>대규모 후보 검색의 표준 구조<\/td><td>학습 데이터와 GPU가 더 필요하다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>GRU4Rec, SASRec<\/td><td>클릭 순서를 보고 다음 클릭을 예측하는 세션 모델<\/td><td>단기 관심을 잘 잡는다<\/td><td>세션 데이터가 충분해야 한다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>새 기사 콜드 스타트. 뉴스는 몇 시간 안에 가치가 떨어진다. 클릭 기반 방법(CF, ALS)은 새 기사를 다루지 못하므로 내용 기반 방법이 필요하다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>신규·익명 사용자 콜드 스타트. 클릭 기록이 없으면 인기순으로 대체한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>방법별로 후보를 몇 개씩 가져와 합칠지 정해야 한다. 후보가 10~20개뿐이라 이 비율이 결과를 크게 바꾼다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s8\">\n  <h2><span class=\"step\">STEP 8<\/span>baseline과 CTR 모델 <span class=\"task\">#13<\/span><\/h2>\n  <p>먼저 인기순 baseline으로 피드를 띄우고(중간발표 <span class=\"task\">#25<\/span>), 그 다음 CTR 모델로 바꾼다. 1차 CTR 모델은 LightGBM이다. 표 형태 피처에 강하고 학습이 몇 분 안에 끝나며, 피처 중요도와 SHAP으로 설명하기 쉽다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>모델<\/th><th>설명<\/th><th>장점<\/th><th>한계<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>인기순 baseline<\/td><td>최근 1시간 CTR이나 클릭 수 순서<\/td><td>피처 DAG 하나로 바로 된다<\/td><td>모두에게 같은 목록<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>로지스틱 회귀<\/td><td>피처의 가중합으로 확률 계산<\/td><td>가장 설명이 쉽다<\/td><td>피처 사이의 상호작용을 못 잡는다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>LightGBM<\/td><td>결정 트리를 순서대로 쌓는 GBDT. binary 또는 LambdaRank 목적 함수<\/td><td>빠르고 정확, SHAP 설명<\/td><td>텍스트는 임베딩 피처로 바꿔 넣어야 한다<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>XGBoost, CatBoost<\/td><td>다른 GBDT 구현. CatBoost는 범주형 피처 처리가 강하다<\/td><td>LightGBM과 바로 비교 가능<\/td><td>차이가 크지 않을 수 있다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>FM, FFM<\/td><td>피처 쌍의 상호작용을 벡터 내적으로 학습<\/td><td>희소한 범주형 피처에 강하다<\/td><td>구현과 튜닝이 GBDT보다 번거롭다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>Wide &amp; Deep, DeepFM, DCN v2<\/td><td>기억(wide)과 일반화(deep)를 합친 CTR 예측 신경망<\/td><td>산업 CTR 예측의 표준 구조<\/td><td>데이터가 적으면 GBDT보다 못할 수 있다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>DIN<\/td><td>후보 기사와 비슷한 과거 클릭에 가중치를 주는 attention 모델<\/td><td>관심사가 여럿인 사용자에 강하다<\/td><td>구현 난이도가 높다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>DKN<\/td><td>제목의 단어 벡터와 지식 그래프 엔티티 벡터를 함께 쓰는 뉴스 모델<\/td><td>엔티티 연결을 활용한다<\/td><td>영어 Wikidata 기반이라 한국어에 그대로 쓰기 어렵다<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n      <tr><td>NPA, NAML, LSTUR<\/td><td>사용자별 attention, 카테고리·본문 결합, 장·단기 관심 분리<\/td><td>MIND에서 검증된 뉴스 모델<\/td><td>제목 인코더 학습에 GPU가 필요하다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>NRMS<\/td><td>제목 단어끼리, 기사끼리 self-attention으로 기사·사용자 벡터를 만든다<\/td><td>MIND 대표 기준선, 구조가 단순하다<\/td><td>GBDT 피처와 함께 쓰려면 구조 설계가 필요하다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>PLM 기반 뉴스 인코더<\/td><td>제목 인코더를 BERT 계열 사전학습 모델로 교체<\/td><td>MIND 성능이 가장 높은 계열<\/td><td>학습·추론 비용이 크다<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n      <tr><td>LLM 재랭킹<\/td><td>LLM에 사용자 이력과 후보 목록을 주고 순서를 받는다<\/td><td>데모 효과가 크고 이유 설명을 받을 수 있다<\/td><td>호출당 비용과 지연, 결과가 매번 달라질 수 있다<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>목적 함수. 클릭 여부를 맞히는 binary로 할지, 노출 목록 안의 순서를 맞추는 LambdaRank로 할지 비교해서 고른다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>딥러닝 모델은 합성 데이터 규모로 충분히 학습되는지 모른다. MIND-small에서 먼저 돌려 보고 GBDT와 차이가 있을 때만 가져온다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>GPU 비용. 뉴스 전용 딥러닝 모델을 학습하려면 GPU가 필요하다. 크레딧 범위 안에서 가능한지 장주현 님과 확인한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>모델 고르기에 시간을 많이 쓰지 말라는 멘토 조언이 있었다. 비교군은 같은 학습 데이터로 한 번씩만 돌리고 피처 개선에 시간을 더 쓴다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s9\">\n  <h2><span class=\"step\">STEP 9<\/span>후처리 · 탐색<\/h2>\n  <p>점수 순서를 그대로 보여 주지 않고 규칙으로 다듬는다. 같은 주제만 연달아 나오거나 이미 본 기사가 다시 나오는 것을 막는다.<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>방법<\/th><th>설명<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>규칙 기반<\/td><td>이미 클릭한 기사 제거, 같은 카테고리 연속 3개 이하, 최신 기사 1개 이상<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>MMR<\/td><td>점수가 높으면서 이미 고른 기사와 덜 비슷한 기사를 하나씩 고른다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>DPP<\/td><td>목록 전체의 다양성을 확률 모델로 계산해 고른다<\/td><td><span class=\"tag hold\">보류<\/span><\/td><\/tr>\n      <tr><td>ε-greedy<\/td><td>일정 비율 자리에 무작위 기사를 넣어 새 관심을 탐색한다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n      <tr><td>Thompson sampling, LinUCB<\/td><td>불확실한 기사를 더 자주 시험해 보는 밴딧. LinUCB는 Yahoo! 뉴스 추천 연구에서 나왔다<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>다양성과 CTR은 서로 맞바꾸는 관계다. 다양성을 얼마나 줄지, 어떤 지표로 볼지 정해야 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>탐색 비율. 노출 편향을 줄이려면 일부 자리는 탐색에 써야 하지만, 그만큼 당장의 CTR은 떨어진다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s10\">\n  <h2><span class=\"step\">STEP 10<\/span>평가 · 검증 <span class=\"task\">#13<\/span> <span class=\"task\">#23<\/span><\/h2>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>단계<\/th><th>무엇을<\/th><th>통과 기준<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>코드 점검<\/td><td>MIND-small로 학습·평가 코드를 먼저 돌린다 (<a href=\"https://github.com/recommenders-team/recommenders\">recommenders<\/a> 라이브러리 예제와 비교)<\/td><td>AUC가 MIND 논문 기준선과 비슷한 범위<\/td><\/tr>\n      <tr><td>baseline 비교<\/td><td>인기순, 최신순, 카테고리 선호 규칙과 비교<\/td><td>테스트 구간 CTR·AUC가 baseline보다 높음, 이후 nDCG@K 추가<\/td><\/tr>\n      <tr><td>정답 대조<\/td><td>페르소나별로 추천된 카테고리 비율을 페르소나 카드와 비교<\/td><td>예: 직장인 그룹 추천에서 경제 비율이 가장 높음<\/td><\/tr>\n      <tr><td>설명<\/td><td>피처 중요도와 SHAP으로 모델이 무엇을 보고 고르는지 확인<\/td><td>상위 피처가 설계 의도(관심·유사도·신선도)와 맞음<\/td><\/tr>\n      <tr><td>피드백 실험<\/td><td>가상 독자를 두 그룹으로 나눠 모델과 baseline을 따로 보여 줌<\/td><td>모델 그룹 CTR이 더 높음<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <p>결과는 BigQuery 위 대시보드에서 <code>model_version<\/code>별, 페르소나별, 위치별 CTR로 본다. 실험 기록은 MLflow 또는 Vertex AI Experiments로 남긴다.<\/p>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>오프라인 지표가 올라도 온라인 CTR이 함께 오르지 않을 수 있다. 두 숫자를 같이 보여 줘야 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>기록된 로그로 하는 평가는 이전 모델이 보여 준 기사만 평가할 수 있다. 새 모델이 다른 기사를 고르면 정답이 없어 정확한 비교가 어렵다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>A/B 그룹을 나누는 방식. <code>user_id<\/code> 해시로 고정할지, 실험 기간과 그룹 비율을 어떻게 할지 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>실험 기록 도구로 MLflow를 쓸지 Vertex AI Experiments를 쓸지 정한다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s11\">\n  <h2><span class=\"step\">STEP 11<\/span>서빙 연결 <span class=\"task\">#14<\/span> <span class=\"task\">#20<\/span><\/h2>\n  <p>WBS 문서의 추천대로 1차는 <b>요청 시 점수화<\/b>다(Q3). 뉴스 WAS와 추론 서버는 따로 두고 HTTP로 주고받는다(Q4). 추론 서버 담당은 \"윤모 주담당, 인프라 작업 후 장주현 합류\"가 추천안이며 팀 확정 전이다(Q2).<\/p>\n  <div class=\"tbl\"><table>\n    <thead><tr><th><\/th><th>요청 시 점수화 <span class=\"tag pick\">1차 선택<\/span><\/th><th>미리 계산해 저장 <span class=\"tag ext\">확장<\/span><\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>동작<\/td><td>독자가 피드를 열면 뉴스 WAS가 후보 10~20개를 추론 서버에 보냄 → 추론 서버가 메모리에 올려 둔 피처 파일과 모델로 점수 → 순서대로 응답<\/td><td>배치가 사용자별 추천 목록을 미리 계산해 저장 → 뉴스 WAS가 <code>user_id<\/code>로 꺼냄 (Redis 필요)<\/td><\/tr>\n      <tr><td>장점<\/td><td>구조가 단순하다, 후보가 적어 지연이 작다, 새 기사가 후보에 바로 들어간다<\/td><td>응답이 가장 빠르다<\/td><\/tr>\n      <tr><td>단점<\/td><td>피처는 배치 주기만큼 늦다, 추론 서버가 떠 있어야 한다<\/td><td>저장소와 배치가 더 필요하다, 접속하지 않는 사용자 몫도 계산한다<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <h3>서빙 런타임 후보<\/h3>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>방법<\/th><th>설명<\/th><th>판단<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>LightGBM 네이티브<\/td><td>학습한 모델 파일을 파이썬에서 그대로 불러 예측<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>ONNX Runtime, Treelite<\/td><td>모델을 표준 형식이나 컴파일된 코드로 바꿔 학습 도구와 분리<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>GKE + FastAPI<\/td><td>직접 만든 추론 서버를 Helm으로 배포 (<span class=\"task\">#2<\/span>)<\/td><td><span class=\"tag pick\">1차 선택<\/span><\/td><\/tr>\n      <tr><td>Vertex AI Endpoints<\/td><td>GCP가 관리하는 모델 서빙. 서버 관리가 적다<\/td><td><span class=\"tag cmp\">비교군<\/span><\/td><\/tr>\n      <tr><td>KServe, Triton, TorchServe<\/td><td>모델 서빙 전용 서버. 딥러닝 모델일 때 고려<\/td><td><span class=\"tag ext\">확장<\/span><\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <p>모델 파일은 GCS에 버전별 폴더로 올린다. 응답에는 <code>request_id<\/code>와 <code>model_version<\/code>을 실어 노출 이벤트로 돌아오게 한다.<\/p>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>요청 시 점수화(<span class=\"task\">#20<\/span>)와 추론 서버 담당(<span class=\"task\">#14<\/span>)은 추천안이다. 팀 확정이 필요하고, \"후보 10~20개 요청 시 점수화로 충분한가\"를 10/31에 멘토님께 한 줄 확인한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>뉴스 WAS ↔ 추론 서버 요청·응답 형식(후보 목록, <code>user_id<\/code>, 점수, <code>request_id<\/code>, <code>model_version<\/code>)을 계약으로 먼저 정해야 둘이 따로 개발할 수 있다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>피처 파일을 다시 불러오는 시점에 서버가 잠깐 멈추거나 옛 피처를 쓸 수 있다. 새 파일을 다 읽은 뒤에 교체하는 방식으로 만든다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>학습 도구와 서빙 런타임이 다를 때 어떤 패키징이 적절한지 멘토님 의견을 듣는다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s12\">\n  <h2><span class=\"step\">STEP 12<\/span>운영 · 통합 테스트 <span class=\"task\">#22<\/span> <span class=\"task\">#28<\/span><\/h2>\n  <ul>\n    <li><b>재학습<\/b>: Airflow가 학습 데이터를 다시 만들고 모델을 학습한다. 검증 기준을 통과한 모델만 새 <code>model_version<\/code>으로 바꾼다.<\/li>\n    <li><b>모니터링<\/b>: 층별 행 수와 중복 비율, 피처 분포 변화, 모델 버전별 CTR, BigQuery 스캔량을 본다.<\/li>\n    <li><b>통합 테스트(<span class=\"task\">#28<\/span>)<\/b>: 클릭 → 원본 → 배치 → 피처 → 서빙 중 \"원본 → 배치 → 피처\" 구간을 이 파트가 맡는다. 가상 독자 클릭 한 건이 피처 테이블과 서빙용 피처 파일까지 도착하는지 확인하는 테스트를 만든다.<\/li>\n  <\/ul>\n  <div class=\"flags\">\n    <div class=\"flag\"><span class=\"tag decide\">결정 필요<\/span><p>재학습 주기. 매일로 할지, 성능이 떨어질 때만 할지 정한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>새 모델이 더 나쁠 때 되돌릴 방법이 필요하다. 이전 버전 파일을 남겨 두고 버전 값만 바꾸면 되돌릴 수 있게 한다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag risk\">예상 문제<\/span><p>계정 교체(<span class=\"task\">#24<\/span>) 때 프로젝트 ID와 버킷 이름이 바뀐다. DAG와 SQL에 이름을 직접 쓰지 않고 설정값으로 빼 둔다.<\/p><\/div>\n    <div class=\"flag\"><span class=\"tag unsure\">불확실·어려움<\/span><p>합성 데이터는 분포가 거의 바뀌지 않아 드리프트 감지를 시연하기 어렵다. 가상 독자 페르소나 비율을 중간에 바꾸는 실험이 필요하다.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s13\">\n  <h2><span class=\"step\">STEP 13<\/span>멘토님께 드릴 질문<\/h2>\n  <ol>\n    <li>후보 10~20개를 점수화하는 구조에서, 후보 생성과 점수화 모델 중 어디에 더 힘을 주는 것이 좋을까요?<\/li>\n    <li>Memorystore(Redis)를 MVP에서 빼고, 배치 피처를 파일로 내보내 추론 서버가 불러 쓰는 방식으로 시작해도 될까요? (WBS Q8)<\/li>\n    <li>피처 DAG의 SQL을 Airflow에 직접 둘지 dbt로 관리할지, 현업에서는 어떻게 판단하나요?<\/li>\n    <li>클릭 확률을 우리가 정한 합성 데이터에서 나온 성능 숫자는 발표에서 어떻게 해석해야 할까요?<\/li>\n    <li>학습 도구와 서빙 런타임이 다를 때 권하시는 패키징 방식이 있을까요?<\/li>\n    <li>노출 편향을 줄이기 위한 탐색(무작위 노출)을 프로젝트 범위에 넣는 것이 좋을까요?<\/li>\n  <\/ol>\n<\/section>\n\n<section id=\"index\">\n  <h2>표시 모아보기<\/h2>\n  <p>위 단계에 흩어진 표시를 종류별로 모았다. 항목을 누르면 해당 단계로 이동한다.<\/p>\n  <div id=\"index-body\"><\/div>\n<\/section>\n<\/div>\n\n<script>\nvar TASKS = {\"1\": \"GCP 계정·프로젝트, Terraform\", \"2\": \"Helm: Airflow, 로깅 서버, Redis/Valkey, 추론 서버\", \"3\": \"배포 파이프라인, 계정 교체 절차\", \"4\": \"기사 메타데이터 스키마\", \"5\": \"LLM 기사 생성·에이전트 검수\", \"6\": \"뉴스 DB, 뉴스 WAS API\", \"7\": \"피드·상세 화면, 노출 정보 결정\", \"8\": \"수집할 행동 정의, 익명 사용자 처리\", \"9\": \"이벤트 스키마, 로깅 서버, GCS 5분 파티션\", \"10\": \"가상 독자\", \"11\": \"피처 목록과 필요한 이벤트 거꾸로 확인\", \"12\": \"정제·집계·피처 DAG\", \"13\": \"baseline(인기순), CTR 모델, 평가\", \"14\": \"추론 서버(후보 10~20개 점수화), 피드 연결\", \"15\": \"청사진, DB 형식·피처 공유 방식 합의, WBS\", \"16\": \"로컬 개발 환경 compose 베이스\", \"17\": \"페르소나 정의, 시뮬레이션 규칙\", \"18\": \"기사 세부 태그\", \"19\": \"학습용 최소 데이터 확보\", \"20\": \"추천 결과 전달 방식 결정\", \"21\": \"CI/CD·GitOps, Secret·IAM\", \"22\": \"모니터링 최소, 비용·스캔량(파티션 설계)\", \"23\": \"평가 지표 정의\", \"24\": \"계정 교체 리허설\", \"25\": \"중간발표 자료 (11/19 예정)\", \"26\": \"최종 발표·데모 영상 (12/17 예정)\", \"27\": \"상호 리뷰·설명 연습\", \"28\": \"통합 테스트\"};\n(function () {\n  document.querySelectorAll(\"span.task\").forEach(function (s) {\n    var m = s.textContent.match(/^#(\\d+)$/);\n    if (!m) return;\n    var name = TASKS[m[1]];\n    if (!name) return;\n    var a = document.createElement(\"a\");\n    a.className = \"task\"; a.href = \"wbs.html#t\" + m[1]; a.textContent = s.textContent;\n    a.title = name;\n    s.replaceWith(a);\n  });\n})();\n(function () {\n  var kinds = [[\"decide\", \"결정 필요\"], [\"risk\", \"예상 문제\"], [\"unsure\", \"불확실·어려움\"]];\n  var body = document.getElementById(\"index-body\");\n  var counts = [];\n  kinds.forEach(function (k) {\n    var items = document.querySelectorAll(\"section:not(#index) .flag .tag.\" + k[0]);\n    counts.push(k[1] + \" \" + items.length);\n    var g = document.createElement(\"div\"); g.className = \"group\";\n    var h = document.createElement(\"h3\"); h.innerHTML = '<span class=\"tag ' + k[0] + '\">' + k[1] + '<\/span> ' + items.length + '개';\n    var ol = document.createElement(\"ol\");\n    items.forEach(function (t) {\n      var sec = t.closest(\"section\");\n      var step = sec.querySelector(\".step\");\n      var title = sec.querySelector(\"h2\").childNodes;\n      var name = \"\";\n      title.forEach(function (n) { if (n.nodeType === 3) name += n.textContent; });\n      var li = document.createElement(\"li\");\n      var a = document.createElement(\"a\"); a.href = \"#\" + sec.id;\n      a.textContent = t.nextElementSibling.textContent;\n      var s = document.createElement(\"span\"); s.className = \"src\"; s.textContent = \"  · \" + (step ? step.textContent + \" \" : \"\") + name.trim();\n      li.appendChild(a); li.appendChild(s); ol.appendChild(li);\n    });\n    g.appendChild(h); g.appendChild(ol); body.appendChild(g);\n  });\n  document.getElementById(\"counts\").textContent = counts.join(\" · \");\n})();\n<\/script>\n\n<\/body>\n<\/html>\n", "juhyun": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>청사진 및 인프라<\/title>\n<style>\n:root{--bg:#fff;--fg:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--code:#f3f4f6;--a:#2563eb;--card:#fafafa;--ment:#7c3aed;--mentbg:#f5f3ff;--accent:#2563eb}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f172a;--fg:#e5e7eb;--mu:#94a3b8;--bd:#334155;--code:#1e293b;--a:#93c5fd;--card:#111827;--mentbg:#1e1b4b;--accent:#93c5fd;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f172a;--fg:#e5e7eb;--mu:#94a3b8;--bd:#334155;--code:#1e293b;--a:#93c5fd;--card:#111827;--mentbg:#1e1b4b;--accent:#93c5fd;color-scheme:dark}\nbody{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}\n.top{max-width:1180px;margin:0 auto;padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.top nav{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}\n.top a{color:var(--accent);text-decoration:none}\n.top .src{font-size:13px;color:var(--mu);margin:8px 0 0}\n.parts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}\n.parts a{border:1px solid var(--bd);border-radius:999px;padding:4px 14px;font-size:14px}\n.partlabel{max-width:1180px;margin:40px auto 0;padding:0 16px;font-size:12px;letter-spacing:.06em;color:var(--mu)}\n#fig{max-width:1180px;margin:0 auto;padding:8px 16px}\n#fig img{width:100%;height:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}\n#bp{background:var(--bg);color:var(--fg);font:16px/1.7 'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}\n#bp{max-width:980px;margin:0 auto;padding:24px 16px 80px}\n#bp h1{font-size:28px}\n#bp h2{margin-top:2em;border-bottom:2px solid var(--bd);padding-bottom:4px}\n#bp h3{margin-top:1.6em}\n#bp a{color:var(--a)}\n#bp code{background:var(--code);padding:1px 6px;border-radius:5px;font-size:.92em}\n#bp pre{background:#0f172a;color:#e2e8f0;padding:12px 16px;border-radius:10px;overflow:auto}\n#bp pre code{background:none;color:inherit}\n#bp .tw{overflow-x:auto}\n#bp table{border-collapse:collapse;margin:10px 0;font-size:14.5px}\n#bp th,#bp td{border:1px solid var(--bd);padding:6px 10px;vertical-align:top}\n#bp th{background:var(--code)}\n#bp figure{margin:14px 0;overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}\n#bp figure svg{display:block;max-width:100%;height:auto}\n#bp figcaption{padding:4px 12px;font-size:13px;color:#6b7280}\n#bp hr{border:0;border-top:1px solid var(--bd)}\n#bp li{margin:2px 0}\n#bp blockquote{margin:8px 0;padding:4px 14px;border-left:4px solid var(--bd);color:var(--mu)}\n#cat{background:var(--bg);color:var(--fg);font:15px/1.6 'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}\n#cat{max-width:1180px;margin:0 auto;padding:24px 16px 80px}\n#cat h1{margin:.2em 0}\n#cat h2{margin:1.8em 0 .1em;border-bottom:2px solid var(--bd);padding-bottom:4px}\n#cat .sub{color:var(--mu);margin:.2em 0 .8em}\n#cat .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n#cat .bar button,#cat .bar input{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer}\n#cat .bar button.on{background:#1e293b;color:#fff;border-color:#1e293b}\n#cat .bar input{min-width:200px;cursor:text}\n#cat .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}\n#cat .card{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:12px 14px}\n#cat .card.ment{border-color:var(--ment);background:var(--mentbg)}\n#cat .card h3{margin:0 0 6px;font-size:16px}\n#cat .star{color:var(--ment)}\n#cat .new{background:#dc2626;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;vertical-align:middle}\n#cat .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:6px}\n#cat .meta span{border-radius:999px;padding:1px 9px;border:1px solid var(--bd)}\n#cat .t0{background:#16a34a;color:#fff}\n#cat .t1{background:#0284c7;color:#fff}\n#cat .t2{background:#d97706;color:#fff}\n#cat .t3{background:#94a3b8;color:#fff}\n#cat .mg{border-color:#7c3aed!important}\n#cat dl{margin:0}\n#cat dt{font-weight:700;font-size:12px;color:var(--mu);margin-top:6px}\n#cat dd{margin:0;font-size:14px}\n#cat table.cnt{border-collapse:collapse;margin:8px 0}\n#cat .cnt th,#cat .cnt td{border:1px solid var(--bd);padding:4px 12px;text-align:center}\n#cat .box{border:1px solid var(--bd);border-radius:12px;padding:6px 16px;background:var(--card)}\n#cat img.fig{max-width:100%;border:1px solid var(--bd);border-radius:12px;background:#fff}\n#cat blockquote{margin:8px 0;padding:4px 14px;border-left:4px solid var(--bd);color:var(--mu)}\n<\/style>\n<\/head>\n<body>\n<div class=\"top\">\n  <nav><a href=\"index.html\">← 공동 청사진 대문<\/a><a href=\"wbs.html\">작업 나열표<\/a><\/nav>\n  <p class=\"src\">작성: 장주현 · Notion 「청사진 및 인프라_20261030」에 올린 파일 4개(청사진_정리.html, 인프라_구성도_멘토기준_v2.png, 인프라_툴_카탈로그_멘토기준_v2.html·.md)를 한 페이지로 합쳤다. 내용은 바꾸지 않았다.<\/p>\n  <div class=\"parts\"><a href=\"#bp\">1부 청사진 정리<\/a><a href=\"#fig\">2부 인프라 구성도<\/a><a href=\"#cat\">3부 인프라 툴 카탈로그<\/a><\/div>\n<\/div>\n<div class=\"partlabel\">1부<\/div>\n<div id=\"bp\">\n<h1>청사진 정리 (10/28 멘토 요청 → 10/30 13시 발표 대비)<\/h1>\n<p>이 파일은 <b>청사진 한 주제만<\/b> 담는다. 다른 주제(역할, 인프라 비교, 발표 피드백 등)는 각자의 파일에 있다.<\/p>\n<p>작성: 2026-10-30 / 대상: 장주현 / 근거 표기: <b>[멘토]<\/b> 10/28 Gemini 스크립트·회의록, <b>[팀]<\/b> 10/29 팀 회의 메모, <b>[제안]<\/b> 제가 제안한 것(확정 아님), <b>[일반]<\/b> 일반 지식(이 프로젝트에서 확인한 것 아님).<\/p>\n<hr>\n<h2>0. 급할 때 이것만 (30초)<\/h2>\n<ol>\n<li><b>청사진 = 데이터가 한 바퀴 도는 큰 그림 한 장.<\/b> 화면 → 백엔드 → 수집 → 배치 → 피처 → (거꾸로) \"그럼 처음에 어떤 행동을 모아야 하나\". [멘토]\n<\/li><li><b>한 번에 깔끔하지 않아도 된다.<\/b> AI(에이전트)와 같이 정리해 오면 멘토가 해석해 준다. 금요일 팀이 합치고, 토요일 10시 멘토가 본다. [멘토]\n<\/li><li><b>인프라 초안은 멘토 숙제가 아니다.<\/b> 우리가 덧붙인 몫이다. 장주현은 \"그림의 각 상자가 <b>어디서 돌고 어디에 저장되나<\/b>\"를 얹은 <b>인프라 지도 1장<\/b>을 들고 간다. [제안]\n<\/li><li><b>인프라 지도 한 줄<\/b>: 화면(정적 파일) → 백엔드(Cloud Run 또는 GKE) → 로깅 서버 → GCS(5분 폴더) → Airflow(GKE)가 BigQuery에 정리 → 피처 → 추론 서버(GKE 별도) → 다시 화면. DB는 Cloud SQL, Redis는 용도 미정. 멘토 방침은 확정, 나머지는 제안.\n<\/li><li><b>발표 때 한마디<\/b>: \"저는 이 흐름의 각 상자가 어디에서 돌아가는지와, 11/5 전에 모두가 같은 환경에서 시작하도록 로컬 compose를 만드는 것을 맡습니다.\"\n<\/li><li><b>받을 것<\/b>: 태원에게 기사 컬럼, 세호에게 이벤트 필드와 하루 이벤트 수, 윤모에게 피처와 배치 주기.\n<\/li><li><b>그림으로 보려면<\/b>: 8절(질문 풀이)과 <a href=\"#bp\">1부 청사진 정리<\/a>. 인프라 지도는 <a href=\"#fig\">2부 인프라 구성도<\/a>.\n<\/li><\/ol>\n<hr>\n<h2>1. 멘토가 요청한 청사진 (6단계)<\/h2>\n<p><b>한 문장<\/b>: 화면에서 시작해 데이터가 모이고, 가공되고, 모델의 재료가 되고, 그 재료를 만들려면 처음에 무엇을 모아야 하는지 다시 거꾸로 돌아오는 <b>한 바퀴 그림<\/b>을 그려 오라. [멘토]<\/p>\n<p><b>비유<\/b>: 식당을 열기 전에 \"손님 입장 → 주문 → 주방 → 재료 구입 → 재고\"를 한 장으로 이은 흐름도다. 어떤 가스레인지를 살지는 그다음이다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>#<\/th><th>쉬운 말<\/th><th>멘토가 한 말(뜻)<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>화면 기능<\/td><td>피드가 열리면 백엔드에 요청 → 기사 id·썸네일 목록 → FE가 그림. 이미지는 GCS. 클릭하면 상세(작성일·수정일·에이전트 기자·본문·출처). 댓글은 안 만들어도 됨<\/td><td>스크립트 00:38~00:40, 회의록 4절 1번<\/td><\/tr><tr><td>2<\/td><td>유저 액션<\/td><td>클릭·드래그·이탈 중 무엇을 모을지, 다 모아야 하나, 어떻게 모으나. 브라우저 정보로 모으므로 FE 수집 스크립트 필요<\/td><td>스크립트 00:39~00:40, 회의록 4절 2번<\/td><\/tr><tr><td>3<\/td><td>수집 구조<\/td><td>로깅 서버로 던진다(멘토 의견: 따로 만드는 게 낫다). 어떤 자료 구조로 던질지 적기. GCS에 5분 단위 파티션<\/td><td>스크립트 00:40~00:41<\/td><\/tr><tr><td>4<\/td><td>유저 ID<\/td><td>회원가입 없이 쿠키에 FE 스크립트로 발급, 타임스탬프 포함<\/td><td>스크립트 00:41, 회의록 4절 4번<\/td><\/tr><tr><td>5<\/td><td>피처<\/td><td>클릭 모델 재료 목록(클릭한 기사와 유사한 임베딩 포함). 거꾸로 필요한 이벤트를 되짚기<\/td><td>스크립트 00:41~00:43<\/td><\/tr><tr><td>6<\/td><td>합치기<\/td><td>위를 따로가 아니라 한 판 큰 그림으로. 무작정 조립 금지. 에이전트와 같이 정리<\/td><td>스크립트 00:43, 회의록 4절 6번<\/td><\/tr><tr><td>진행<\/td><td>흐름<\/td><td>토 피드백 → 화 피드백 → 목요일쯤 완성 → 병렬 작업. 데이터가 모일 때까지 기다리지 않고 합성 데이터를 미리 떨궈 두고 파이프라인을 만든다<\/td><td>스크립트 00:44<\/td><\/tr><\/tbody><\/table><\/div>\n<p>※ 스크립트는 음성 인식이라 단어가 틀릴 수 있어 뜻만 옮겼다.<\/p>\n<hr>\n<h2>2. 내가 묻은 질문 풀이 (번호는 질문하신 순서)<\/h2>\n<h3>2-1. 멘토 청사진 부분<\/h3>\n<p><b>(2) 유저 액션을 클릭만 하면 MVP가 되나? 나중에 추가할 수 있나?<\/b><\/p>\n<ul>\n<li><b>된다. 단 \"클릭\"만으로는 모자라고 \"노출\"이 같이 필요하다.<\/b> [일반] CTR은 <code>클릭 수 ÷ 노출 수<\/code>다. 기사 10개를 보여줬는데 2개를 눌렀다면 CTR 20%인데, \"보여준 10개\"를 기록하지 않으면 분모를 모른다. 그래서 MVP 최소 이벤트는 <b>① 노출(피드에 이 기사가 보였다) ② 클릭<\/b> 두 가지가 안전하다. (태원은 \"행동 데이터는 클릭 기반\" [팀]이라고 했다. 노출을 포함한다는 뜻인지는 팀이 확인할 항목.)\n<\/li><li><b>나중에 추가 가능한가<\/b>: 가능하다. 이벤트에 <code>event_type<\/code> 칸을 두고(예: impression, click, dwell, like), 원본은 GCS에 <b>그대로<\/b> 쌓아 두면 새 이벤트가 생겨도 과거 데이터를 다시 처리할 수 있다. 처음부터 <code>schema_version<\/code> 칸도 넣어 두면 더 안전하다. [제안]\n<\/li><li><b>비유<\/b>: 설문조사에서 \"누른 사람 수\"만 세면 안 되고 \"설문을 본 사람 수\"도 세어야 비율이 나온다.\n<\/li><\/ul>\n<p><b>(2) FE 수집 스크립트는 어떤 게 있어?<\/b> [일반]<\/p>\n<div class=\"tw\"><table><thead><tr><th>방식<\/th><th>쉬운 설명<\/th><th>우리에게<\/th><\/tr><\/thead><tbody><tr><td>직접 작성한 JS<\/td><td>클릭하면 \"이 기사 클릭됨\"을 서버로 보내는 짧은 코드<\/td><td><b>추천.<\/b> AI가 생성하기 쉽고 로깅 서버와 직접 맞출 수 있다<\/td><\/tr><tr><td>노출 감지(<code>IntersectionObserver<\/code>)<\/td><td>기사 카드가 화면에 절반 이상 보이면 \"노출됨\"을 기록<\/td><td>노출 이벤트를 만들 때 쓴다<\/td><\/tr><tr><td>전송용 <code>sendBeacon<\/code><\/td><td>페이지를 닫는 순간에도 안전하게 전송<\/td><td>이탈·체류 시간 보낼 때 유용<\/td><\/tr><tr><td>외부 도구(Google Analytics, GTM, Snowplow 등)<\/td><td>이미 만들어진 수집 서비스<\/td><td>우리는 로깅 서버를 직접 만들 계획이라 MVP엔 과함<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>(3) 로깅 서버는 \"뉴스 피드 웹페이지에서 모은 유저 행동 로그를 관리하는 서버\"가 맞나?<\/b><\/p>\n<ul>\n<li><b>거의 맞다.<\/b> 정확히는 <b>브라우저가 보낸 행동 기록을 받아서 파일로 쌓아 두는 서버<\/b>다. \"관리\"라고 하면 분석까지 들리는데, 분석은 뒤의 배치(Airflow/BigQuery)가 한다. 로깅 서버는 <b>받아서 저장<\/b>까지만 한다.\n<\/li><li><b>비유<\/b>: 우체통과 서기. 편지를 받아 날짜별 상자에 넣을 뿐, 내용을 해석하지는 않는다.\n<\/li><\/ul>\n<p><b>(3) 로깅 서버에서 수집하는 로그 정보는 어떤 것들?<\/b> (제안, 확정 아님)<\/p>\n<div class=\"tw\"><table><thead><tr><th>칸<\/th><th>뜻<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><code>event_id<\/code><\/td><td>이벤트 1건의 고유번호(중복 제거용)<\/td><td><code>e-8f3a…<\/code><\/td><\/tr><tr><td><code>event_type<\/code><\/td><td>무슨 행동<\/td><td><code>impression<\/code>, <code>click<\/code><\/td><\/tr><tr><td><code>user_id<\/code><\/td><td>쿠키로 발급한 ID<\/td><td><code>u-4c21…<\/code><\/td><\/tr><tr><td><code>session_id<\/code><\/td><td>한 번 접속의 묶음<\/td><td><code>s-91…<\/code><\/td><\/tr><tr><td><code>article_id<\/code><\/td><td>어느 기사<\/td><td><code>a1<\/code><\/td><\/tr><tr><td><code>position<\/code><\/td><td>피드에서 몇 번째<\/td><td><code>3<\/code><\/td><\/tr><tr><td><code>recommendation_id<\/code><\/td><td>어떤 추천 묶음에서 나왔나<\/td><td><code>sample-reader-tech-…<\/code> (팀 프로토타입에 있는 <code>Recommendation.id<\/code> 개념)<\/td><\/tr><tr><td><code>timestamp<\/code><\/td><td>언제<\/td><td><code>2026-11-10T09:05:21+09:00<\/code><\/td><\/tr><tr><td><code>page<\/code> / <code>device<\/code><\/td><td>어디서, 어떤 기기<\/td><td><code>feed<\/code>, <code>mobile<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>(3) 로깅 서버를 \"따로 만든다\"는 무슨 뜻?<\/b><\/p>\n<ul>\n<li><b>뉴스 백엔드(기사를 내려주는 서버)와 별개 프로그램으로 둔다<\/b>는 뜻이다. 한 서버가 둘 다 하면 로그가 폭주할 때 기사 화면도 느려진다. 멘토는 \"제 생각에는 따로 만드는 게 나은 것 같다\"고 했고 \"백엔드가 쏴줘도 된다\"고도 열어 뒀다. [멘토]\n<\/li><li><b>비유<\/b>: 식당의 주문 받는 홀(백엔드)과 방문객 기록실(로깅 서버)을 나누는 것. 기록실이 붐벼도 홀은 안 느려진다.\n<\/li><li>장점: 서로 영향이 적음, 따로 늘릴 수 있음. 단점: 관리할 서버가 하나 더. [일반]\n<\/li><\/ul>\n<p><b>(3) 로깅 서버에는 어떤 자료 구조를 던지나?<\/b> → <b>JSON 한 덩어리.<\/b> 예:<\/p>\n<pre><code>{\n  &quot;event_id&quot;: &quot;e-8f3a1b&quot;,\n  &quot;event_type&quot;: &quot;click&quot;,\n  &quot;user_id&quot;: &quot;u-4c21d9&quot;,\n  &quot;session_id&quot;: &quot;s-91ab&quot;,\n  &quot;article_id&quot;: &quot;a1&quot;,\n  &quot;position&quot;: 1,\n  &quot;recommendation_id&quot;: &quot;rec-2026-11-10-0905-u4c21d9&quot;,\n  &quot;timestamp&quot;: &quot;2026-11-10T09:05:21+09:00&quot;,\n  &quot;schema_version&quot;: 1\n}<\/code><\/pre>\n<p>(예시일 뿐 필드는 팀이 정한다. 멘토 숙제 3번의 \"어떤 자료 구조로 던질지 적기\"가 이것이다.)<\/p>\n<p><b>(3) GCS에 파티션으로 쌓는다는 건 예를 들면?<\/b><\/p>\n<ul>\n<li>파일을 <b>시간대별 폴더<\/b>에 나눠 넣는 것. 5분 단위 예:\n<\/li><\/ul>\n<pre><code>gs://news-raw/events/dt=2026-11-10/hh=09/mm=05/part-0001.jsonl    ← 09:05~09:09의 이벤트\ngs://news-raw/events/dt=2026-11-10/hh=09/mm=05/_SUCCESS            ← &quot;이 5분 폴더는 다 들어왔다&quot; 표시\ngs://news-raw/events/dt=2026-11-10/hh=09/mm=10/part-0001.jsonl    ← 09:10~09:14<\/code><\/pre>\n<ul>\n<li><b>왜<\/b>: 배치가 \"이 5분 구간만\" 읽고, 실패하면 그 구간만 다시 한다. 폴더가 짧을수록 파일 수가 늘어난다. 멘토는 5분을 권했다(\"한 시간은 너무 길다\"). [멘토, 스크립트 00:40~00:41]\n<\/li><\/ul>\n<p><b>(4) '쿠키에 FE 스크립트로 발급'은 구체적으로?<\/b> [일반]<\/p>\n<ol>\n<li>사용자가 사이트에 처음 들어오면, FE 스크립트가 쿠키에 <code>user_id<\/code>가 있나 확인한다.\n<\/li><li><b>없으면<\/b> 무작위 번호(UUID)를 새로 만들어 쿠키에 저장한다(예: 유효기간 1년).\n<\/li><li>이후 모든 이벤트와 백엔드 요청에 그 번호를 같이 보낸다.\n<\/li><\/ol>\n<pre><code>let uid = getCookie(&#x27;uid&#x27;);\nif (!uid) { uid = crypto.randomUUID(); setCookie(&#x27;uid&#x27;, uid, 365); }<\/code><\/pre>\n<ul>\n<li>장점: 회원가입 없이 \"같은 사람\"을 구분. 단점: 쿠키를 지우면 새 사람이 된다. 우리의 <b>가상 독자(합성 데이터)는 쿠키 대신 페르소나 ID를 <code>user_id<\/code>로 직접 쓴다.<\/b> [제안]\n<\/li><\/ul>\n<p><b>(5) '클릭 모델 피처 목록(클릭한 기사와 유사한 임베딩 포함)'이 무슨 말?<\/b><\/p>\n<ul>\n<li><b>피처<\/b> = 모델이 \"이 사람이 이 기사를 누를까?\"를 맞힐 때 쓰는 재료 숫자들. <b>임베딩<\/b> = 기사 글을 숫자 목록(벡터)으로 바꾼 것. 비슷한 글은 숫자도 가깝다. [일반]\n<\/li><li>예: 반도체 기사 A <code>[0.8, 0.1, 0.3…]<\/code>, 반도체 기사 B <code>[0.7, 0.2, 0.3…]<\/code> → 가깝다(유사도 0.9). 스포츠 기사 C <code>[0.1, 0.9, 0.0…]<\/code> → 멀다(유사도 0.1).\n<\/li><li>피처 예: \"이 사람이 최근 클릭한 기사 5개의 평균 벡터와, 지금 후보 기사의 유사도\" → 반도체를 자주 본 사람에게 반도체 기사 점수가 올라간다. [멘토: 클릭한 기사와 유사한 임베딩 피처 가능]\n<\/li><\/ul>\n<p><b>(5) '거꾸로 필요한 이벤트를 되짚는다'는 어떤 과정?<\/b><\/p>\n<ul>\n<li>모델 재료(피처)에서 시작해 \"그걸 만들려면 무슨 기록이 있어야 하지?\"를 <b>끝에서 앞으로<\/b> 거슬러 올라가는 것.\n<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>만들고 싶은 피처<\/th><th>필요한 원재료<\/th><th>그러려면 수집해야 할 이벤트/필드<\/th><\/tr><\/thead><tbody><tr><td>최근 7일 카테고리별 클릭 비율<\/td><td>누가 어떤 카테고리를 눌렀나 + 몇 번 봤나<\/td><td>click, impression, <code>user_id<\/code>, <code>article_id<\/code>, 기사의 카테고리, <code>timestamp<\/code><\/td><\/tr><tr><td>기사별 최근 CTR<\/td><td>기사별 노출 수와 클릭 수<\/td><td>impression, click, <code>article_id<\/code><\/td><\/tr><tr><td>지금 시간대<\/td><td>접속 시각<\/td><td><code>timestamp<\/code><\/td><\/tr><tr><td>클릭 기사와의 유사도<\/td><td>클릭한 기사 id, 기사 본문(임베딩)<\/td><td>click의 <code>article_id<\/code>, 기사 본문<\/td><\/tr><tr><td>피드 내 위치 효과<\/td><td>몇 번째에 보였나<\/td><td><code>position<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>표의 오른쪽 열이 <b>FE 수집 스크립트가 보내야 할 목록<\/b>이 된다. 빠진 칸이 있으면 이벤트를 추가한다.\n<\/li><\/ul>\n<p><b>(6) '합치기'가 무슨 말? 1~5를 하나로 합치라는 뜻?<\/b><\/p>\n<ul>\n<li><b>맞다.<\/b> 1~5를 각각 따로 쓰지 말고, <b>같은 데이터가 이름·형식이 바뀌지 않고 끝까지 이어지는지<\/b> 한 장에서 확인하라는 뜻이다. 예: <code>article_id<\/code>가 화면 응답에서도, 이벤트에서도, 피처 계산에서도 같은 이름·같은 형식인가. \"무작정 조립 금지\"는 각자 만든 걸 안 맞춰 보고 붙이지 말라는 경고다.\n<\/li><\/ul>\n<p><b>(6) '에이전트와 같이 하라'는 무슨 말?<\/b><\/p>\n<ul>\n<li><b>ChatGPT·Claude 같은 AI에게 물어 가며 초안을 만들라<\/b>는 뜻이다. 멘토는 \"한 번에 깔끔하게 못 그릴 것이다. 에이전트에게 정리하라고 하면 정리해 주고, 해석은 내가 한다\"고 했다. [멘토, 스크립트 00:43] 즉 <b>초안을 AI가 쓰게 하되, 우리가 이해하고 설명할 수 있어야 한다<\/b>(멘토는 이해 확인 장치도 둘 것이라고 함).\n<\/li><li>질문 예: \"뉴스 피드 CTR 예측 모델에 보통 들어가는 피처를 알려줘. 각 피처를 만들려면 어떤 이벤트가 필요한지 표로.\"\n<\/li><\/ul>\n<p><b>(마지막) 위에서 구체적으로 생각한 내용을 청사진으로 들고 가면 되나?<\/b><\/p>\n<ul>\n<li><b>네, 그렇게 가져가면 된다.<\/b> 단 청사진은 정답이 아니라 <b>\"현재 우리 생각을 이어서 그린 초안\"<\/b>이다. 장주현이 들고 갈 것은 ① 이 흐름을 이해했다는 한 줄 요약 ② 인프라 지도 1장 ③ 받을 것 표 ④ 미정 질문 3개. 팀 전체 청사진은 4명 자료를 합친 것이다.\n<\/li><\/ul>\n<h3>2-2. 인프라 지도 부분<\/h3>\n<p><b>1. 화면(정적 빌드)이 뭐지?<\/b><\/p>\n<ul>\n<li><b>정적<\/b> = 서버가 그때그때 계산하지 않는, 이미 완성된 파일(HTML/CSS/JS)이라는 뜻. <b>빌드<\/b> = 개발용 소스를 배포용 파일로 묶는 작업(예: <code>npm run build<\/code>가 <code>dist/<\/code> 폴더를 만든다).\n<\/li><li>비유: 주문받고 만드는 즉석요리(서버가 화면 생성)가 아니라, <b>미리 만들어 둔 도시락<\/b>(파일을 그대로 전달). 기사 내용은 화면이 열릴 때 백엔드에서 받아 채운다.\n<\/li><li>장점: 서버를 따로 안 켜도 되고 GCS에 올려 두기만 하면 된다. 팀 <code>frontend<\/code> 프로토타입이 이 방식(<code>dist/<\/code>)이다(사실). 호스팅 방식은 제안.\n<\/li><\/ul>\n<p><b>2. 백엔드(Cloud Run 또는 GKE)가 무슨 말?<\/b><\/p>\n<ul>\n<li><b>백엔드<\/b> = 기사 목록·상세를 DB에서 꺼내 화면에 주는 서버 프로그램. \"어디서 실행시킬까\"의 두 후보라는 뜻이다.\n<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Cloud Run<\/th><th>GKE<\/th><\/tr><\/thead><tbody><tr><td>한 줄<\/td><td>컨테이너를 올리면 알아서 실행, 요청이 없으면 0으로 줄어듦<\/td><td>쿠버네티스 클러스터 위에서 직접 운영<\/td><\/tr><tr><td>장점<\/td><td>관리 쉬움, 안 쓰면 비용 낮음<\/td><td>같은 곳에 Airflow·추론 서버가 이미 있음, 쿠버 경험<\/td><\/tr><tr><td>단점<\/td><td>다른 서비스(GKE)와 연결 설계가 더 필요<\/td><td>클러스터를 켜 두는 만큼 비용, 설정 복잡<\/td><\/tr><tr><td>근거<\/td><td>멘토: \"백엔드는 Cloud Run이 편하다\"<\/td><td>멘토: \"가능하면 쿠버 환경을 경험\"<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>아직 <b>미정<\/b>이다. 장주현이 Q4에서 고른다(청사진 질문형 파일 참고).\n<\/li><\/ul>\n<p><b>3. 'Airflow on GKE → BigQuery'에서 Airflow는 뭘 하고, BigQuery에는 뭘 쌓나?<\/b><\/p>\n<ul>\n<li><b>Airflow<\/b> = 정해진 시각에 작업을 순서대로 자동 실행하는 스케줄러. 실패하면 재시도하고 어디서 멈췄는지 보여 준다.\n<\/li><li>예 (5분마다 또는 매일): ① GCS의 해당 폴더에 <code>_SUCCESS<\/code>가 생겼나 확인 → ② 이벤트 정제(중복 <code>event_id<\/code> 제거, 필수 값 비었으면 오류 보관) → ③ BigQuery에 적재 → ④ 집계(사용자×카테고리 클릭 비율 등) → ⑤ 피처 계산.\n<\/li><li><b>BigQuery에 쌓는 것<\/b> (테이블 이름은 제안):\n<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>내용<\/th><th>메달리온 이름<\/th><\/tr><\/thead><tbody><tr><td>정제 이벤트<\/td><td>중복·불량을 걸러 낸 노출/클릭 기록<\/td><td>실버<\/td><\/tr><tr><td>집계·피처<\/td><td>사용자별 카테고리 클릭 비율, 기사별 CTR 등<\/td><td>골드<\/td><\/tr><tr><td>학습용 데이터<\/td><td>\"그 시점에 알던 피처 + 정답(클릭했나)\"<\/td><td>골드<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>원본(GCS)은 브론즈. BigQuery는 \"쌓인 걸 한꺼번에 계산하는 창고\"다. 학습 레포 <code>airflow-medallion-rag<\/code>의 DAG 모양과 같다(Sensor → 검사 → 병렬 → 합치기).\n<\/li><\/ul>\n<p><b>4. 'Cloud SQL'은 뭐고 왜 필요해?<\/b><\/p>\n<ul>\n<li><b>Cloud SQL<\/b> = 구글이 설치·백업을 대신해 주는 관계형 DB(Postgres). 기사·구독을 <b>한 건씩 빠르게<\/b> 읽고 쓰는 곳이다.\n<\/li><li><b>왜 필요<\/b>: 뉴스 백엔드가 기사 한 건을 보여줄 때마다 BigQuery에 물으면 느리고 비싸다. BigQuery는 \"대량 집계용\", Cloud SQL은 \"건별 서비스용\"이다. 멘토가 핵심 제품에 \"SQL 스토리지\"로 꼽았고, 매니지드 대신 직접 띄우는 쪽을 권하되 <b>RDB까지는 매니지드 허용<\/b>이라는 타협이 있었다. [멘토]\n<\/li><li>비유: 계산대 옆 서랍(Cloud SQL)과 지하 창고(BigQuery).\n<\/li><\/ul>\n<p><b>5. Redis는 어떤 활용처가 있고 어떻게 쓰나?<\/b> [일반]<\/p>\n<ul>\n<li><b>Redis<\/b> = 메모리에 \"키 → 값\"을 두는 초고속 저장소.\n<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>활용<\/th><th>설명<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>캐시<\/td><td>자주 찾는 결과를 메모리에 잠시 보관<\/td><td>오늘의 인기 기사 목록<\/td><\/tr><tr><td>온라인 피처<\/td><td>사용자별 최신 피처를 즉시 읽기<\/td><td><code>user:u123:cat_ratio<\/code> → <code>{\"경제\":0.7}<\/code><\/td><\/tr><tr><td>카운터·순위<\/td><td>실시간으로 숫자를 올림<\/td><td>기사별 클릭 수 +1<\/td><\/tr><tr><td>제한·세션<\/td><td>중복 요청 막기, 임시 상태<\/td><td>같은 클릭 연타 방지<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li><b>우리는<\/b>: 멘토가 핵심 제품에 Memorystore를 넣었지만 <b>용도 설명이 없었다<\/b>. 그래서 <b>10/31 멘토 질문<\/b>이고, 그때까지 MVP는 \"자리만\" 두는 게 안전하다. [멘토 + 제안] Valkey는 Redis에서 갈라진 오픈소스로 사용법이 거의 같다.\n<\/li><\/ul>\n<p><b>6. 로컬 compose 계획은 어떻게 세우나?<\/b><\/p>\n<ul>\n<li><b>compose<\/b> = <code>docker compose up<\/code> 한 줄로 여러 프로그램을 내 컴퓨터에 함께 띄우는 파일. 클라우드 없이 팀원 모두가 같은 환경에서 개발하게 한다.\n<\/li><li><b>무엇을 넣을지 목록<\/b>: Postgres, Redis, Airflow(+메타 DB), 폴더형 GCS(그냥 로컬 폴더), (나중에) 로깅 서버·백엔드 자리.\n<\/li><li><b>각자 서비스는 Dockerfile이 생기면 한 줄씩 추가<\/b>.\n<\/li><li><code>.env.example<\/code>에 포트·환경변수 이름 합의(비밀값은 올리지 않음).\n<\/li><li><b>샘플 데이터<\/b>(기사 수십 개, 이벤트 수백 개)를 같이 넣기.\n<\/li><li><code>README<\/code>에 \"<code>docker compose up<\/code> 후 이 주소로 확인\".\n<\/li><li>일정: 범위 합의 11/3, 팀 배포 11/5 전. [제안, WBS 근거]\n<\/li><li>참고 자료: 학습 레포 <code>airflow-medallion-rag/docker-compose.yaml<\/code>. BigQuery는 로컬 대체가 약해서 샘플 SQL 파일로 두고 클라우드에서 검증한다.\n<\/li><\/ul>\n<h3>2-3. 다른 사람 파트<\/h3>\n<p><b>1. '이벤트 JSON'이 의미하는 게 뭐지?<\/b><\/p>\n<ul>\n<li><b>이벤트 1건을 JSON(이름: 값 형식의 글)으로 적은 것.<\/b> 위 (3) 예시가 그것이다. \"U001이 a1을 3번째 칸에서 09:05에 클릭했다\"를 컴퓨터가 읽는 모양으로 쓴 한 줄.\n<\/li><\/ul>\n<p><b>2. '로깅 서버 입력 형식'은 어떤 식이 있지?<\/b> [일반]<\/p>\n<div class=\"tw\"><table><thead><tr><th>방식<\/th><th>설명<\/th><th>의견<\/th><\/tr><\/thead><tbody><tr><td>1건씩 POST<\/td><td>이벤트가 생길 때마다 <code>POST /events<\/code>에 JSON 1개<\/td><td>가장 단순, 요청이 많음<\/td><\/tr><tr><td>여러 건 묶음 POST<\/td><td>몇 초 모은 이벤트 배열을 한 번에<\/td><td><b>추천 [제안]<\/b>, 요청 수가 줄고 효율적<\/td><\/tr><tr><td>GET 이미지(픽셀)<\/td><td>주소 뒤에 값을 붙여 이미지를 요청하는 옛 방식<\/td><td>광고·분석 도구에서 쓰는 방식, 우리는 불필요<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>응답은 \"받았음\"(예: 204)만 주면 충분하다.\n<\/li><\/ul>\n<p><b>3. 여기서 쓴 숙제 번호는 '멘토가 요청한 청사진'의 번호가 맞아?<\/b> <b>맞다.<\/b> 1절 표의 번호와 같다. 담당(추정)은 태원=1번, 세호=2·3·4번, 윤모=5번, 합치기=6번(전원)이다. 장주현은 멘토 번호에 없는 <b>인프라 지도<\/b>(팀이 덧붙임)다.<\/p>\n<p><b>4. 피처 목록은 어떻게 확인하나? 예시는?<\/b> → \"모델이 입력받는 표의 <b>열 이름 목록<\/b>\"이다. 예:<\/p>\n<div class=\"tw\"><table><thead><tr><th>피처<\/th><th>뜻<\/th><th>만드는 재료<\/th><th>예 값<\/th><\/tr><\/thead><tbody><tr><td><code>user_cat_click_ratio_7d<\/code><\/td><td>최근 7일 카테고리별 클릭 비율<\/td><td>click, impression<\/td><td>경제 0.7<\/td><\/tr><tr><td><code>article_ctr_1d<\/code><\/td><td>기사의 어제 CTR<\/td><td>click, impression<\/td><td>0.12<\/td><\/tr><tr><td><code>article_age_hours<\/code><\/td><td>기사 발행 후 경과 시간<\/td><td>기사 발행 시각, 현재 시각<\/td><td>5<\/td><\/tr><tr><td><code>hour_of_day<\/code><\/td><td>접속 시각<\/td><td>timestamp<\/td><td>9<\/td><\/tr><tr><td><code>position<\/code><\/td><td>피드 위치<\/td><td>impression의 position<\/td><td>3<\/td><\/tr><tr><td><code>sim_recent_clicks<\/code><\/td><td>최근 클릭 기사들과의 임베딩 유사도<\/td><td>클릭 기사 id, 기사 본문<\/td><td>0.82<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>학습할 때는 한 줄이 \"(사용자, 기사, 시점)\" 1건이고, 마지막 칸이 정답(<code>clicked<\/code>: 0/1)이다.\n<\/li><\/ul>\n<p><b>5. '거꾸로 필요한 이벤트'는 어떻게 생각해야 하나?<\/b> → 위 (5) 표처럼 <b>피처 → 원재료 → 이벤트/필드<\/b> 순으로 거슬러 올라간다. 오른쪽 열에 빠진 칸이 생기면 \"그 이벤트를 안 모으고 있었다\"는 발견이다.<\/p>\n<p><b>6. 'CTR 평가'가 뭐지?<\/b><\/p>\n<ul>\n<li><b>CTR(Click-Through Rate, 클릭률) = 클릭 수 ÷ 노출 수.<\/b> 예: 100번 보여줬는데 8번 클릭 → 8%.\n<\/li><li><b>평가<\/b> = 개인화 추천이 기본 방식(예: 인기순)보다 CTR이 높은지 비교하는 것. 멘토는 \"일단 CTR\"로 시작하라고 했고 nDCG@K는 후순위다. [멘토]\n<\/li><\/ul>\n<p><b>7. '엔진 성과'는 모델의 성능을 뜻하는 게 맞아?<\/b><\/p>\n<ul>\n<li><b>거의 맞다.<\/b> 태원이 말한 \"엔진 성과가 홈페이지 편의성보다 우선\" [팀]에서 엔진은 <b>추천 엔진(모델 + 점수를 계산해 주는 서빙)<\/b>으로 읽힌다(추정). 모델이 얼마나 잘 맞히는지(정확도)와 서비스에서 제대로 돌아가는지(응답 속도 등)를 포함할 수 있다. 정확한 뜻은 태원에게 확인.\n<\/li><\/ul>\n<p><b>8. 엔진 성과도 정량적으로 나와야 하고, 어떻게 확인하나?<\/b> → <b>맞다. 숫자로 나와야 한다.<\/b> 방법 두 가지 [일반]:<\/p>\n<div class=\"tw\"><table><thead><tr><th>방식<\/th><th>하는 일<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>오프라인 평가<\/td><td>과거 데이터를 <b>시간 순서로 나눠<\/b> 앞쪽으로 학습, 뒤쪽으로 시험<\/td><td>인기순 CTR 8% vs 모델 추천 CTR 11% (예시 숫자)<\/td><\/tr><tr><td>온라인 평가<\/td><td>가상 독자에게 두 방식을 섞어 보여주고 CTR 비교(A/B)<\/td><td>인기순 피드 vs 개인화 피드<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>모델 자체 지표로는 AUC, 로그 손실 등이 있다(전문 용어는 나중에 필요할 때). <b>한계<\/b>: 가상 독자는 합성 데이터라 숫자가 실제 사용자 결과를 보장하지 않는다. 그래서 발표 때 \"이 기준으로 비교했다, 한계는 이렇다\"까지 말한다.\n<\/li><\/ul>\n<h3>2-4. 멘토 PPT의 역할: 우리 역할은 나눠진 거 맞아?<\/h3>\n<ul>\n<li><b>칸(구조)은 나눠져 있고, 사람 배정은 아직 확정이 아니다.<\/b>\n<\/li><li>멘토 PPT/말: <b>인프라 1 / FE·BE·데이터 수집 2 / 데이터 처리·추천 모델 2<\/b>(5칸 구조). 우리는 4명이라 한 칸을 합쳐야 하고, <b>누가 맡을지는 팀이 정하라<\/b>고 했다. [멘토, 회의록 3절]\n<\/li><li>10/29 팀 회의에서 각자 하고 싶은 말은 나왔다(태원=뉴스 생성·서빙 WAS, 세호=사용자 데이터·프론트, 윤모=피처→평가, 장주현=인프라). 하지만 <b>확정이 아니라 의사 표현<\/b>이고 메모 표기도 모호한 부분이 있다. [팀] 추론 서버 담당은 비어 있다.\n<\/li><li>따라서 13시에는 \"구조는 멘토 안이 있고, 이름 배정은 오늘 논의\"가 정확한 설명이다.\n<\/li><\/ul>\n<hr>\n<h2>3. 장주현의 13시 준비 (체크리스트)<\/h2>\n<h3>3-1. 가져갈 것<\/h3>\n<ul>\n<li>[ ] 위 0절 요약 (30초 발언용)\n<\/li><li>[ ] 인프라 지도 1장 (아래 표)\n<\/li><li>[ ] 받을 것 표 (태원/세호/윤모)\n<\/li><li>[ ] 미정 질문 3개: 백엔드를 Cloud Run으로 둘지, Redis 용도, GKE 방식과 비용\n<\/li><\/ul>\n<h3>3-2. 인프라 지도 (확정은 멘토 방침만)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>상자<\/th><th>어디서 돌까 / 저장될까<\/th><th>상태<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>화면(FE)<\/td><td>정적 파일을 GCS(또는 컨테이너)에서 제공<\/td><td>제안<\/td><td>팀 프로토타입이 <code>dist/<\/code> 정적 빌드<\/td><\/tr><tr><td>뉴스 백엔드<\/td><td>Cloud Run 또는 GKE<\/td><td>미정<\/td><td>멘토: Cloud Run이 편함<\/td><\/tr><tr><td>서비스 DB<\/td><td>Cloud SQL(타협) 또는 클러스터 안 Postgres<\/td><td>멘토 방침 + 제안<\/td><td>멘토: 핵심 제품<\/td><\/tr><tr><td>로깅 서버<\/td><td>별도 서버, GCS에 5분 파티션<\/td><td>멘토 권고<\/td><td>스크립트 00:40<\/td><\/tr><tr><td>원본 저장<\/td><td>GCS <code>dt=/hh=/mm=<\/code> + <code>_SUCCESS<\/code><\/td><td>확정<\/td><td>멘토<\/td><\/tr><tr><td>배치<\/td><td>Airflow(GKE 직접) → BigQuery<\/td><td><b>확정<\/b><\/td><td>멘토<\/td><\/tr><tr><td>추론 서버<\/td><td>GKE에 별도<\/td><td><b>확정<\/b><\/td><td>멘토<\/td><\/tr><tr><td>Redis<\/td><td>용도 미정(자리만)<\/td><td>멘토 질문<\/td><td>멘토 핵심 제품<\/td><\/tr><tr><td>기사 생성·가상 독자<\/td><td>스케줄 작업(Job), LLM은 OpenRouter 키<\/td><td>제안<\/td><td>멘토: 키 제공<\/td><\/tr><tr><td>IaC<\/td><td>Terraform 필수, 계정 교체 대비 설정 한 곳<\/td><td>확정<\/td><td>멘토<\/td><\/tr><tr><td>로컬<\/td><td>docker compose<\/td><td>제안<\/td><td>팀 WBS<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3-3. 5분 발표 틀<\/h3>\n<ol>\n<li>(30초) 한 바퀴 그림을 한 줄로\n<\/li><li>(2분) 인프라 지도: 확정(멘토 방침)과 제안 구분\n<\/li><li>(1분) 로컬 compose 계획: 11/3 범위 합의, 11/5 전 배포\n<\/li><li>(1분) 받을 것 요청\n<\/li><li>(30초) 미정 질문\n<\/li><\/ol>\n<h3>3-4. 받을 것<\/h3>\n<div class=\"tw\"><table><thead><tr><th>누구에게(추정)<\/th><th>받을 것<\/th><th>왜 필요한가<\/th><\/tr><\/thead><tbody><tr><td>태원<\/td><td>기사 테이블 컬럼, 생성 주기·건수, 뉴스 WAS 요청량 가정<\/td><td>DB 크기, 스케줄, 서버 사양<\/td><\/tr><tr><td>세호<\/td><td>이벤트 종류·필드, 하루 이벤트 수, 로깅 서버 입출력<\/td><td>로깅 서버 사양, GCS 경로·파일 크기<\/td><\/tr><tr><td>윤모<\/td><td>피처 목록, 배치 주기, 추론 지연 허용치, 모델 크기<\/td><td>Airflow 주기, BigQuery 구성, 추론 서버 사양<\/td><\/tr><tr><td>전원<\/td><td>서비스(컨테이너) 목록, 언어, 환경변수<\/td><td>compose, 배포<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 다른 사람 파트 가이드 (담당은 추정, 가중치: 멘토 &gt; 태원 &gt; 기타)<\/h2>\n<div class=\"tw\"><table><thead><tr><th>사람<\/th><th>근거<\/th><th>가져올 것<\/th><\/tr><\/thead><tbody><tr><td>태원(뉴스 생성·뉴스 WAS·DB)<\/td><td>본인 발언(10/29), 멘토 1번<\/td><td>백엔드가 주는 필드(id, 썸네일, 제목, 작성일, 수정일, 에이전트 기자, 본문, 출처), 기사 테이블, 생성 주기<\/td><\/tr><tr><td>세호(사용자 데이터·프론트)<\/td><td>본인 발언, 멘토 2·3·4번<\/td><td>유저 액션 목록, 쿠키 ID 방식, 이벤트 JSON, 로깅 서버 입력 형식<\/td><\/tr><tr><td>윤모(피처→평가)<\/td><td>본인 발언, 태원 \"모델 담당이 피처와 평가\", 멘토 5번<\/td><td>피처 목록, 거꾸로 필요한 이벤트, CTR 평가 방식<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>태원의 방향: \"MVP를 한 번 돌려보는 게 목표\", \"엔진 성과가 화면 편의성보다 우선\" → 화면은 최소로, 이어지는지를 먼저. [팀]\n<\/li><\/ul>\n<h2>5. 합쳐 읽을 때 확인 질문 6개<\/h2>\n<ol>\n<li>화면이 보여주는 항목이 기사 테이블 컬럼에 다 있나? (태원 ↔ 세호)\n<\/li><li>이벤트 필드에 윤모 피처가 요구하는 값(노출·클릭·시간·기사 id·유저 id)이 다 있나? (세호 ↔ 윤모)\n<\/li><li>유저 ID가 쿠키 발급 → 이벤트 → 피처까지 같은 이름·형식인가?\n<\/li><li>이벤트는 누가 어디로 보내고, GCS 경로 규칙은? (세호 ↔ 장주현)\n<\/li><li>추천 요청은 요청 시 계산(후보 10~20개)인데, 추론 서버 입출력과 응답 시간이 뉴스 백엔드와 맞나? (윤모 ↔ 태원 ↔ 장주현)\n<\/li><li>서비스 목록, 포트, 하루 이벤트 수, 저장량이 인프라 사양 추정에 충분한가? (전원 ↔ 장주현)\n<\/li><li>빈 칸은 \"미정\"으로 적고 토요일 멘토 질문으로 올린다.\n<\/li><\/ol>\n<h2>6. 불확실한 부분<\/h2>\n<ul>\n<li>스크립트는 음성 인식 결과라 뜻만 옮겼다. 시간 표기는 Gemini 문서의 구간이다.\n<\/li><li>태원·세호·윤모 발언은 장주현의 10/29 메모 기준이다(녹취 없음). 담당은 모두 추정이다.\n<\/li><li>\"클릭만으로 MVP 가능\" 판단과 이벤트 필드 목록, 테이블 이름은 제 제안이다. 멘토/팀 확인 필요.\n<\/li><li>13시 자리의 진행 방식은 모른다.\n<\/li><\/ul>\n<h2>7. 변경 이력<\/h2>\n<ul>\n<li>2026-10-30: 최초 작성(청사진 주제만 분리). 근거 범위: 인프라_청사진_초안_질문형.md 6~9절, 1028 멘토 회의록·Gemini 스크립트, 1029 팀 회의 정리.\n<\/li><li>2026-10-30(오전 2차): 8절 추가(질문 풀이 전체, 그림 6장), 0절에 그림 안내 추가. 본문 1~7절은 그대로.\n<\/li><\/ul>\n<h2>8. 추가 질문 풀이 (10/30 오전, 질문 순서대로)<\/h2>\n<p>보는 법: VS Code에서 <code>Ctrl+Shift+V<\/code>(Mac <code>Cmd+Shift+V<\/code>)를 누르면 그림이 보인다. 그림까지 한 화면에서 보려면 <a href=\"#bp\">1부 청사진 정리<\/a>을 브라우저로 연다. 아래는 표 대신 짧은 목록으로 썼다.<\/p>\n<h3>8-0. 먼저: 그림으로 보면 쉬운가? → 네. 그래서 6장 그렸다<\/h3>\n<p>\"어디서 어떤 작업을 하는가\"는 글보다 그림이 빠르다. 한 바퀴 그림을 먼저 보고, 막히는 용어만 fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">배치가 폴더를 읽어<\/text><text x=\"74\" y=\"384\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">정제한다<\/text><text x=\"44\" y=\"413.0\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">_SUCCESS 있는 폴더만, 중복 제거<\/text><rect x=\"40\" y=\"457\" width=\"220\" height=\"38\" rx=\"8\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"1\"/><text x=\"48\" y=\"475\" font-size=\"12\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">어디서: Airflow (GKE에 직접 설치)<\/text><line x1=\"274\" y1=\"420.0\" x2=\"326\" y2=\"420.0\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"330\" y=\"335\" width=\"240\" height=\"170\" rx=\"10\" fill=\"#f5f3ff\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><text x=\"344\" y=\"365\" font-size=\"22\" font-weight=\"bold\" fill=\"#7c3aed\" text-anchor=\"start\" xml:space=\"preserve\">⑥<\/text><text x=\"374\" y=\"365\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">집계하고 피처를<\/text><text x=\"374\" y=\"384\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">만든다<\/text><text x=\"344\" y=\"413.0\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">BigQuery SQL: 독자×카테고리<\/text><text x=\"344\" y=\"430.5\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">클릭률 등<\/text><rect x=\"340\" y=\"457\" width=\"220\" height=\"38\" rx=\"8\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"1\"/><text x=\"348\" y=\"475\" font-size=\"12\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">어디서: BigQuery (매니지드)<\/text><line x1=\"574\" y1=\"420.0\" x2=\"626\" y2=\"420.0\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"630\" y=\"335\" width=\"240\" height=\"170\" rx=\"10\" fill=\"#f5f3ff\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><text x=\"644\" y=\"365\" font-size=\"22\" font-weight=\"bold\" fill=\"#7c3aed\" text-anchor=\"start\" xml:space=\"preserve\">⑦<\/text><text x=\"674\" y=\"365\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">모델을 학습해 파일로<\/text><text x=\"674\" y=\"384\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">저장<\/text><text x=\"644\" y=\"413.0\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">학습 한 줄 = (사용자, 기사, 시점)<\/text><rect x=\"640\" y=\"457\" width=\"220\" height=\"38\" rx=\"8\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"1\"/><text x=\"648\" y=\"475\" font-size=\"12\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">어디서: Notebook/Job + GCS 모델<\/text><text x=\"648\" y=\"489\" font-size=\"12\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">파일<\/text><line x1=\"874\" y1=\"420.0\" x2=\"926\" y2=\"420.0\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"930\" y=\"335\" width=\"240\" height=\"170\" rx=\"10\" fill=\"#f5f3ff\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><text x=\"944\" y=\"365\" font-size=\"22\" font-weight=\"bold\" fill=\"#7c3aed\" text-anchor=\"start\" xml:space=\"preserve\">⑧<\/text><text x=\"974\" y=\"365\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">추론 서버가 점수를<\/text><text x=\"974\" y=\"384\" font-size=\"15\" font-weight=\"bold\" fill=\"#1f2937\" text-anchor=\"start\" xml:space=\"preserve\">매겨 추천<\/text><text x=\"944\" y=\"413.0\" font-size=\"12.5\" font-weight=\"normal\" fill=\"#374151\" text-anchor=\"start\" xml:space=\"preserve\">후보 기사에 점수 → 상위 10건 반환<\/text><rect x=\"940\" y=\"457\" width=\"220\" height=\"38\" rx=\"8\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"1\"/><text x=\"948\" y=\"475\" font-size=\"12\" font-weight=\"bold\" fill=\"#5b21b6\" text-anchor=\"start\" xml:space=\"preserve\">어디서: 추론 서버 (GKE, 별도)<\/text><path d=\"M1050.0 267 L1050.0 301 L150.0 301 L150.0 332\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\" marker-end=\"url(#ar)\" stroke-linejoin=\"round\"/><path d=\"M1050.0 507 L1050.0 540 L14 540 L14 180.0 L26 220.0\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" marker-end=\"url(#ar)\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"562\" font-size=\"13\" font-weight=\"bold\" fill=\"#7c3aed\" text-anchor=\"start\" xml:space=\"preserve\">⑧의 추천 결과는 다시 ②의 피드로 돌아갑니다 → 한 바퀴 완성 (이 한 바퀴가 멘토가 요청한 \"청사진\")<\/text><\/svg><figcaption>한 바퀴 도는 길: 어디서 어떤 작업이 일어나나<\/figcaption><\/figure>\n<p>한 줄로: 가상 독자가 화면을 열고(K8s Job) → 백엔드가 기사를 보여 주고(Cloud Run/GKE + Cloud SQL) → 화면이 노출·클릭을 보내고(로깅 서버) → 5분 폴더로 저장(GCS) → 배치가 읽어 정리(Airflow→BigQuery) → 모델이 학습·추천(추론 서버) → 다시 화면. [멘토 방향 + 제안]<\/p>\n<h3>8-1. [청사진 핵심만] 질문 1~8<\/h3>\n<p><b>1. \"이벤트에 event_type 칸\"이 무슨 뜻인가?<\/b><\/p>\n<ul>\n<li>이벤트 = 사용자 행동 1건을 적은 한 줄 기록(JSON). 노출·클릭·체류가 전부 같은 모양이고, \"무슨 행동인지\"만 <code>event_type<\/code> 칸에 적는다.\n<\/li><li>택배 송장에 \"종류\" 칸이 있는 것과 같다. 종류마다 입구(서버)와 파일을 따로 만들지 않고, 한 통로로 받아 나중에 종류별로 가른다.\n<\/li><li>이득: 나중에 \"좋아요\"가 추가돼도 <code>event_type: \"like\"<\/code>만 새로 쓰면 된다. [제안]\n<\/li><\/ul>\n<figure><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"520\" viewBox=\"0 0 1200 520\" font-family=\"'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif\" xmlns:c2pa=\"http://c2pa.org/manifest\"><metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYTphZDNiMDEyZS0zMmZlLTQyNjAtOGUxNS1iNTYyYzI1YzY5MjkAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaI6+1Kd7xFoSIyWwDdl
