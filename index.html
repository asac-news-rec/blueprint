splay:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; }\nnav.top a { color: var(--accent); text-decoration:none; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <nav class=\"top\"><a href=\"index.html\">← 공동 청사진 대문<\/a><a href=\"wbs.html\">작업 나열표<\/a><\/nav>\n  <h1>뉴스 생성·서비스 청사진<\/h1>\n  <p>담당: 태원 (회의 발언 기준, 확정 전)<\/p>\n  <p class=\"banner\">뼈대만 있는 초안이다. 아래 \"작성 예정\" 칸은 담당자가 채운다. 구성은 처리·피처·모델 청사진과 같은 순서를 따른다.<\/p>\n\n  <section><h2>맡는 일<\/h2>\n    <div class=\"card\" style=\"padding:0 4px\"><table style=\"min-width:420px\"><thead><tr><th>#<\/th><th>작업<\/th><th>후보<\/th><\/tr><\/thead><tbody><tr><td><a href=\"wbs.html#t4\">#4<\/a><\/td><td>기사 메타데이터 스키마(신문사 카테고리 형식)<\/td><td>태원<\/td><\/tr><tr><td><a href=\"wbs.html#t5\">#5<\/a><\/td><td>LLM 기사 생성·에이전트 검수<\/td><td>태원<\/td><\/tr><tr><td><a href=\"wbs.html#t6\">#6<\/a><\/td><td>뉴스 DB(Cloud SQL), 뉴스 백엔드·서빙 WAS API(피드, 상세)<\/td><td>태원<\/td><\/tr><\/tbody><\/table><\/div>\n  <\/section>\n\n  <section><h2>전체 그림<\/h2><div class=\"todo\">작성 예정 · 이 파트가 무엇을 받아서 무엇을 내보내는지 그림 한 장<\/div><\/section>\n  <section><h2>설계 단계<\/h2><div class=\"todo\">작성 예정 · 설계하는 순서대로 단계별 내용, 후보 방법·도구, 1차 선택<\/div><\/section>\n\n  <section><h2>다른 파트에 필요한 것<\/h2><div class=\"todo\">작성 예정 · 이 파트가 다른 사람에게 받아야 하는 것<\/div><\/section>\n\n  <section><h2>다른 파트가 요청한 것<\/h2>\n    <p>처리·피처·모델 파트가 이 파트에 요청하거나 같이 정하자고 한 항목이다.<\/p>\n    <ul><li>기사 메타에 카테고리·세부 태그(#18)·published_at·자극도 점수 넣기<\/li><li>기사 임베딩은 피처 DAG가 매시 새 기사만 계산하는 안 (처리·피처·모델 파트 담당). 뉴스 쪽은 제목·본문·카테고리·published_at을 Cloud SQL에 정확히 저장 — 동의 여부 확인<\/li><li>후보 10~20개를 뉴스 WAS가 고를지, 추론 서버가 고를지<\/li><li>뉴스 WAS ↔ 추론 서버 요청·응답 형식 (WBS Q4: 서버 분리 추천)<\/li><\/ul>\n  <\/section>\n\n  <section><h2>결정 필요 · 예상 문제 · 불확실<\/h2><div class=\"todo\">작성 예정<\/div><\/section>\n\n  <section><h2>멘토님께 드릴 질문<\/h2>\n    <p>WBS 문서 6절에서 이 파트와 관련된 질문:<\/p>\n    <ul><li>Q4 뉴스 WAS와 추론 서버 분리 여부<\/li><\/ul>\n    <div class=\"todo\">추가 질문 작성 예정<\/div>\n  <\/section>\n<\/div>\n<\/body>\n<\/html>\n", "seho": "<!doctype html>\n<html lan h:110px;padding:8px}}\n@media print{#fe @page{size:A4;margin:18mm}#fe{background:white;font-size:10pt}#fe main{padding:0;margin:0;max-width:none;box-shadow:none}#fe h1{font-size:23pt}#fe h2{font-size:16pt;margin-top:28pt;break-after:avoid}#fe h3{break-after:avoid}#fe table{font-size:8.5pt}#fe th,#fe td{padding:6pt}#fe tr,#fe pre{break-inside:avoid}#fe thead{display:table-header-group}#fe nav{display:none}#fe pre{font-size:8pt}#fe a{color:inherit}#fe .table{overflow:visible}}\n<\/style>\n<\/head>\n<body>\n<div class=\"topnav\"><a href=\"index.html\">← 공동 청사진 대문<\/a><a href=\"wbs.html\">작업 나열표<\/a>\n<p>출처: Notion 「10월 31일 멘토링 및 팀 회의용 프론트엔드 초안」의 AI용 파일(frontend-blueprint-2026-10-31.html). 내용은 바꾸지 않았다.<\/p><\/div>\n<div id=\"fe\">\n<main><div class=\"tag\">FRONTEND DESIGN REVIEW · 2026 10 31<\/div><div class=\"note\">팀 논의용 초안 · 브라우저에서 인쇄하면 PDF로 저장할 수 있습니다.<\/div><h1 id=\"section-0\">개인화 뉴스 플랫폼 프론트엔드 중심 설계 청사진<\/h1><nav aria-label=\"목차\"><strong>목차<\/strong><a href=\"#section-3\">1 회의에서 제안할 핵심 방향<\/a><a href=\"#section-7\">2 현재 상태와 구현 범위<\/a><a href=\"#section-12\">3 화면 구성과 프론트엔드 책임<\/a><a href=\"#section-20\">4 시스템 전체 흐름<\/a><a href=\"#section-25\">5 화면과 API 데이터 계약<\/a><a href=\"#section-36\">6 수집할 사용자 행동과 측정 정의<\/a><a href=\"#section-79\">7 데이터 구조와 식별자<\/a><a href=\"#section-119\">8 CTR 모델 피처와 라벨 설계<\/a><a href=\"#section-135\">9 신규 독자와 갱신 정책<\/a><a href=\"#section-138\">10 프론트엔드 구현 계획과 검증<\/a><a href=\"#section-147\">11 회의 진행과 합의 기록<\/a><a href=\"#section-155\">12 참고 자료와 용어<\/a><\/nav><p>2026년 10월 31일 토요일 오전 팀 회의 및 멘토링 검토용 · 초안 v0.6 · 작성 기준일 2026년 10월 29일<\/p><p>이 자료는 프론트엔드 담당자가 화면을 설명하고, 백엔드·데이터·ML 담당자와 연결 규칙을 결정하기 위한 제안서다. 개인화 뉴스 플랫폼의 화면부터 행동 수집, CTR 학습, 추천 결과 표시까지 전체 연결을 다룬다. 담당자 이름, 기술 스택, 일정, 임계값은 팀 합의 전이며 이 문서가 확정 명세를 뜻하지 않는다.<\/p><h2 id=\"section-3\">1 회의에서 제안할 핵심 방향<\/h2><p>프론트엔드는 추천 결과를 표시하고 관측 가능한 행동을 기록한다. 백엔드는 독자·기사·추천의 연결을 검증하고 데이터를 저장한다. 데이터 파이프라인은 원본 이벤트를 정제해 피처와 학습 표본을 만든다. ML은 클릭 확률을 예측하고 추천 순서를 제공한다. 프론트엔드가 관심사 점수나 추천 순위를 임의로 계산하지 않는 것을 제안한다.<\/p><p>첫 연결 목표는 독자 선택 → 추천 목록 조회 → 기사 상세 → 행동 저장까지다. 실제 학습 모델이 준비되지 않아도 명시적인 대체 추천과 고정된 API 샘플로 연결 검증을 시작할 수 있다. 행동 저장 성공과 모델 재학습 완료는 서로 다른 상태로 취급한다.<\/p><div class=\"table\"><table><thead><tr><th>이번 회의의 산출물<\/th><th>결정해야 하는 내용<\/th><\/tr><\/thead><tbody><tr><td>화면 범위<\/td><td>피드·상세·신규 독자·오류 상태를 MVP로 할지<\/td><\/tr><tr><td>API 계약<\/td><td>ID, 필드명, 요청·응답 예시, 오류 형식, 관리 담당<\/td><\/tr><tr><td>이벤트 계약<\/td><td>노출·클릭·상세 열림·활성 체류의 정확한 의미<\/td><\/tr><tr><td>CTR 표본<\/td><td>어떤 기사를 분모로 할지, 클릭 연결 방식과 관측 기간<\/td><\/tr><tr><td>역할과 다음 작업<\/td><td>기능별 책임자, 연결 검증 시점, 미정 항목의 결정 기한<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"section-7\">2 현재 상태와 구현 범위<\/h2><p>구현 후속 기록 · 2026년 10월 29일. 비로그인 방문자 쿠키 식별만 로컬 Node 서버와 SQLite에 구현했다. 초기 관심사 선택·저장은 팀에서 논의하지 않은 기능이므로 제거했다. 현재 저장하는 데이터는 토큰 해시, 독자 ID, 생성·최근 방문·만료 시각이다. 추천·행동 수집 API는 여전히 제안이며 최신 구현 범위는 anonymous-visitor-implementation.md를 참고한다.<\/p><p>현재 확인한 프론트엔드는 외부 패키지 설치가 필요 없는 정적 HTML·CSS·JavaScript 프로토타입이다. 가상 독자 3명과 가상 기사 8개를 사용한다. 독자별 미리 정한 순서가 다르며, 이는 학습 모델이 예측한 결과가 아니다.<\/p><div class=\"table\"><table><thead><tr><th>구분<\/th><th>확인된 상태<\/th><th>회의에서 설명할 표현<\/th><\/tr><\/thead><tbody><tr><td>뉴스 피드·독자 전환·필터<\/td><td>화면 코드 있음<\/td><td>화면 흐름을 검토할 수 있다<\/td><\/tr><tr><td>기사 상세·목록 복귀<\/td><td>화면 코드 있음<\/td><td>실제 클릭 동작의 종합 검증은 추가 필요<\/td><\/tr><tr><td>로딩·빈 결과·오류·재시도<\/td><td>시연용 상태 코드 있음<\/td><td>실제 서버 장애와 연결한 검증은 미완료<\/td><\/tr><tr><td>문법 검사·서비스 테스트·빌드<\/td><td>기존 검사와 테스트 4개 통과 기록 있음<\/td><td>모델 품질이나 브라우저 전체 동작의 증거는 아니다<\/td><\/tr><tr><td>브라우저 첫 화면<\/td><td>표시 확인 기록 있음<\/td><td>모바일·키보드·전체 읽기 흐름 검증은 남아 있다<\/td><\/tr><tr><td>API·행동 수집·DB<\/td><td>프론트엔드에서 연결하지 않음<\/td><td>설계·구현 예정<\/td><\/tr><tr><td>CTR 모델·배치 갱신<\/td><td>현재 화면에서 연결하지 않음<\/td><td>모델 성능·갱신 주기 미측정<\/td><\/tr><\/tbody><\/table><\/div><p>검토 대상 저장소는 https://github.com/asac-news-rec/frontend 이며 대화에서 푸시를 확인한 커밋은 c35ac20이다. 기존 frontend_backend_contract_v0.1.md는 API와 이벤트의 선행 제안이다. 그 문서의 ‘앱 코드 없음’ 등 과거 상태 문구보다 실제 코드와 이 절의 상태 구분을 우선한다. 본 문서는 상세 열림 이벤트, 노출 식별자, CTR 표본 규칙을 추가 제안하며 기존 계약을 자동 변경하지 않는다.<\/p><h2 id=\"section-12\">3 화면 구성과 프론트엔드 책임<\/h2><h3 id=\"section-13\">3.1 화면 배치<\/h3><pre><code>헤더             서비스 이름 · 시연 데이터 안내\n독자 영역        가상 독자 선택 · 신규 독자 안내\n피드 제목        추천 대상 · 목록 생성 시각 · 대체 추천 안내\n카테고리         전체 / IT·과학 / 스포츠 / 문화 / 사회 / 생활\n기사 카드        카테고리 · 제목 · 요약 · 발행 시각 · 추천 이유\n상세 화면        제목 · 본문 · 출처 · 피드로 돌아가기\n팀 검토 영역     로딩 / 빈 결과 / 오류 상태 시연<\/code><\/pre><p>현재 이름과 카테고리는 시연용이다. 카테고리 ID와 표시 문구는 분리하고, 운영 카테고리는 서버 목록을 사용한다. 초기 관심사 입력은 합의된 화면 범위가 아니므로 MVP에서 제외한다. 필요성이 확인되면 별도 안건으로 검토한다. 기존 가상 독자의 사전 설정은 시연용이며 실제 방문자의 입력값이 아니다. 현재 독자 선택 UI를 회원가입이나 실제 인증으로 설명하지 않는다.<\/p><div class=\"table\"><table><thead><tr><th>화면 또는 상태<\/th><th>필요한 데이터<\/th><th>프론트 처리와 수집<\/th><\/tr><\/thead><tbody><tr><td>독자 선택<\/td><td>reader_id, reader_type, history_status<\/td><td>독자 전환 시 이전 독자의 비동기 응답 무시·체류 종료·새 세션 시작<\/td><\/tr><tr><td>피드 정상<\/td><td>추천 ID, 순위, 기사 요약, 추천 이유, 생성 시각<\/td><td>서버 순서 표시·카드 노출 관찰·클릭 기록<\/td><\/tr><tr><td>상세 정상<\/td><td>기사 ID, 본문, 발행 시각, 출처<\/td><td>본문 표시 성공 후 상세 열림·활성 체류 기록<\/td><\/tr><tr><td>신규 또는 이력 부족<\/td><td>strategy, fallback_reason<\/td><td>실제 대체 이유 표시·모델 추천이라고 표현하지 않음<\/td><\/tr><tr><td>로딩<\/td><td>요청 상태<\/td><td>스켈레톤 표시·아직 표시하지 않은 기사의 노출 생성 금지<\/td><\/tr><tr><td>빈 결과<\/td><td>성공한 응답의 items=[]<\/td><td>다른 카테고리 안내·통신 오류와 구분<\/td><\/tr><tr><td>조회 실패<\/td><td>오류 코드, request_id<\/td><td>재시도 제공·존재하지 않는 데이터를 정상 피드로 표시하지 않음<\/td><\/tr><tr><td>삭제된 기사<\/td><td>상세 404<\/td><td>기사 없음 안내·목록 복귀·상세 열림 기록 금지<\/td><\/tr><\/tbody><\/table><\/div><p>목록으로 돌아오면 독자·필터·추천 ID·스크롤 위치를 가능한 범위에서 복원한다. 상세 화면을 보는 동안 새 추천이 도착해도 기존 클릭 출처를 새 추천 ID로 바꾸지 않는다. 화면 갱신은 명시적인 새로고침 또는 다음 피드 진입 시점부터 시작하는 방안을 제안한다.<\/p><h3 id=\"section-18\">3.2 MVP와 후속 범위<\/h3><p>MVP는 피드·상세·독자 시연·기본 행동 수집·실패 상태다. 검색·북마크·좋아요·댓글·실제 회원가입·독자 분석 대시보드는 후속으로 둔다. 새로운 행동 버튼을 만들기 전, 그 행동을 추천에 어떻게 활용할지 먼저 합의한다.<\/p><h2 id=\"section-20\">4 시스템 전체 흐름<\/h2><pre><code>기사 수집 또는 가상 기사 생성 → 기사 저장소\n                                  ↓\n독자·과거 행동 → 백엔드 API → 후보 기사 조회 → 과거 피처 → CTR 예측 또는 대체 추천\n                     ↓                                      ↓\n                 추천 목록 저장 ← 기사 ID·순위·추천 이유·모델 버전\n                     ↓\n프론트엔드 ← 추천 응답 및 상세 응답\n     ↓\n노출·클릭·상세 열림·활성 체류 → 이벤트 수집 API → 검증·중복 제거 → 원본 저장\n                                                                    ↓\n                              다음 추천 ← 피처 갱신·학습·평가 ← 정제·집계<\/code><\/pre><p>이 그림은 제안한 논리 흐름이다. 저장소 제품, 메시지 큐, 웨어하우스, 모델 서빙 제품의 도입을 확정한 그림이 아니다. 현재는 방문자 조회용 DB와 행동 원본용 Cloud Storage를 구분하고 BigQuery 배치 적재를 우선 추천한다. DB 제품·서비스 분리는 팀과 확정한다. 브라우저가 DB에 직접 접속하거나 DB 자격증명을 보관하지 않는다.<\/p><h3 id=\"section-23\">4.1 사용자가 보는 한 번의 흐름<\/h3><ol><li>프론트는 카테고리·시연 독자 목록을 가져온다. 실제 이용자를 도입하면 인증된 서버 주체와 독자 식별자를 연결한다.<\/li><li>독자 A와 필터를 선택해 추천 생성을 요청한다. 서버는 모델 또는 대체 전략을 선택한다.<\/li><li>서버는 추천 ID와 기사별 순위를 저장한 뒤 요약을 포함해 반환한다. 카드마다 상세 API를 호출하지 않는다.<\/li><li>프론트는 받은 순서로 표시하고 실제 가시성 조건을 만족한 카드만 노출로 기록한다.<\/li><li>링크를 선택하면 클릭을 먼저 큐에 기록하고 상세를 요청한다. 이벤트 전송 때문에 화면 이동을 기다리게 하지 않는다.<\/li><li>본문 표시가 성공하면 상세 방문 ID를 생성하고 상세 열림을 기록한다. 활성 시간은 증가분으로 전송한다.<\/li><li>서버는 이벤트 원본의 Cloud Storage 업로드를 확인한 뒤 수락 응답을 준다. 프론트는 수락·중복 이벤트만 큐에서 제거한다.<\/li><li>정제·집계·모델 갱신 이후 새로운 추천 요청에서 변경된 결과를 제공한다. 갱신 주기는 팀이 정한다.<\/li><\/ol><h2 id=\"section-25\">5 화면과 API 데이터 계약<\/h2><p>공통 제안은 JSON snake_case, 문자열 ID, UTC ISO 8601 시각, 밀리초 단위 시간 길이다. 화면에는 한국 시간으로 표시한다. null은 미측정·해당 없음이며 숫자 0과 구분한다. 계약의 버전은 API 경로와 이벤트 schema_version으로 관리한다.<\/p><div class=\"table\"><table><thead><tr><th>사용자 동작<\/th><th>제안 API<\/th><th>응답과 프론트 처리<\/th><\/tr><\/thead><tbody><tr><td>비로그인 방문 시작<\/td><td>POST /api/v1/visitors/bootstrap<\/td><td>신규 제안·쿠키 확인 또는 발급·서버 독자 컨텍스트 반환·7.6절 참고<\/td><\/tr><tr><td>시작<\/td><td>GET /api/v1/categories 및 GET /api/v1/readers<\/td><td>선택 목록 표시·시연 독자 조회 권한 별도 확인<\/td><\/tr><tr><td>첫 피드·독자 전환·필터 변경·새로고침<\/td><td>POST /api/v1/recommendations<\/td><td>201·새 추천 ID·새 고정 목록<\/td><\/tr><tr><td>다음 페이지<\/td><td>GET /api/v1/recommendations/{id}?cursor=...<\/td><td>200·같은 추천 ID·중복 없는 순위<\/td><\/tr><tr><td>기사 진입<\/td><td>GET /api/v1/articles/{article_id}<\/td><td>200·본문과 출처·404면 기사 없음<\/td><\/tr><tr><td>행동 전송<\/td><td>POST /api/v1/events/batch<\/td><td>200·이벤트별 accepted / duplicate / rejected<\/td><\/tr><\/tbody><\/table><\/div><p>가상 독자 시연의 추천 요청은 reader_id, category_id, limit를 보낸다. 일반 방문자는 7.6절의 쿠키 기반 서버 독자 확인을 적용하고, 본문 reader_id로 다른 독자를 선택할 수 없도록 한다. 요청별 Idempotency-Key를 만들고 동일 요청의 재시도에만 재사용한다. 초기 limit=20, 상한 50, 키 유효기간 24시간은 기존 초안의 제안값이며 확정이 필요하다.<\/p><h3 id=\"section-29\">5.1 피드 응답 예시<\/h3><p>아래는 설명용 축약 예시다. API 계약의 실제 전체 스키마는 백엔드가 관리하고 프론트와 함께 검토한다.<\/p><pre><code>{\n  &quot;data&quot;: {\n    &quot;recommendation_id&quot;: &quot;rec_001&quot;,\n    &quot;reader_id&quot;: &quot;reader_001&quot;,\n    &quot;generated_at&quot;: &quot;2026-10-31T00:00:00.000Z&quot;,\n    &quot;feature_as_of&quot;: &quot;2026-10-30T23:50:00.000Z&quot;,\n    &quot;strategy&quot;: &quot;latest&quot;,\n    &quot;model_version&quot;: null,\n    &quot;fallback_reason&quot;: &quot;insufficient_history&quot;,\n    &quot;items&quot;: [{\n      &quot;rank&quot;: 1,\n      &quot;reason&quot;: {&quot;code&quot;: &quot;LATEST_ARTICLES&quot;, &quot;text&quot;: &quot;최근 발행된 기사부터 보여드려요.&quot;},\n      &quot;article&quot;: {\n        &quot;article_id&quot;: &quot;article_001&quot;,\n        &quot;title&quot;: &quot;설명용 가상 기사&quot;,\n        &quot;summary&quot;: &quot;요약 예시&quot;,\n        &quot;category&quot;: {&quot;category_id&quot;: &quot;technology&quot;, &quot;name&quot;: &quot;IT·과학&quot;},\n        &quot;thumbnail_url&quot;: null,\n        &quot;published_at&quot;: &quot;2026-10-30T23:00:00.000Z&quot;,\n        &quot;content_origin&quot;: &quot;synthetic&quot;\n      }\n    }],\n    &quot;next_cursor&quot;: null\n  },\n  &quot;meta&quot;: {&quot;request_id&quot;: &quot;req_001&quot;}\n}<\/code><\/pre><p>프론트는 strategy와 reason을 설명 문구에 반영한다. 모델 점수가 없으면 점수나 예상 클릭률을 지어내지 않는다. 추천 이유는 모델 내부 설명이 지원되지 않으면 검증 가능한 규칙 설명이나 일반적인 안내로 제한한다.<\/p><h3 id=\"section-33\">5.2 오류와 비동기 처리<\/h3><div class=\"table\"><table><thead><tr><th>상태<\/th><th>처리 원칙<\/th><\/tr><\/thead><tbody><tr><td>400·409<\/td><td>요청 형식·멱등 키 오류 확인·무한 재시도 금지<\/td><\/tr><tr><td>401·403<\/td><td>인증·권한 안내·반복 요청 중단<\/td><\/tr><tr><td>404·410<\/td><td>대상 없음 또는 만료된 추천 안내·필요하면 새 피드 요청<\/td><\/tr><tr><td>429<\/td><td>Retry-After와 재시도 상한 적용<\/td><\/tr><tr><td>500·503·통신 실패<\/td><td>피드 조회는 사용자 재시도·이벤트는 제한된 재전송<\/td><\/tr><\/tbody><\/table><\/div><p>독자 A 조회 직후 B로 전환했을 때 A 응답이 늦게 도착해도 B 화면을 덮지 않아야 한다. 기존 화면 코드에는 요청 순서 확인이 있으며 실제 API 연결 시 취소 또는 요청 세대 확인을 유지한다. 이벤트도 발생 순간의 독자와 추천을 고정한다.<\/p><h2 id=\"section-36\">6 수집할 사용자 행동과 측정 정의<\/h2><h3 id=\"section-37\">6.1 우선 수집할 네 가지<\/h3><div class=\"table\"><table><thead><tr><th>이벤트<\/th><th>제안한 발생 조건<\/th><th>고유 속성<\/th><th>해석할 때 주의할 점<\/th><\/tr><\/thead><tbody><tr><td>article_impression<\/td><td>활성 탭·카드 면적 50% 이상·연속 1초<\/td><td>exposure_id, rank, visible_ratio, visible_ms<\/td><td>눈으로 읽었음을 보장하지 않는 화면 노출<\/td><\/tr><tr><td>article_click<\/td><td>피드 기사 링크 활성화<\/td><td>exposure_id 또는 null, rank, interaction_id<\/td><td>관심 신호이며 본문 읽기 성공과 다름<\/td><\/tr><tr><td>article_view<\/td><td>상세 본문 표시 성공<\/td><td>article_view_id, origin_interaction_id 또는 null<\/td><td>직접 진입도 가능·기존 계약에 추가 제안<\/td><\/tr><tr><td>article_dwell<\/td><td>상세가 보이고 문서 포커스가 있는 동안<\/td><td>article_view_id, sequence, active_time_ms, is_final<\/td><td>체류 증가분·집중도나 완독으로 단정 금지<\/td><\/tr><\/tbody><\/table><\/div><p>50%·1초, 10초 체류 보고는 검증 전 초기값이다. 작은 화면에서 큰 카드가 50% 이상 보일 수 없는 경우를 확인하고 카드 크기 또는 관찰 영역을 조정한다. Intersection Observer는 화면과 요소의 교차를 관찰하는 수단이며 다른 창에 가려지는 상황까지 완벽하게 판정한다고 가정하지 않는다. [S3]<\/p><p>노출은 session_id·recommendation_id·article_id 조합별 1회로 시작한다. 추천 항목은 한 목록 안에서 중복되지 않도록 한다. 재노출 횟수를 연구하려면 이 중복 규칙과 CTR 분모를 함께 변경해야 한다. 세션은 탭별로 만들고 독자 전환 또는 마지막 활동 이후 30분이 지나면 새 ID를 부여하는 방안을 제안한다.<\/p><h3 id=\"section-41\">6.2 빠른 클릭과 직접 진입<\/h3><p>노출 1초가 되기 전에 클릭할 수 있다. 이때 클릭은 그대로 저장하고 exposure_id=null과 연결된 추천·기사·순위를 남긴다. 조건을 만족하지 않은 article_impression을 가짜로 생성하지 않는다. 상세를 직접 열면 추천 ID와 클릭 ID가 null일 수 있으며 피드 클릭을 만들지 않는다.<\/p><p>키보드 Enter, 보조 버튼, 새 탭 열기도 수집 대상으로 검토한다. 한 동작을 여러 DOM 핸들러에서 이중 기록하지 않도록 interaction_id를 사용한다. 새 탭 상세에 출처를 넘기는 방식은 라우트 또는 제한된 전달 토큰으로 설계하고 원래 추천 출처를 검증한다.<\/p><h3 id=\"section-44\">6.3 체류와 전송 실패<\/h3><p>활성 시간 10초마다 증가분을 전송하고 탭 숨김·포커스 상실·독자 전환·상세 이탈 때 남은 증가분을 기록한다. 10초·10초·3초를 수락하면 23,000ms다. 브라우저 지연이 발생해도 숨겨진 시간 전체를 읽은 시간으로 계산하지 않는다. 비활성 사용자 판별을 위한 유휴 기준은 후속 실험으로 정한다.<\/p><p>평상시에는 소량 배치와 주기적 flush를 사용한다. 초기 제안은 최대 20건 또는 5초, 큐 상한 500건이며 부하 확인 후 결정한다. 종료 직전 sendBeacon은 보조 수단이다. true 반환은 큐에 들어갔다는 뜻이며 서버 적재 성공을 보장하지 않는다. 다음 실행에서 미확인 이벤트를 같은 ID로 재전송하고 서버에서 중복 제거한다. [S4]<\/p><p>큐는 인증된 사용자 범위로 격리한다. 로그아웃·삭제 요청·독자 전환 때 다른 독자의 이벤트로 바꾸지 않는다. 큐 만료·용량 초과 시 폐기 건수는 별도 품질 로그로 남긴다. 수집 동의·보관 기간·삭제 범위는 실제 이용자 도입 전에 팀이 정책으로 확정한다.<\/p><h3 id=\"section-48\">6.4 후속 행동<\/h3><p>스크롤 최대 도달률은 0~1로 추가할 수 있으나 완독 여부와 같지 않다. 카테고리 변경은 명시적인 탐색 신호이며 모든 기사 이벤트에 article_id를 강제하지 않도록 별도 이벤트 스키마를 정의한다. 북마크·좋아요·관심 없음은 해당 UI가 생긴 뒤 추가한다. 마우스 이동 전체·키 입력 전체·이름·이메일·정밀 위치는 초기 추천 연구 범위에서 수집하지 않는 것을 제안한다.<\/p><h3 id=\"section-50\">6.5 이벤트 로그를 저장하는 전체 흐름<\/h3><p>현재 실시간 추천 반영을 목표로 하지 않는다는 전제에서 ‘프론트엔드 → 행동 수집 API → Cloud Storage 원본 저장 → BigQuery 배치 적재’를 우선 추천한다. 팀 회의에서 검토할 권장안이며 인프라 구축을 확정하거나 완료한 것은 아니다. Pub/Sub는 초기 필수 구성에서 제외한다. 방문자 표식 조회는 별도 영속 DB를 사용한다. 이벤트 수집·저장은 아직 구현하지 않았으며, 현재 구현된 쿠키 방문자 식별과 구분한다.<\/p><pre><code>브라우저의 행동 발생\n  ↓ event_id 생성·전송 대기 큐\n같은 출처 POST /api/v1/events/batch\n  ↓ 쿠키 표식으로 서버 독자 확인\n수집 API가 스키마·추천 출처·권한 검증\n  ↓ 서버 received_at 부여·재시도용 배치 식별 확인\nCloud Storage에 원본 JSONL 파일 업로드 완료\n  ↓ accepted / duplicate / rejected 응답\n브라우저가 수락·중복 이벤트만 대기 큐에서 제거\n\n후속 분석 경로\nCloud Storage Bronze → 배치 적재 → BigQuery 원본 → Silver 정제 → Gold 피처·CTR 표본<\/code><\/pre><p>행동 로그는 클릭·노출·읽기 상태를 분석하기 위한 데이터다. 서버 오류와 응답 시간을 확인하는 운영 로그와 구분한다. 운영 로그는 Cloud Logging으로 관리하고, 행동 원본은 위 저장 경로에서 스키마와 재전송 규칙을 관리하는 방안을 제안한다. 동작 확인을 위해 Cloud Logging에 쿠키 원문이나 이벤트 전체를 무조건 출력하지 않는다.<\/p><h3 id=\"section-54\">6.6 Cloud Storage와 BigQuery 배치를 추천하는 이유<\/h3><div class=\"table\"><table><thead><tr><th>현재 조건 또는 요구<\/th><th>권장안이 맞는 이유<\/th><th>감수할 부담<\/th><\/tr><\/thead><tbody><tr><td>실시간 추천 반영은 초기 목표가 아님<\/td><td>적재·정제·피처 생성을 일정 주기로 실행할 수 있음<\/td><td>최신 행동이 추천에 반영되기까지 지연<\/td><\/tr><tr><td>수집 규칙과 피처 설계가 바뀔 수 있음<\/td><td>원본 파일을 보관하면 새 규칙으로 재처리 가능<\/td><td>파일 보관·삭제·버전 관리 필요<\/td><\/tr><tr><td>데이터 흐름을 팀별로 연결해야 함<\/td><td>프론트 수집·백엔드 검증·데이터 정제·ML 학습의 입출력이 명확함<\/td><td>파일 스키마와 전달 계약 합의 필요<\/td><\/tr><tr><td>Pub/Sub 없이 시작하고자 함<\/td><td>Cloud Storage 파일을 BigQuery로 배치 적재할 수 있음<\/td><td>적재 작업·재시도·완료 상태를 직접 관리<\/td><\/tr><tr><td>학습 입력까지의 추적이 중요함<\/td><td>파일·작업 ID·event_id로 원본에서 표본까지 연결 가능<\/td><td>중복·충돌·지연 데이터 처리 필요<\/td><\/tr><\/tbody><\/table><\/div><p>이는 요구사항에 따른 설계 판단이며 다른 구성보다 비용이나 성능이 우수하다고 측정한 결론은 아니다. 먼저 소량의 실제 이벤트로 끝까지 검증한다. Cloud Storage 업로드 완료는 수집 완료, BigQuery 적재·정제 완료는 분석 준비 완료로 구분한다. [S10]<\/p><p>Bronze·Silver·Gold는 서비스 이름이 아니라 가공 단계다. Bronze는 수집 API의 기본 검증과 서버 시각 부여를 거친 원본에 가까운 이벤트 파일, Silver는 중복·충돌·오류를 처리한 데이터, Gold는 독자별 집계·CTR 표본·모델 피처다. 모든 단계를 별도 제품으로 만들 필요는 없다. Silver와 Gold는 BigQuery 테이블로 시작할 수 있다.<\/p><p>방문자 DB는 쿠키 토큰 해시와 독자 ID의 빠른 연결 조회를 맡고, Cloud Storage는 행동 원본 보관을 맡는다. 방문자 DB에 전체 행동을 반드시 중복 저장할 필요는 없다. BigQuery도 방문자 인증 조회용 DB로 사용하지 않는다.<\/p><h3 id=\"section-59\">6.6.1 로그 수집 서버와 대안 비교<\/h3><p>‘별도의 로깅 서버’는 행동 수집을 담당하는 API 서비스다. 별도 VM이나 메시지 브로커가 반드시 필요하다는 뜻은 아니다. 초기에는 기존 백엔드 안의 전용 모듈·엔드포인트로 두거나, 독립 배포가 필요하면 Cloud Run 서비스로 분리할 수 있다. 서비스 분리 여부는 담당자와 트래픽 요구에 따라 결정한다.<\/p><div class=\"table\"><table><thead><tr><th>구성 후보<\/th><th>역할과 도입 조건<\/th><th>주의할 점<\/th><\/tr><\/thead><tbody><tr><td>Cloud Run → Firestore<\/td><td>DB가 미정이고 관리형 문서 DB로 시작할 때의 후보<\/td><td>event_id를 문서 키로 사용하더라도 본문 충돌 검증·조회·적재 로직 필요<\/td><\/tr><tr><td>Cloud Run → Cloud SQL<\/td><td>팀에서 이미 관계형 DB를 선택했거나 제약·관계 조회가 중요할 때의 후보<\/td><td>event_id UNIQUE와 트랜잭션·연결 수·인스턴스 운영 검토<\/td><\/tr><tr><td>Cloud Run → BigQuery 직접 기록<\/td><td>분석 가용 지연을 줄이고 중간 DB를 생략할 때의 대안<\/td><td>Storage Write API 실패·재시도·중복 제거를 수집 경로에서 설계<\/td><\/tr><tr><td>Cloud Run → Cloud Storage → BigQuery<\/td><td>현재 우선 권장안·실시간 반영 없이 원본 보관과 배치 학습<\/td><td>불변 파일·적재 작업 ID·작은 파일 통합·배치 주기 관리<\/td><\/tr><tr><td>Cloud Run → Pub/Sub → BigQuery<\/td><td>수집과 적재 장애를 분리할 필요가 생긴 뒤의 확장 후보<\/td><td>현재 필수 구성 아님·추가 운영과 중복 처리 필요<\/td><\/tr><\/tbody><\/table><\/div><p>Cloud Storage 배치 경로를 우선 제안하고 DB 우선 저장·BigQuery 직접 기록은 요구가 달라질 때 비교할 대안으로 둔다. 실시간 반영이나 유입 급증에 따른 장애 분리가 필요해지면 Pub/Sub를 재검토한다. 상세 대안 비교는 gcp-behavior-logging-research.md를 참고한다. [S9][S10][S11]<\/p><h3 id=\"section-63\">6.7 저장 데이터와 성공 응답 기준<\/h3><div class=\"table\"><table><thead><tr><th>데이터 묶음<\/th><th>저장할 값과 규칙<\/th><\/tr><\/thead><tbody><tr><td>이벤트 식별<\/td><td>event_id, schema_version, event_type. 한 행동의 재시도는 같은 ID·같은 본문<\/td><\/tr><tr><td>독자와 세션<\/td><td>쿠키로 서버가 결정한 reader_id, 프론트가 만든 session_id. 토큰 자체는 저장 금지<\/td><\/tr><tr><td>기사와 추천 출처<\/td><td>article_id, recommendation_id nullable, rank 및 exposure_id 등. 서버의 추천 항목과 대조<\/td><\/tr><tr><td>시간<\/td><td>클라이언트 occurred_at과 서버 received_at을 분리. UTC 시각·체류는 밀리초<\/td><\/tr><tr><td>출처<\/td><td>browser / simulator / test 등 인증된 발신 경로와 독자 종류 구분<\/td><\/tr><tr><td>종류별 속성<\/td><td>노출 비율·지속 시간, 클릭 interaction_id, 상세 article_view_id, 체류 sequence·증가분<\/td><\/tr><\/tbody><\/table><\/div><p>일반 방문자의 reader_id는 요청 본문만으로 결정하지 않는다. 기존 JSON의 reader_id는 설명용 시연·내부 저장 예시다. 쿠키와 본문 ID가 충돌하거나 추천 소유자가 다르면 거절한다. 정의되지 않은 이벤트 종류·속성, 잘못된 시간 단위·크기, 과도한 배치는 수집 경계에서 거절한다. 실제 사용자 IP·쿠키 원문·서비스 계정 키를 학습 이벤트에 넣지 않는다.<\/p><p>accepted는 ‘유효 이벤트가 들어 있는 원본 파일의 Cloud Storage 업로드 성공을 확인했다’는 뜻으로 정의한다. 메모리나 Cloud Run 로컬 디스크에만 넣고 수락하지 않는다. 요청 배치별 batch_id를 발급하고 재시도에는 같은 batch_id와 같은 이벤트 본문을 사용한다. 배치 전송 단위는 프론트 20건 또는 5초 등 기존 제안과 함께 검증 후 확정한다.<\/p><p>서버는 독자 범위와 batch_id에서 결정한 고정 객체 이름으로 조건부 생성을 사용한다. 기존 객체가 있으면 비교용 요청 해시로 동일 요청인지 검사하고, 같으면 duplicate, 다르면 BATCH_ID_CONFLICT로 거절한다. 해시는 최초 수신 시각처럼 재시도 때 달라지는 서버 메타데이터를 제외한 정규화된 요청에 대해 계산한다. 기존 객체를 비교할 권한 또는 별도 멱등 기록 저장소가 필요하며, 객체 존재만 보고 재시도를 성공 처리하지 않는다. Cloud Storage의 ifGenerationMatch=0 같은 생성 전제조건을 후보로 사용한다. [S12]<\/p><p>파일 경로는 예를 들어 bronze/events/received_date=2026-10-29/reader_bucket=ab/batch-UUID.jsonl 형태로 설계할 수 있다. 객체 이름에는 쿠키 토큰을 넣지 않는다. 날짜를 경로에 쓰면 재시도 시 날짜가 달라져도 같은 객체를 찾도록 최초 확정한 경로 또는 서버 멱등 매핑을 유지해야 한다. 저장된 파일은 덧붙여 수정하지 않고 새 객체로 보관한다.<\/p><p>API 배치는 이벤트별 결과를 반환한다. 검증에서 탈락한 항목은 rejected, 업로드에 포함한 항목은 업로드 확인 후 accepted다. 유효한 항목들의 파일 저장에 실패하면 그 항목들을 재시도 대상으로 반환한다. 응답 유실 시에도 배치 내용과 ID를 유지해 재전송한다. 첫 버전에서는 부분 수락 배치 재시도 시 이미 거절된 항목을 제외해 새 본문을 만드는 대신 원래 요청을 유지하도록 계약을 단순화한다.<\/p><p>서로 다른 batch_id로 같은 event_id가 들어오면 Bronze에는 중복이 남을 수 있다. 따라서 수집 단계의 duplicate는 동일 배치 재시도 확인이며 이벤트 전체의 중복 제거 완료를 의미하지 않는다. Silver에서는 event_id와 정규화된 이벤트 본문을 비교해 동일 행동을 한 번만 계산한다. 같은 ID·다른 본문은 EVENT_ID_CONFLICT로 격리하고 학습에서 제외한다. received_at은 본문 동일성 비교에서 제외하며 원본에는 첫 수신·재수신 근거를 보존한다.<\/p><h3 id=\"section-71\">6.8 BigQuery 배치 적재와 운영<\/h3><p>Cloud Storage에서 BigQuery로 자동 전송된다고 가정하지 않는다. 배치 작업이 미처리 객체 목록을 확정하고 BigQuery load job을 실행한다. 객체 이름·generation·적재 작업 ID·처리 상태를 기록한 manifest를 관리하고 적재 성공을 확인한 뒤 상태를 갱신한다. 재실행 시 같은 파일이 중복 반영되지 않게 작업 ID와 정제 규칙을 유지한다. 늦게 업로드된 파일은 이전 날짜 경로라도 미처리 객체이면 다음 작업에서 발견해야 한다.<\/p><p>처음에는 수동 실행으로 검증하고, 후속으로 Cloud Scheduler와 Cloud Run Job 등 주기 실행 구성을 검토한다. 시간 단위·일 단위 등 적재 주기, JSONL 형식·압축 여부·파일 크기, manifest 저장 위치는 데이터팀과 확정한다. 요청마다 작은 파일이 생기면 적재 시 여러 파일을 묶거나 별도 파일 통합 단계를 검토한다. 파일마다 load job을 남발하지 않으며 데이터량을 측정해 조정한다. 이 구조가 언제나 저렴하다고 가정하지 않는다. [S10]<\/p><p>수집 API 거절·업로드 실패, 브라우저 큐 폐기, 원본 파일·이벤트 수, 미처리 파일 나이, 적재 성공·실패·충돌 건수를 감시한다. 삭제 기능을 확장하면 방문자 DB뿐 아니라 Cloud Storage 원본·BigQuery·집계의 삭제 범위도 정한다. 원본 보관 30일은 논의안이며 실제 보관 정책·만료 설정은 미정이다.<\/p><p>현재 방문자 SQLite는 로컬 검증용이다. Cloud Run의 기본 파일시스템은 인스턴스 종료 뒤 유지되지 않으므로 파일을 여기에 모아둔 채 수집 완료로 처리하지 않는다. 배포 시 PORT와 0.0.0.0 바인딩, HTTPS·동일 출처 라우팅, 방문자 영속 DB 전환이 필요하다. 서비스 계정 키는 브라우저에 넣지 않고 서버의 권한을 수집용과 분석용으로 나눈다. [S11]<\/p><h3 id=\"section-76\">6.9 팀별 작업과 로그 저장 수용 조건<\/h3><div class=\"table\"><table><thead><tr><th>담당<\/th><th>작업<\/th><th>확인할 실제 결과<\/th><\/tr><\/thead><tbody><tr><td>프론트<\/td><td>합의한 이벤트 생성·배치·재시도·독자별 큐<\/td><td>클릭 1건의 event_id와 서버 응답 연결<\/td><\/tr><tr><td>백엔드<\/td><td>쿠키 독자 확인·스키마·추천 소유 검증·객체 업로드 확인<\/td><td>동일 배치 재시도는 한 객체·이벤트 중복은 Silver에서 제거<\/td><\/tr><tr><td>데이터·ML<\/td><td>정제·BigQuery 적재·라벨·피처<\/td><td>원본 행동에서 학습 표본까지 ID로 추적·미래 정보 제외<\/td><\/tr><tr><td>인프라<\/td><td>배포·권한·방문자 DB·원본 보관·적재 지연 감시<\/td><td>인스턴스 재시작 후 데이터 유지·실패 원인 확인<\/td><\/tr><\/tbody><\/table><\/div><p>검증은 클릭 한 건을 Cloud Storage 원본 파일에서 읽는 것으로 시작한다. 같은 batch_id를 두 번 보내면 한 객체로 수렴하고, 같은 배치 ID의 다른 본문은 충돌로 거절해야 한다. 다른 배치의 동일 event_id는 Silver에서 한 건이어야 하고 본문 충돌은 격리되어야 한다. 다른 독자의 추천 ID는 저장되지 않아야 한다. 업로드 실패 시 accepted를 반환하지 않아야 한다. 이후 적재 중단·응답 유실·날짜를 넘긴 재시도·늦은 파일 도착을 재현하고 manifest·원본·BigQuery 건수를 대조한다. 이 경로는 아직 구현·배포하지 않은 설계안이다.<\/p><h2 id=\"section-79\">7 데이터 구조와 식별자<\/h2><h3 id=\"section-80\">7.1 논리 저장 구조<\/h3><div class=\"table\"><table><thead><tr><th>데이터<\/th><th>키와 주요 필드<\/th><th>관계와 책임<\/th><\/tr><\/thead><tbody><tr><td>readers<\/td><td>reader_id PK, reader_type, created_at, last_seen_at<\/td><td>synthetic / anonymous / registered 구분·식별 정보 보관<\/td><\/tr><tr><td>visitor_tokens<\/td><td>token_hash PK, reader_id FK, created_at, expires_at, revoked_at nullable<\/td><td>브라우저 쿠키의 임의 토큰과 서버 독자 연결·원문 토큰 저장 금지<\/td><\/tr><tr><td>articles<\/td><td>article_id PK, category_id, published_at, title, body, content_origin, source_url<\/td><td>실제 수집 기사와 창작 기사 구분·수집 담당<\/td><\/tr><tr><td>sessions<\/td><td>session_id PK, reader_id FK, started_at, ended_at<\/td><td>탭별·독자별 이용 단위<\/td><\/tr><tr><td>recommendations<\/td><td>recommendation_id PK, reader_id FK, generated_at, feature_as_of, strategy, model_version<\/td><td>어떤 입력 시점과 정책으로 만든 추천인가<\/td><\/tr><tr><td>recommendation_items<\/td><td>복합 PK recommendation_id + article_id, rank, reason_code, served_at nullable<\/td><td>추천별 순위 UNIQUE·후보와 순서 고정·실제 응답 항목 구분<\/td><\/tr><tr><td>events 논리 레코드<\/td><td>event_id 논리 식별자, event_type, reader_id, session_id, article_id, recommendation_id, occurred_at, received_at, source, properties<\/td><td>Bronze 원본 파일·Silver 중복 제거·서버 수신 시각<\/td><\/tr><tr><td>reader_features<\/td><td>reader_id + feature_as_of + feature_version<\/td><td>과거 행동에서 계산한 관심사·누적값<\/td><\/tr><tr><td>training_samples<\/td><td>sample_id, 추천·기사·독자 키, prediction_time, label_window_end, label, feature_version<\/td><td>재현 가능한 학습 입력·라벨<\/td><\/tr><\/tbody><\/table><\/div><p>PK는 행 식별 키, FK는 다른 데이터의 ID를 연결하는 키다. 초기 DB 제품은 백엔드가 제안하며 위 표는 물리 DDL이 아닌 논리 구조다. events는 DB 테이블이 필수라는 뜻이 아니며 현재 권장안에서는 Cloud Storage 원본과 BigQuery 정제 레코드로 구현한다. BigQuery의 논리 키만으로 중복이 자동 제거되지는 않는다. 추천과 이벤트 조회용 인덱스는 reader_id+occurred_at, recommendation_id+article_id를 후보로 검토한다. JSON 속성은 유연하게 시작하되 반복 분석하는 필드는 정제 테이블에서 정형화한다.<\/p><h3 id=\"section-83\">7.2 공통 이벤트 예시<\/h3><pre><code>{\n  &quot;schema_version&quot;: 2,\n  &quot;event_id&quot;: &quot;evt_click_001&quot;,\n  &quot;event_type&quot;: &quot;article_click&quot;,\n  &quot;reader_id&quot;: &quot;reader_001&quot;,\n  &quot;session_id&quot;: &quot;session_001&quot;,\n  &quot;article_id&quot;: &quot;article_001&quot;,\n  &quot;recommendation_id&quot;: &quot;rec_001&quot;,\n  &quot;occurred_at&quot;: &quot;2026-10-31T00:00:05.000Z&quot;,\n  &quot;source&quot;: &quot;browser&quot;,\n  &quot;properties&quot;: {\n    &quot;rank&quot;: 1,\n    &quot;exposure_id&quot;: &quot;exposure_001&quot;,\n    &quot;interaction_id&quot;: &quot;interaction_001&quot;\n  }\n}<\/code><\/pre><p>schema_version=2는 본 제안의 변경을 식별하는 예시이며 배포된 버전이 아니다. reader_type은 독자 테이블에서 확인하고 source는 browser / simulator / test 등을 인증된 발신자와 대조한다. 별도 실행 메타데이터 run_id를 시뮬레이션에 부여해 재현 가능하게 한다. 모든 예시 ID는 설명용이며 실제 구현은 충돌하지 않는 UUID 등의 ID를 사용한다. received_at은 클라이언트가 아니라 서버가 부여한다.<\/p><h3 id=\"section-86\">7.3 정합성과 보관<\/h3><p>서버는 수집 경계에서 이벤트 종류별 필드·형식·권한을 검증한다. 독자 A의 추천을 독자 B가 자신의 이벤트로 보낼 수 없게 한다. 추천 항목과 rank를 서버의 저장 목록에 대조하고, 동일 event_id의 본문 충돌은 Silver에서 격리한다. 체류는 event_id 외에 article_view_id+sequence의 중복도 Silver에서 제거한다. 수집 API의 즉시 중복·충돌 판정 범위는 6.7절의 동일 배치 재시도다.<\/p><p>추천 이력·원본 이벤트·중복 키의 초기 보관 기간은 30일을 논의안으로 둔다. 이는 법적 기준이 아니라 프로젝트 운영 제안이다. 추천 이력이 이벤트보다 먼저 삭제되면 추적이 끊기므로 연결 보관 기간을 함께 정한다. 중복 키를 지운 뒤 오래된 큐 이벤트가 재전송되는 경우에는 수락 가능 기간을 검사한다. 삭제 기능을 도입할 때 원본·집계·학습 표본까지 추적하는 범위를 결정한다.<\/p><h3 id=\"section-89\">7.4 로그인 없이 재방문자를 알아보는 방법<\/h3><p>로그인하지 않은 방문자도 이전 행동에 연결할 수 있다. 제안 방식은 브라우저 쿠키에 임의의 방문자 식별 토큰을 저장하고, 서버 DB에서 그 토큰을 독자 ID와 연결하는 것이다. 다음 방문 때 브라우저가 같은 토큰을 보내면 서버가 이전 독자 기록을 찾는다. 쿠키의 저장·전송은 브라우저가 처리한다. [S5]<\/p><p>다만 확인하는 것은 ‘같은 사람’이라는 신원이 아니라 ‘같은 쿠키를 가진 브라우저 프로필’이다. 한 사람이 휴대폰과 PC를 쓰면 서로 다른 익명 독자가 되고, 여러 사람이 같은 브라우저 프로필을 공유하면 행동이 섞일 수 있다. 사용자에게는 ‘이 브라우저의 방문자 정보’라는 표현이 더 정확하다.<\/p><p>멘토가 말한 ‘쿠키에 데이터를 저장해서 보내는 방식’에는 두 가지가 있다. 하나는 관심사나 클릭 목록을 쿠키 값에 직접 넣는 방식이고, 다른 하나는 조회용 표식만 쿠키에 넣고 서버에서 데이터를 찾는 방식이다. 우리 프로젝트에는 두 번째를 제안한다. 서버 DB에 행동을 쌓아 학습하고, 여러 이벤트를 추천 결과까지 연결하기가 쉽기 때문이다.<\/p><pre><code>브라우저의 쿠키                서버의 방문자 연결표           서버의 행동 DB\n임의 토큰 K7...        →       K7...의 해시 → reader_042  →  클릭·노출·체류 기록\n\n오늘 방문     토큰 없음 → 서버가 토큰 발급 → 브라우저가 저장\n내일 방문     같은 토큰 자동 전송 → reader_042 조회 → 기존 독자와 연결<\/code><\/pre><p>여기서 토큰은 실제 운영 값이 아닌 설명용이다. ‘번호표는 브라우저에, 번호표에 해당하는 이용 기록은 서버에’ 두는 구조다. 이름이나 이메일을 몰라도 같은 브라우저의 이전 행동에 연결할 수 있다.<\/p><h3 id=\"section-95\">7.5 어디에 무엇을 저장할지<\/h3><div class=\"table\"><table><thead><tr><th>위치<\/th><th>저장할 값<\/th><th>저장하지 않을 값 또는 역할<\/th><\/tr><\/thead><tbody><tr><td>브라우저의 방문자 쿠키<\/td><td>서버가 생성한 추측하기 어려운 임의 토큰<\/td><td>기사별 전체 클릭 이력·이름·이메일·모델 피처를 넣지 않음<\/td><\/tr><tr><td>브라우저의 탭 저장소<\/td><td>session_id, 필터 등 임시 화면 상태<\/td><td>장기 방문자 신원 확인 수단으로 사용하지 않음<\/td><\/tr><tr><td>브라우저의 IndexedDB 등<\/td><td>필요 시 미전송 이벤트 큐·독자별 격리<\/td><td>행동의 최종 저장소가 아니며 만료·삭제 규칙 필요<\/td><\/tr><tr><td>서버 readers<\/td><td>anonymous 독자 ID, 생성·마지막 방문·만료 시각<\/td><td>실명 없이도 생성 가능<\/td><\/tr><tr><td>서버 visitor_tokens<\/td><td>토큰 해시, 독자 ID, 만료·폐기 시각<\/td><td>원문 토큰을 로그·DB·학습 자료에 남기지 않음<\/td><\/tr><tr><td>서버 events<\/td><td>독자별 노출·클릭·상세 열림·체류<\/td><td>쿠키 토큰 대신 내부 reader_id로 연결<\/td><\/tr><tr><td>서버 피처·추천 테이블<\/td><td>이력 기반 집계·추천 목록·모델 버전<\/td><td>브라우저가 계산해 보낸 값을 그대로 신뢰하지 않음<\/td><\/tr><\/tbody><\/table><\/div><p>reader_id는 DB 안에서 기록을 연결하는 키다. 방문자 토큰은 그 독자 컨텍스트를 요청과 연결하는 값이다. session_id는 한 번의 이용을 묶는 값이므로 다음 날 달라져도 reader_id는 유지될 수 있다. 세 ID를 하나로 사용하지 않는다.<\/p><h3 id=\"section-98\">7.6 첫 방문부터 재방문까지의 요청 흐름<\/h3><p>다음 API는 신규 제안이며 현재 구현되어 있지 않다. 일반 방문자 경로와 가상 독자 시연 경로를 구분한다.<\/p><ol><li>화면 시작 시 POST /api/v1/visitors/bootstrap을 호출한다. 익명 개인화 수집을 허용한 상태에서만 지속 식별자를 발급하는 정책을 초기 제안으로 둔다. 동의가 필요한 범위와 안내는 실제 이용자 도입 전에 별도 검토한다.<\/li><li>서버는 쿠키가 없으면 안전한 난수 토큰과 anonymous 독자 레코드를 생성한다. visitor_tokens에 토큰의 해시와 reader_id를 저장하고 응답의 Set-Cookie로 원문 토큰을 전달한다.<\/li><li>응답 본문에는 화면에 필요한 reader_id, reader_type, 생성·최근 방문·만료 시각만 반환한다. 초기 관심사는 요청하거나 저장하지 않는다. Set-Cookie로 설정한 HttpOnly 토큰을 화면 JavaScript가 읽어 처리할 필요는 없다.<\/li><li>추천·기사·이벤트 API 호출 때 브라우저가 범위에 맞는 쿠키를 보낸다. 서버는 유효한 토큰으로 독자를 확인하고 그 독자의 과거 이력을 조회한다.<\/li><li>다음 날 같은 브라우저에서 bootstrap을 호출하면 같은 독자 ID를 반환한다. 새로운 session_id를 만들되 과거 events는 같은 reader_id 아래에 남긴다.<\/li><li>토큰이 만료·폐기되었거나 알 수 없는 값이면 새로운 방문자로 처리한다. 알 수 없는 클라이언트 토큰을 그대로 서버의 새 독자 키로 채택하지 않는다.<\/li><\/ol><p>HTTPS와 동일 출처 API를 가정한 헤더 예시는 다음과 같다. 실제 토큰은 아래 문자열보다 충분히 길고 예측 불가능하게 생성한다.<\/p><pre><code>첫 방문 서버 응답\nSet-Cookie: __Host-news_visitor=&lt;random-token&gt;; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax\n\n다음 API 요청에서 브라우저가 붙이는 헤더\nCookie: __Host-news_visitor=&lt;random-token&gt;<\/code><\/pre><p>30일은 논의용 쿠키 유효기간이며 영구 식별 보장이 아니다. Secure는 HTTPS 전송, HttpOnly는 화면 스크립트의 직접 접근 제한, SameSite=Lax는 교차 사이트 요청에서의 전송 제한에 관계된다. __Host- 접두사 조건에 맞게 Domain을 설정하지 않고 Path=/와 Secure를 사용한다. 이 설정은 전체 보안 검증을 대신하지 않는다. [S5][S6]<\/p><p>일반 방문자의 추천·이벤트 API는 본문 reader_id를 독자 선택 권한으로 취급하지 않는다. 가능하면 요청에서 생략하고 쿠키로 서버가 결정한다. 기존 시연 계약 호환 때문에 포함한다면 쿠키의 독자와 일치하는지 검사한다. 이 문서의 reader_id를 가진 JSON은 가상 독자 시연 또는 내부 저장 형식의 예시로 해석하고, 공개 API 명세에서는 두 경로를 분리한다.<\/p><p>익명 토큰 소유는 계정 로그인이나 실명 인증을 뜻하지 않는다. 내 기록 조회·초기화 등 익명 기능의 범위도 좁게 설계하고, 상태를 변경하는 API에는 Origin 확인 등 CSRF 대책을 적용한다. 토큰만 알면 다른 사람의 민감한 계정 데이터에 접근하는 구조를 만들지 않는다. 식별 응답과 개인화 피드는 공유 캐시에 섞이지 않게 Cache-Control: private, no-store 등 응답 정책을 검토한다.<\/p><h3 id=\"section-106\">7.7 프론트와 백엔드 배포 주소가 중요한 이유<\/h3><p>프론트와 API를 같은 출처로 제공하는 구성을 우선 제안한다. 예를 들어 https://news.example.com 화면이 같은 주소의 /api/v1/...를 호출하도록 리버스 프록시를 둔다. 이 주소는 설명용이다. 동일 출처 fetch는 기본적으로 쿠키를 포함할 수 있어 연결이 단순하다. [S7]<\/p><p>프론트가 GitHub Pages의 github.io 주소이고 API가 전혀 다른 사이트라면 교차 사이트 쿠키 문제가 생긴다. credentials: include, 정확한 허용 Origin과 자격증명 CORS 설정이 필요하며 SameSite=Lax 쿠키는 교차 사이트 fetch로 보내지지 않는다. SameSite=None; Secure를 설정해도 브라우저의 제3자 쿠키 제한을 해결한다고 보장할 수 없다. 쿠키 설정 하나로 해결하려 하기보다 같은 출처 /api 프록시 또는 배포 도메인 구성을 팀에서 정한다. 정적 GitHub Pages 자체가 백엔드 역할을 하거나 서버 방문자 쿠키를 발급하는 것은 아니다. [S5][S7][S8]<\/p><p>localStorage에 방문자 ID를 저장해서 API 본문으로 보내는 방법도 간단한 시연에는 가능하다. 하지만 화면 스크립트가 값을 읽고 바꿀 수 있어 서버 인증 근거로 그대로 믿을 수 없다. 쿠키도 요청을 보내는 자의 실명을 증명하지는 않는다. 우리 제안은 서버 발급 토큰·서버 연결표·요청 검증을 결합하는 방식이며, 브라우저 지문이나 IP로 쿠키 삭제를 우회해 다시 연결하는 방법은 사용하지 않는다.<\/p><h3 id=\"section-110\">7.8 재방문 인식의 한계와 초기화<\/h3><div class=\"table\"><table><thead><tr><th>상황<\/th><th>같은 익명 독자로 연결할 수 있는가<\/th><th>처리 제안<\/th><\/tr><\/thead><tbody><tr><td>같은 브라우저 프로필·유효한 쿠키 유지<\/td><td>가능<\/td><td>기존 reader_id·새 session_id<\/td><\/tr><tr><td>쿠키 삭제·만료·저장 차단<\/td><td>보장 불가<\/td><td>새 독자 또는 비개인화 기본 피드<\/td><\/tr><tr><td>시크릿 창 종료 후 새 방문<\/td><td>보장 불가<\/td><td>저장소 수명에 따라 새 독자<\/td><\/tr><tr><td>다른 기기·다른 브라우저·다른 프로필<\/td><td>자동 연결 불가<\/td><td>별도 독자·향후 로그인 연결은 별도 설계<\/td><\/tr><tr><td>여러 사람이 같은 브라우저 공유<\/td><td>사람 구분 불가<\/td><td>‘이 브라우저의 추천 초기화’ 제공<\/td><\/tr><tr><td>브라우저의 저장소 정리·추적 방지<\/td><td>보장 불가<\/td><td>쿠키 기간을 재방문 보장 기간으로 표현하지 않음<\/td><\/tr><tr><td>쿠키는 있지만 서버 기록이 만료됨<\/td><td>이력 복구 불가<\/td><td>기본 추천·새 기록 시작 안내<\/td><\/tr><\/tbody><\/table><\/div><p>브라우저의 추적 방지와 저장소 정책도 수명을 제한할 수 있다. 특히 스크립트 저장소로 옮긴다고 지속 식별이 보장되지 않는다. 정책마다 조건이 다르므로 ‘Safari에서 모든 쿠키는 무조건 7일’처럼 단정하지 않는다. [S8]<\/p><p>UI에는 ‘이 브라우저의 추천 기록 초기화’를 후속 기본 기능으로 제안한다. 단순 쿠키 삭제는 브라우저와 서버의 연결만 끊으며 서버의 과거 이벤트까지 자동 삭제하지 않는다. 기록 삭제를 제공한다면 쿠키를 지우기 전에 현재 토큰으로 삭제·집계 무효화 작업을 요청하고 처리 범위를 안내해야 한다. 쿠키가 이미 사라지면 해당 익명 기록의 소유를 다시 증명하기 어렵다는 한계도 명시한다.<\/p><p>지속 식별을 거부하거나 저장소를 사용할 수 없는 방문자는 기본 피드를 계속 볼 수 있게 한다. 재방문 개인화가 이어지지 않는다는 점을 설명하고 브라우저 지문으로 대체하지 않는다. 로그인 기능을 추가하더라도 과거 익명 이력을 계정에 무조건 합치지 않으며, 연결 동작·동의·공용 브라우저·로그아웃 후 토큰 교체를 별도로 정한다.<\/p><h3 id=\"section-115\">7.9 담당별 작업과 검증<\/h3><div class=\"table\"><table><thead><tr><th>담당<\/th><th>추가 작업<\/th><th>완료 확인<\/th><\/tr><\/thead><tbody><tr><td>프론트<\/td><td>bootstrap 호출·완료 전 수집 대기·동의 상태·초기화 안내·독자별 큐<\/td><td>새로고침·재방문 때 reader_id 유지·쿠키 없는 경우 기본 피드<\/td><\/tr><tr><td>백엔드<\/td><td>토큰 생성·해시 연결표·만료·폐기·독자 검증·삭제 경로<\/td><td>조작된 reader_id 거절·토큰 만료 처리·헤더 속성 확인<\/td><\/tr><tr><td>인프라<\/td><td>HTTPS·프론트/API 주소·프록시·CORS·캐시 정책<\/td><td>배포 환경에서 Set-Cookie와 다음 요청 Cookie 확인<\/td><\/tr><tr><td>데이터·ML<\/td><td>anonymous 분리 집계·신규 플래그·보관·삭제 전파<\/td><td>같은 독자의 전후 이벤트 연결·다른 데이터 출처 혼합 금지<\/td><\/tr><\/tbody><\/table><\/div><p>회의에서 쿠키 30일의 고정 만료와 방문 시 연장 중 하나를 정하고 서버 만료와 맞춘다. 첫 두 탭이 동시에 열려 독자 두 개가 발급되는 경쟁도 검증한다. bootstrap을 탭 간 조율하고 재확인하는 방법을 검토하되 HttpOnly 토큰을 JavaScript로 읽게 바꾸지 않는다. 확인된 독자 컨텍스트가 바뀌었을 때 이전 큐를 새 독자에게 재귀속하지 않는다.<\/p><p>핵심 검증은 첫 방문 → 클릭 저장 → 브라우저 종료 → 재방문 → 동일 reader_id와 과거 행동 조회다. 이어 쿠키 삭제 후 새 독자로 처리되는지, 다른 브라우저가 별도 독자가 되는지, 30분 이후 session_id만 바뀌는지 확인한다. 저장 성공은 실제 서버 DB 행을 읽어 확인하며 이 문서 작성 시점에는 구현·실행하지 않았다.<\/p><h2 id=\"section-119\">8 CTR 모델 피처와 라벨 설계<\/h2><p>CTR은 정의한 노출 중 클릭으로 이어진 비율이다. pCTR은 독자·기사·상황이 주어졌을 때 클릭할 확률의 예측값이다. ‘상단 카드라서 많이 눌렸다’는 위치 효과와 ‘관심이 있어서 눌렀다’는 효과가 섞일 수 있으므로 노출 순위를 보관해야 한다.<\/p><p>MIND는 제시한 기사와 클릭·미클릭, 이전 클릭 이력을 함께 제공한다. EB-NeRD는 기사 정보, 노출 로그, 이전 클릭 이력과 읽기·스크롤 관련 정보를 제공한다. 이를 참고하되 두 데이터셋의 노출 정의가 우리 브라우저의 50%·1초 측정 규칙과 동일하다고 가정하지 않는다. [S1][S2]<\/p><h3 id=\"section-122\">8.1 학습 표본과 CTR 분모<\/h3><p>초기 모델은 ‘서버가 제공한 추천 항목 중 관측 기간 내 클릭 여부’를 예측하는 served-item CTR로 시작하는 방안을 제안한다. 한 표본은 recommendation_id+article_id 조합이다. 서버는 실제 페이지 응답에 포함한 항목의 served_at을 기록하고 아직 내려주지 않은 다음 페이지 후보는 분모에서 제외한다. 응답 기록은 브라우저 수신을 보장하지 않으므로 통신 실패에 따른 오차는 남는다. 실제 화면 노출이 확인된 항목만 대상으로 계산한 viewable CTR은 별도 지표로 보고한다. 둘의 이름과 분모를 섞지 않는다.<\/p><div class=\"table\"><table><thead><tr><th>구분<\/th><th>분모 또는 대상<\/th><th>장점과 한계<\/th><\/tr><\/thead><tbody><tr><td>제공 기준 CTR<\/td><td>제공된 고유 추천 항목<\/td><td>빠른 클릭을 포함·아래쪽 미열람 항목도 미클릭에 포함됨<\/td><\/tr><tr><td>가시 노출 기준 CTR<\/td><td>조건을 만족한 고유 노출<\/td><td>관측 가능한 선택 기회에 가까움·빠른 클릭이 제외될 수 있음<\/td><\/tr><\/tbody><\/table><\/div><p>초기 클릭 관측 기간은 항목별 최초 served_at 이후 30분을 제안한다. 같은 추천·기사의 클릭이 여러 번 있어도 라벨은 1이다. 관측 기간이 끝나고 지연 수신 유예 기간까지 지난 항목만 미클릭 0으로 확정한다. 유예 기간은 수집 지연을 측정한 뒤 정한다. 창을 벗어난 클릭은 원본에 남기되 이 라벨에는 포함하지 않는다. 빠른 클릭은 제공 기준 표본에는 포함되고, 가시 노출 기준에서는 별도로 분리 보고한다.<\/p><h3 id=\"section-126\">8.2 피처 후보와 제공 담당<\/h3><p>모든 ‘과거’ 집계는 현재 추천 시각 이전 데이터만 사용한다. 아래 기간과 계산법은 초기 제안이며 비교 실험 대상이다.<\/p><div class=\"table\"><table><thead><tr><th>피처<\/th><th>계산 또는 값<\/th><th>원천과 담당<\/th><th>결측 처리<\/th><\/tr><\/thead><tbody><tr><td>reader_clicks_7d<\/td><td>직전 7일 유효 클릭 수<\/td><td>원본 이벤트 / 데이터<\/td><td>관측 이력 없으면 0과 신규 플래그<\/td><\/tr><tr><td>category_click_share_7d<\/td><td>카테고리 클릭 수 / 전체 클릭 수<\/td><td>정제 이벤트 / 데이터<\/td><td>분모 0이면 결측 플래그와 대체값<\/td><\/tr><tr><td>category_active_time_7d<\/td><td>과거 해당 카테고리 기사 활성 체류 합계<\/td><td>체류 증가분 / 데이터<\/td><td>미측정과 0 구분<\/td><\/tr><tr><td>article_category<\/td><td>기사 카테고리 ID<\/td><td>기사 저장소 / 수집·백엔드<\/td><td>unknown 범주<\/td><\/tr><tr><td>article_age_hours<\/td><td>추천 시각과 발행 시각 차이<\/td><td>기사·추천 시각 / 데이터<\/td><td>잘못된 미래 발행 시각 검사<\/td><\/tr><tr><td>article_ctr_24h<\/td><td>직전 24시간 제공 기준 클릭률<\/td><td>추천 항목·클릭 / 데이터<\/td><td>적은 표본은 전체 평균 쪽으로 보정·표본 수 함께<\/td><\/tr><tr><td>text_similarity<\/td><td>과거 읽은 기사와 후보의 텍스트 유사도<\/td><td>본문·이력 / ML<\/td><td>신규는 미측정·후속 도입<\/td><\/tr><tr><td>request_hour_kst<\/td><td>요청 시각의 한국 시간대<\/td><td>서버 요청 시각 / 백엔드<\/td><td>서버 시각 사용<\/td><\/tr><tr><td>history_status<\/td><td>new / insufficient / sufficient<\/td><td>유효 이력 / 백엔드·ML<\/td><td>미정 상태를 신규와 혼동하지 않음<\/td><\/tr><\/tbody><\/table><\/div><p>과거 기사 CTR 피처도 예측 시점에 관측 기간과 수신 유예가 끝난 표본만 사용한다. 아직 미클릭 여부가 확정되지 않은 항목을 0으로 채우지 않는다.<\/p><p>rank는 기본 모델 입력보다 진단·위치 편향 분석용으로 먼저 저장한다. 순위를 예측 전에 알 수 없는 구조에서 최종 rank를 피처로 사용하면 서빙과 학습이 어긋난다. 위치를 포함한 모델은 ‘해당 위치에 배치했을 때의 클릭’으로 목표를 따로 정의해야 한다.<\/p><h3 id=\"section-131\">8.3 누출 방지와 평가<\/h3><p>현재 클릭의 결과, 현재 상세 체류, 현재 스크롤은 해당 클릭의 사전 예측 피처로 사용하면 안 된다. 이후 추천에서의 과거 이력으로는 사용할 수 있다. 추천 시각이 t라면 occurred_at &lt; t이고 received_at &lt;= t인 관측만 후보로 삼고 feature_as_of &lt;= t를 보장한다. 당시 사용한 피처 버전 또는 재현 가능한 스냅샷을 저장한다.<\/p><p>시간순으로 학습·검증·테스트를 나눈다. 테스트 기간 클릭을 이전 관심사 집계에 포함하지 않는다. 가상 시뮬레이터, 사람이 조작한 가상 독자, 실제 이용자 데이터는 데이터셋 구분자로 분리하고 결과를 따로 보고한다. 시뮬레이터의 행동 규칙을 모델이 맞혔다고 실제 독자의 추천 품질을 입증한 것으로 해석하지 않는다.<\/p><p>처음에는 최신순·인기순을 기준선으로 두고 간단한 로지스틱 회귀 같은 모델부터 비교하는 방안을 제안한다. AUC와 Log loss는 클릭 분류·확률 품질을, NDCG@K는 목록 내 순위 품질을 살핀다. 단일 클래스나 양성 없는 묶음의 지표 처리 규칙을 명시한다. 실제 온라인 CTR 향상은 별도 비교 실험 전에는 주장하지 않는다.<\/p><h2 id=\"section-135\">9 신규 독자와 갱신 정책<\/h2><div class=\"table\"><table><thead><tr><th>상태<\/th><th>제안 동작<\/th><th>화면 설명<\/th><\/tr><\/thead><tbody><tr><td>이력 없음<\/td><td>인기 집계가 있으면 인기·없으면 최신<\/td><td>둘러보기용 기본 추천<\/td><\/tr><tr><td>이력 부족<\/td><td>가용 이력과 기본 추천 사용·모델 미적용 가능<\/td><td>학습 기반으로 단정하지 않는 안내<\/td><\/tr><tr><td>충분한 이력·모델 정상<\/td><td>모델 점수로 정렬·정책 적용<\/td><td>서버가 제공한 추천 이유<\/td><\/tr><tr><td>모델 실패<\/td><td>가능한 대체 전략으로 응답·모두 실패하면 503<\/td><td>대체 추천 또는 재시도 안내<\/td><\/tr><\/tbody><\/table><\/div><p>유효 클릭 0개=new, 1~4개=insufficient, 5개 이상=sufficient는 기존 초안의 임시 구분이다. 클릭 5개가 모델 준비나 품질을 보장하지 않으며 ML 담당자가 최소 데이터와 평가 결과로 수정한다. 배치 주기·캐시 유효시간·독자에게 결과가 바뀌는 시점은 미정이다. 생성 시각과 피처 기준 시각을 응답해 갱신 지연을 설명한다.<\/p><h2 id=\"section-138\">10 프론트엔드 구현 계획과 검증<\/h2><h3 id=\"section-139\">10.1 코드 연결 위치<\/h3><div class=\"table\"><table><thead><tr><th>현재 파일<\/th><th>다음 변경 제안<\/th><\/tr><\/thead><tbody><tr><td>src/data.js<\/td><td>시연 데이터로 유지·API의 실제 데이터와 구분<\/td><\/tr><tr><td>src/service.js<\/td><td>가상 조회와 실제 API 호출의 교체 지점·응답을 화면 형식으로 매핑<\/td><\/tr><tr><td>src/app.js<\/td><td>피드·상세 상태와 요청 수명 관리·수집 호출 연결<\/td><\/tr><tr><td>src/style.css<\/td><td>실제 제목 길이·이미지 누락·모바일 카드 크기 대응<\/td><\/tr><tr><td>신규 이벤트 모듈<\/td><td>가시성·체류·ID 생성·전송 큐를 화면 렌더링과 분리<\/td><\/tr><tr><td>tests 및 브라우저 검증<\/td><td>계약 샘플·중복·독자 전환·실제 화면 조작 확인<\/td><\/tr><\/tbody><\/table><\/div><p>기존 코드는 id/readerId 등 화면 내부 형식을 사용하고 계약은 article_id/reader_id를 제안한다. API 어댑터에서 명시적으로 변환하거나 내부 형식을 함께 정리한다. 이름이 다르다는 이유로 화면 전체에 임시 변환을 흩뿌리지 않는다. 실제 수집을 켜면 현재 화면의 ‘클릭과 읽기 시간을 외부로 전송하지 않는다’는 안내도 실제 동작에 맞게 바꾼다.<\/p><h3 id=\"section-142\">10.2 작은 단위로 연결하는 순서<\/h3><ol><li>API 샘플과 이벤트 스키마 합의. 정상·신규·빈 결과·오류의 고정 입력으로 프론트 검증.<\/li><li>독자·피드·상세 API 연결. 서버의 추천 순서와 이유가 그대로 보이는지 확인.<\/li><li>클릭·상세 열림 수집 연결. Cloud Storage 원본의 ID와 화면에서 선택한 대상을 대조.<\/li><li>노출·체류·재전송 연결. 중복·탭 숨김·독자 전환을 실제 브라우저로 검증.<\/li><li>집계와 CTR 표본 검증. 한 독자의 행동에서 집계·피처·라벨까지 역추적.<\/li><li>모델 또는 대체 추천 연결. 독자별 결과 차이·이유·데이터 기준 시각 확인.<\/li><\/ol><p>각 단계의 예상 소요 시간은 담당자 배정 후 정한다. ‘데이터 수집 완료’는 큐에 들어간 순간이 아니라 Cloud Storage 업로드와 원본 조회를 확인한 시점으로 정의한다.<\/p><h3 id=\"section-145\">10.3 수용 시나리오<\/h3><div class=\"table\"><table><thead><tr><th>실제 입력 또는 조작<\/th><th>기대 결과<\/th><\/tr><\/thead><tbody><tr><td>독자 A와 B로 각각 피드 요청<\/td><td>올바른 대상·추천 ID·이유 표시·최종 모델 연결 후 결과 차이 검토<\/td><\/tr><tr><td>보이는 카드 1개·화면 밖 카드 1개<\/td><td>조건을 만족한 카드만 노출 이벤트<\/td><\/tr><tr><td>1초 이전 빠른 클릭<\/td><td>클릭 보존·가짜 노출 없음·학습과 지표에서 명시적 처리<\/td><\/tr><tr><td>상세 진입 실패<\/td><td>클릭은 남음·article_view는 없음<\/td><\/tr><tr><td>상세 활성 10초+10초+3초·중간 숨김 20초<\/td><td>수신한 체류 증가분 합계 23,000ms·숨김 시간 제외<\/td><\/tr><tr><td>동일 클릭 이벤트 두 번 전송<\/td><td>동일 배치면 duplicate·다른 배치면 원본 중복 허용·Silver와 집계는 한 번<\/td><\/tr><tr><td>A 클릭 직후 B 전환·A 응답 지연<\/td><td>A 이벤트는 A 유지·B 화면 유지<\/td><\/tr><tr><td>직접 상세 열기<\/td><td>추천·클릭 출처 null·상세 열림과 체류만 기록<\/td><\/tr><tr><td>추천 이후 클릭·늦게 수신한 과거 이벤트<\/td><td>과거 추천 피처에 소급 포함되지 않음<\/td><\/tr><tr><td>모바일·키보드·새 탭 조작<\/td><td>카드 읽기와 이동 가능·중복 수집과 출처 누락 여부 확인<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"section-147\">11 회의 진행과 합의 기록<\/h2><h3 id=\"section-148\">11.1 40분 회의안<\/h3><p>처음 5분은 화면과 현재 구현 범위를 공유한다. 다음 10분은 API 요청 흐름·식별자를 맞추고, 다음 10분은 노출·클릭·체류·CTR 분모를 결정한다. 다음 10분은 피처·누출 방지·대체 추천을 검토한다. 마지막 5분은 담당자와 다음 검증 일정을 기록한다. 멘토링 시간에 맞춰 조정할 제안이다.<\/p><h3 id=\"section-150\">11.2 팀이 채울 결정표<\/h3><div class=\"table\"><table><thead><tr><th>의제<\/th><th>프론트 담당 제안<\/th><th>협의 대상<\/th><th>결정 및 담당자<\/th><\/tr><\/thead><tbody><tr><td>실제 이용자와 가상 독자 범위<\/td><td>첫 시연은 가상 독자·발생 경로 분리<\/td><td>전원<\/td><td>미정<\/td><\/tr><tr><td>비로그인 재방문 식별<\/td><td>쿠키 토큰·서버 독자 연결표·행동은 서버 저장<\/td><td>프론트·백엔드<\/td><td>미정<\/td><\/tr><tr><td>쿠키와 배포 주소<\/td><td>30일은 논의안·동일 출처 API 우선·수집 허용 범위 결정<\/td><td>인프라·백엔드·기획<\/td><td>미정<\/td><\/tr><tr><td>초기 관심사 입력<\/td><td>미합의·MVP 제외·도입 시 별도 검토<\/td><td>전원<\/td><td>미정<\/td><\/tr><tr><td>화면 범위<\/td><td>피드·상세·기본 상태·독자 시연<\/td><td>기획·백엔드<\/td><td>미정<\/td><\/tr><tr><td>본문 제공 방식<\/td><td>내부 본문 API·외부 원문 이동은 별도<\/td><td>수집·백엔드<\/td><td>미정<\/td><\/tr><tr><td>API 관리 방식<\/td><td>백엔드 명세·프론트 공동 검토<\/td><td>백엔드<\/td><td>미정<\/td><\/tr><tr><td>노출 규칙<\/td><td>활성 탭·50%·1초·카드 크기 검증<\/td><td>데이터·ML<\/td><td>미정<\/td><\/tr><tr><td>빠른 클릭과 CTR 분모<\/td><td>제공 기준 학습·가시 노출 지표 별도<\/td><td>데이터·ML<\/td><td>미정<\/td><\/tr><tr><td>클릭 관측 기간<\/td><td>30분·수신 지연 유예 별도<\/td><td>데이터·ML<\/td><td>미정<\/td><\/tr><tr><td>체류 보고<\/td><td>밀리초 증가분·10초 주기<\/td><td>데이터·백엔드<\/td><td>미정<\/td><\/tr><tr><td>이벤트 로그 저장<\/td><td>Cloud Storage → BigQuery 배치 권장·업로드 후 수락<\/td><td>프론트·백엔드<\/td><td>미정<\/td><\/tr><tr><td>수집 서비스와 DB<\/td><td>기존 백엔드 또는 Cloud Run·별도 방문자 DB 선택<\/td><td>백엔드·인프라<\/td><td>미정<\/td><\/tr><tr><td>분석 적재<\/td><td>BigQuery 배치·manifest·중복·주기 결정<\/td><td>데이터·ML<\/td><td>미정<\/td><\/tr><tr><td>Pub/Sub 도입<\/td><td>초기 필수 아님·장애 분리 요구가 생기면 재검토<\/td><td>백엔드·인프라<\/td><td>미정<\/td><\/tr><tr><td>저장소·보관·접근 제어<\/td><td>논리 구조부터 합의·30일은 논의안<\/td><td>백엔드·인프라<\/td><td>미정<\/td><\/tr><tr><td>신규 독자와 모델 장애<\/td><td>인기 → 최신<\/td><td>ML·백엔드<\/td><td>미정<\/td><\/tr><tr><td>피처와 추천 갱신 주기<\/td><td>생성 시각·feature_as_of 제공<\/td><td>데이터·ML<\/td><td>미정<\/td><\/tr><tr><td>첫 연동 확인 시점<\/td><td>샘플 계약 확정 후 일정 배정<\/td><td>전원<\/td><td>미정<\/td><\/tr><\/tbody><\/table><\/div><h3 id=\"section-152\">11.3 프론트 담당자의 발표 문장<\/h3><p>“현재 화면은 가상 데이터로 만든 검토용 초안입니다. 저는 추천 목록과 상세를 API로 연결하고, 실제 화면 노출·클릭·상세 열림·활성 체류를 기록하는 부분을 맡는 방향을 제안합니다. 추천 결과를 표시하는 데 필요한 필드와 학습에 필요한 행동 ID를 오늘 맞추고 싶습니다. 특히 CTR에서 내려준 기사를 분모로 볼지 실제 보인 기사만 볼지, 클릭 관측 기간을 어떻게 둘지 합의가 필요합니다. 계약이 정해지면 모델이 완성되기 전에도 샘플 응답으로 화면과 이벤트 저장을 단계적으로 검증할 수 있습니다.”<\/p><p>멘토에게는 노출 기준과 라벨의 적절성, 가상 데이터 평가의 한계, 초기 모델에 꼭 필요한 피처, 현 규모에 맞는 저장 구조를 질문한다. 답변은 결정표에 남기고 API·이벤트 계약 버전과 담당자를 갱신한다.<\/p><h2 id=\"section-155\">12 참고 자료와 용어<\/h2><p>공개 자료는 설계의 참고 근거이며 이 프로젝트의 구현·성능 증거가 아니다. 조회일은 2026년 10월 29일이다.<\/p><ul><li>[S1] <a href=\"https://msnews.github.io/\">Microsoft MIND<\/a> · 노출 목록·클릭 여부·이전 클릭 이력을 함께 저장하는 뉴스 추천 데이터 사례.<\/li><li>[S2] <a href=\"https://recsys.eb.dk/dataset/\">EB-NeRD 데이터셋<\/a> · 기사·행동·과거 이력 및 읽기 시간·스크롤 데이터 참고.<\/li><li>[S3] <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API\">MDN Intersection Observer<\/a> · 요소와 화면 영역의 교차 관찰. 이 문서의 50%·1초는 우리 팀 제안이다.<\/li><li>[S4] <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Navigator/sendBeacon\">MDN sendBeacon<\/a> · 분석 데이터의 비동기 전송·큐 수락과 최종 저장의 차이 참고.<\/li><li>[S5] <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie\">MDN Set Cookie<\/a> · 쿠키 설정·전송 범위·속성 참고.<\/li><li>[S6] <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies\">MDN HTTP 쿠키 사용<\/a> · 브라우저 쿠키 처리와 쿠키 이름 접두사 참고.<\/li><li>[S7] <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch\">MDN Fetch API 사용<\/a> · credentials와 교차 출처 요청 참고.<\/li><li>[S8] <a href=\"https://webkit.org/tracking-prevention/\">WebKit 추적 방지<\/a> · 브라우저 저장소·추적 방지 정책에 따른 지속 식별 한계 참고.<\/li><li>[S9] <a href=\"https://docs.cloud.google.com/bigquery/docs/write-api-streaming\">BigQuery Storage Write API<\/a> · 직접 기록과 기본 스트림의 중복 가능성 참고.<\/li><li>[S10] <a href=\"https://docs.cloud.google.com/bigquery/docs/batch-loading-data\">BigQuery 배치 적재<\/a> · 파일 기반 후속 적재 참고.<\/li><li>[S12] <a href=\"https://docs.cloud.google.com/storage/docs/request-preconditions\">Cloud Storage 요청 전제조건<\/a> · 조건부 객체 생성과 재시도 참고.<\/li><li>[S11] <a href=\"https://docs.cloud.google.com/run/docs/container-contract\">Cloud Run 컨테이너 실행 계약<\/a> · 임시 파일시스템과 포트·바인딩 제약 참고.<\/li><li>내부 인프라 비교 자료 · gcp-behavior-logging-research.md. Pub/Sub 없는 대안과 서비스별 역할·공식 출처를 함께 정리했다.<\/li><li>프로젝트 내부 근거 · frontend_backend_contract_v0.1.md, frontend/src/app.js, frontend/src/service.js, frontend/src/data.js 및 asac-news-frontend의 현재 코드.<\/li><\/ul><div class=\"table\"><table><thead><tr><th>용어<\/th><th>이 문서에서의 의미<\/th><\/tr><\/thead><tbody><tr><td>이벤트<\/td><td>한 번 발생한 관측 가능한 행동 기록<\/td><\/tr><tr><td>피처<\/td><td>예측 시점에 사용할 수 있는 입력 값<\/td><\/tr><tr><td>라벨<\/td><td>관측 기간 안의 클릭 여부 등 학습 정답<\/td><\/tr><tr><td>CTR<\/td><td>합의된 분모에 대한 클릭 비율<\/td><\/tr><tr><td>pCTR<\/td><td>모델이 예측한 클릭 확률<\/td><\/tr><tr><td>대체 추천<\/td><td>모델 대신 인기·최신 규칙을 사용한 결과<\/td><\/tr><tr><td>멱등성<\/td><td>같은 요청을 재시도해도 동일 작업이 중복 반영되지 않는 성질<\/td><\/tr><tr><td>데이터 누출<\/td><td>미래 정보나 정답 정보가 예측 입력으로 들어가는 문제<\/td><\/tr><\/tbody><\/table><\/div><\/main>\n<\/div>\n<\/body>\n<\/html>\n", "yunmo": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>추천 모델 청사진<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout: one reading column, sections in design order, each closing with its flags; flag index at the end */\n:root {\n  --bg: #f6f7f8; --surface: #ffffff; --line: #d9dde2; --fg: #1d2329; --muted: #5d6873;\n  --accent: #1f6f8b; --accent-soft: #e3f0f5;\n  --risk: #b3261e; --risk-soft: #fbe9e7;\n  --decide: #8a5a00; --decide-soft: #fdf1d8;\n  --unsure: #5b3fa8; --unsure-soft: #eee9fa;\n  --pick: #1d6b3a; --pick-soft: #e2f3e8;\n  --body: \"Noto Sans KR\", \"Malgun Gothic\", \"Apple SD Gothic Neo\", sans-serif;\n  --mono: \"JetBrains Mono\", Consolas, monospace;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) {\n  --bg: #15191d; --surface: #1d2328; --line: #343c44; --fg: #e6e9ec; --muted: #9aa5b0;\n  --accent: #6cc3dc; --accent-soft: #173640;\n  --risk: #f2958c; --risk-soft: #3d1f1c; --decide: #f0c070; --decide-soft: #3a2e14;\n  --unsure: #b9a4f0; --unsure-soft: #2c2445; --pick: #7fd19c; --pick-soft: #18331f; color-scheme: dark; } }\n:root[data-theme=\"dark\"] {\n  --bg: #15191d; --surface: #1d2328; --line: #343c44; --fg: #e6e9ec; --muted: #9aa5b0;\n  --accent: #6c
